# THE FAITHFUL-COMMITMENT GATE (ast-grep).
#
# Law (docs/FAITHFUL-COMMITMENT-LAW.md): every 32-byte component that flows into
# the deployed STATE COMMITMENT must bind its SOURCE at the system's own
# soundness strength (~124-bit, the 8-felt `bytes32_to_8_limbs` encoding), NEVER
# a lossy 256->31-bit projection.
#
# `fold_bytes32_to_bb(x)` (circuit/src/effect_vm/helpers.rs) is a Horner fold of
# 32 bytes into ONE BabyBear: a ~31-bit (1/p collision) tag. It is a fine
# CONSISTENCY tag (e.g. the D5 PI cross-bindings, where the real binding is the
# note-spend proof + the committed set), but in a commitment / `pre_limbs`
# position it is the bug that cost weeks to grind back to faithful 8-felt.
#
# A bare `BabyBear` limb carries no evidence of faithful-vs-degraded, so a lossy
# fold can slide into the commitment silently. This rule makes it a PR-time
# error in the commitment-bearing producers. The faithful counterpart is
# `bytes32_to_8_limbs` / `hash_many_8` / the 8-felt limb groups.
#
# Allowlisting an intentional residual: put the human reason on a comment line
# ABOVE, then the directive ON ITS OWN LINE directly above the offending line:
#   // ast-grep-ignore: degraded-felt-commitment
# (the text after the colon is parsed by ast-grep as a rule-id list, so the
# REASON must live on its own comment line, not after the colon).
#
# ⚑ NOT TRAILING. Measured 2026-07-31: a trailing directive suppresses only when the
# match sits on a line that ENDS its enclosing expression. On a method-chain
# continuation —
#     .map(|c| HeapLeaf::entry(fold_bytes32_to_bb(&c.0), ZERO)) // ast-grep-ignore: …
# — it does NOT suppress, while the identical directive on its own preceding line
# does. This file and docs/FAITHFUL-COMMITMENT-LAW.md both instructed the trailing
# form, so a lane recording an EARNED residual on a `.map(…)` line got a red it could
# not clear and no explanation. Own-line is the form that works for BOTH shapes.
id: degraded-felt-commitment
language: rust
severity: error
# Scope: ONLY the deployed state-commitment producers. Non-commitment folds
# (executor/SDK per-effect param projectors, D5 cross-binding reconstruction,
# tests) are out of scope by design -- the fold is sound THERE.
files:
  - "cell/src/commitment.rs"
  - "turn/src/rotation_witness.rs"
  - "circuit/src/effect_vm/trace_rotated.rs"
  # ⚑ ADDED 2026-07-31 — the two WORST `fold_bytes32_to_bb` sites in the tree were outside
  # this rule for its entire life. `accumulator_leaf` squeezes a 32-byte address into ONE
  # felt by an onto linear form, keying a tree that SILENTLY DEDUPES colliding addresses —
  # i.e. double-spend — and the gate reported PASS the whole time.
  - "cell/src/commitment_set.rs"
  - "cell/src/nullifier_set.rs"
  # ⚑ ADDED 2026-07-31 (second pass) — the SAME `accumulator_leaf` shape in the two SIBLING
  # ledger accumulators, plus the node's PI projector. The 07-31 widening above was found by a
  # lane auditing the map-op schema and it stopped at the two files that lane happened to be in;
  # a sweep of every `fold_bytes32_to_bb` call site in the tree found three more in genuine
  # commitment positions. Naming only the instances one audit tripped over is how the scope
  # became a habit the first time.
  #
  #   * cell/src/revoked_set.rs:284 — `RevokedSet::accumulator_leaf`. Its own doc: "the committed
  #     `revoked_root` group is opened in-circuit against a `CanonicalHeapTree8` built from these
  #     leaves". Two credential nullifiers aliasing at ~31 bits ⇒ one revocation silently absorbs
  #     the other ⇒ a REVOKED CREDENTIAL READS AS LIVE. Exactly the double-spend argument the
  #     comment above makes for commitment_set.rs, on the revocation side.
  #   * cell/src/shielded_note_set.rs:279 — `ShieldedNoteSet::accumulator_leaf`, and the WORST of
  #     the four: the leaf VALUE column is `BabyBear::ZERO` (a hiding leaf), so the folded address
  #     is the ONLY distinguishing content in the leaf. An address collision makes two shielded
  #     notes literally the same leaf. The module's own honest-scope block says `root8()` is not
  #     yet AIR-bound — which is precisely when you want the gate on it, before the wiring lands.
  #   * node/src/turn_proving.rs:1159 — `nullifier_to_field`, whose image IS a published public
  #     input (`PI[NOTESPEND_NULLIFIER]`) and ALSO the key the double-spend freshness search
  #     (`spent_set.binary_search_by_key`) and the `canonical_spent_nullifier_set` consensus
  #     anchor run on. The only fold in `node/`, in a crate this rule had never scanned.
  - "cell/src/revoked_set.rs"
  - "cell/src/shielded_note_set.rs"
  - "node/src/turn_proving.rs"
# ⚑ THE RULE IS NAME-BOUND, SO IT MUST NAME EVERY ALIAS (widened 2026-08-01).
#
# `fold_bytes32_to_bb` is not the only spelling of this arithmetic. Two functions elsewhere in
# the tree have BYTE-IDENTICAL bodies under different names —
#
#   circuit/src/cap_root.rs:269           pub fn fold_bytes32(b)  -> hash_many(bytes32_to_8_limbs(b))
#   circuit/src/openable_fields_root.rs   pub fn fold_value32(b)  -> hash_many(bytes32_to_8_limbs(b))
#
# — and for this rule's entire life they were INVISIBLE TO IT even inside files it already
# scanned. Measured: `cell/src/commitment.rs:561` is `cap_root::fold_bytes32(cap.target)`, the
# cap-tree leaf's target field in the DEPLOYED canonical state commitment, sitting in a scoped
# file with the gate reporting PASS. A gate that greps one identifier polices a NAME, not the
# class; the class is "32 bytes squeezed to one felt in a commitment position", and every name
# that spells it has to be listed here or the next rename is a fresh blind spot.
rule:
  any:
    - pattern: fold_bytes32_to_bb($_)
    - pattern: $$$::fold_bytes32_to_bb($_)
    - pattern: fold_bytes32($_)
    - pattern: $$$::fold_bytes32($_)
    - pattern: fold_value32($_)
    - pattern: $$$::fold_value32($_)
message: >-
  Degraded felt in a state-commitment position: `fold_bytes32_to_bb` folds 32
  bytes -> ONE BabyBear (~31-bit). A committed component must bind its source at
  ~124-bit. Use `bytes32_to_8_limbs` (8-felt). If this is a deliberate,
  proof-backed residual, document the reason on a line above and put
  `// ast-grep-ignore: degraded-felt-commitment` ON ITS OWN LINE directly above the
  offending line (a TRAILING directive does not suppress on a method-chain line).
  See docs/FAITHFUL-COMMITMENT-LAW.md.
note: |
  This is the ast-grep flavor of the never-again gate. The type-wall capstone
  (a `Faithful8` newtype the compiler enforces) comes after the
  faithful-commitment campaign lands cap/heap/fields_root at 8-felt.
---
# THE 2nd DEGRADED-FELT SHAPE: the [var X; 8] REPLICATE.
#
# A genuine 8-felt commitment digest carries EIGHT DISTINCT lanes (the node8
# `root8` / `bytes32_to_8_limbs` image). Splatting ONE scalar across all 8 lanes
# (`[root; 8]`) is the degenerate that is STILL 31-bit — the lane-0 projection
# wearing an 8-wide coat. This is the shape the accumulator (nullifier@26 ·
# commitments@27 · cells@0) campaign refuted: the producers now fill
# `root8[lane]` lane-for-lane, never `[scalar; 8]`.
#
# Zero-initializers (`[ZERO; 8]`, `[0; 8]`, `[0u32; 8]`) are legitimate scratch
# buffers, NOT commitments, and are excluded. A deliberate residual (e.g. a
# genuinely-not-yet-welded family) is suppressed by putting, ON ITS OWN LINE
# directly above the offending line (NOT trailing — see the ⚑ note on the rule above):
#   // ast-grep-ignore: replicated-felt-commitment
id: replicated-felt-commitment
language: rust
severity: error
files:
  - "cell/src/commitment.rs"
  - "turn/src/rotation_witness.rs"
  - "circuit/src/effect_vm/trace_rotated.rs"
  # ⚑ ADDED 2026-07-31 — the two WORST `fold_bytes32_to_bb` sites in the tree were outside
  # this rule for its entire life. `accumulator_leaf` squeezes a 32-byte address into ONE
  # felt by an onto linear form, keying a tree that SILENTLY DEDUPES colliding addresses —
  # i.e. double-spend — and the gate reported PASS the whole time.
  - "cell/src/commitment_set.rs"
  - "cell/src/nullifier_set.rs"
  # ⚑ ADDED 2026-07-31 (second pass). KEEP THIS BLOCK BYTE-IDENTICAL TO THE ONE IN THE RULE
  # ABOVE — `scripts/check-no-degraded-felt.sh` now DERIVES its scan scope from these blocks and
  # REFUSES (exit 2) if the two disagree, so a one-sided edit is a hard failure rather than a
  # rule that quietly covers less than its sibling. Rationale for each path is documented once,
  # on the `degraded-felt-commitment` rule above.
  - "cell/src/revoked_set.rs"
  - "cell/src/shielded_note_set.rs"
  - "node/src/turn_proving.rs"
rule:
  pattern: "[$X; 8]"
  kind: array_expression
  not:
    any:
      - pattern: "[0; 8]"
      - pattern: "[0u32; 8]"
      - pattern: "[$_::ZERO; 8]"
      - pattern: "[$_::ONE; 8]"
message: >-
  Replicated felt in a state-commitment position: `[X; 8]` splats ONE scalar
  across all 8 lanes — a degenerate 8-felt that is STILL ~31-bit (the lane-0
  projection). A genuine 8-felt digest carries 8 DISTINCT lanes (node8 `root8`).
  Fill `root8[lane]` lane-for-lane. If this is a deliberate, proof-backed
  residual, document the reason on a line above and put
  `// ast-grep-ignore: replicated-felt-commitment` ON ITS OWN LINE directly above the
  offending line (a TRAILING directive does not suppress on a method-chain line).
  See docs/FAITHFUL-COMMITMENT-LAW.md.
