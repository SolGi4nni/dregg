name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manually re-runnable. Also the escape hatch for a real gap: a workflow that pushes with
  # the default GITHUB_TOKEN (e.g. lean-seed.yml's `pin` job writing lean-seed.pin) does NOT
  # re-trigger workflows — GitHub suppresses it to prevent loops. So the CI-authored pin commit
  # that ARMS the Lean marshal gate cannot, by itself, trigger the CI run that would arm it.
  # `workflow_dispatch` lets that arming run be kicked without waiting for the next human push.
  workflow_dispatch:

# Explicit least-privilege. The repo default is ALREADY `read`
# (`gh api repos/emberian/dregg/actions/permissions/workflow`), so this is
# defense-in-depth, not a hole being closed: every job here runs `cargo build`/
# `cargo test`, i.e. executes the PR-under-test's `build.rs`, so if the repo
# default is ever flipped to read/write this lane must not inherit it.
permissions:
  contents: read

# Cancel superseded PR runs: once a new push lands on a PR, the older run's verdict
# is about code nobody will merge. Each run here is a FULL workspace compile on two
# OSes, so this is the single biggest CI-minute saving available.
# main is deliberately NOT cancelled: a per-commit verdict is what tells you WHICH
# commit broke it, and this repo's main takes rapid pushes from several terminals.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libgl1-mesa-dev libegl-dev libgles-dev libharfbuzz-dev libfreetype-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gperf libunwind-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@v2
      # `--keep-going` (2026-07-25): without it cargo stops scheduling new units at
      # the first failure ("warning: build failed, waiting for other jobs to
      # finish...") and the log ends there. So this step reported ONE broken crate
      # per run out of ~196, and the next push's log showed the next one — which is
      # how a whole directory of rotted examples stayed covered-but-unseen, and how
      # a genuinely NEW break was indistinguishable from the standing red. One flag,
      # no new job, no coverage change: every independent failure now surfaces in
      # the SAME run, and the step still exits non-zero. It is the same reason
      # `clippy-correctness` below already passes `--keep-going`, and it is spelled
      # out in `.github/dark-targets.txt`'s header ("a plain --all-targets run
      # ABORTS at the first broken target and shows you nothing past it").
      # ⚠ NOT sufficient on its own, for the reason that header also gives: a red
      # LIBRARY still prunes its whole downstream cone, so a count taken while any
      # lib is red is a LOWER BOUND. Fix libs first, re-read.
      - run: cargo check --workspace --all-targets --keep-going
      # FEATURE-MATRIX GATES (2026-07-16, Lane 2 config-space audit): `dregg-chain`
      # has NO default features, so the workspace check above compiles NEITHER of
      # its real configurations. Before this gate, the `mock` config's tests had
      # never been compiled by any automated step, and the `on-chain` config (the
      # REAL alloy contract-call verifier) had never been compiled ANYWHERE — a
      # type error in `real_verify_on_chain` was invisible. Both are cheap:
      # mock adds no deps; alloy is already in the lockfile.
      - run: cargo test -p dregg-chain --features mock
      - run: cargo check -p dregg-chain --features on-chain
      # starbridge-polis default features are EMPTY (the pure cell-program library),
      # so `cargo test --workspace` compiles NEITHER the deos surface (src/deos.rs)
      # NOR the AX3 service (src/service.rs) / AX5 reactor (src/reactor.rs) — all three
      # ride a `#[path]`-into-test-binaries dance gated on the `deos` feature to dodge a
      # package-graph cycle (see the crate's [features] note). Their tests
      # (tests/{deos_seam,service,reactor,reexpress_deos_app}.rs) were built by nothing.
      # The feature adds NO new dep to the graph (it only flips the test #[cfg]s; the
      # app-framework/turn/sdk it pulls are dev-deps already built by --workspace), so
      # this reuses the warm target dir above. Mirrors the dregg-chain matrix directly.
      - run: cargo test -p starbridge-polis --features deos
      # dregg-doc has NO `default` key in [features], so — exactly like dregg-chain
      # above — `cargo test --workspace` compiles it FEATURELESS: its 3 ungated test
      # files run, and the 35 tests behind `substrate` compile NOWHERE. That population
      # is the economic-safety surface: tests/staked_bond_slash.rs (a conviction slashes
      # exactly the bond, conservingly; a second slash is refused one-shot; the slash
      # conserves the total across all parties), tests/conviction_unforgeable.rs (the
      # unforgeability gate — Conviction's fields are private and ConvictionEvidence is
      # #[non_exhaustive], so a SlashOutcome can only come from a genuine
      # CiAssurance::evaluate detection), tests/nullifier_root_federation.rs,
      # tests/literate_executor_weld.rs, plus 22 in-src unit tests (pull_request.rs
      # mod landing/required_checks/ci_run_checks, review.rs mod thread).
      # CHEAP: every dep the feature turns on (dregg-turn, dregg-commit, dregg-circuit,
      # dregg-blocklace, ed25519-dalek, serde) is an in-workspace path dep the
      # --workspace lane already builds. No prover, no network, no service.
      # ⚠ NOT compile-verified locally when landed (the local cargo target lock was held
      # by a co-tenant build); the evidence is manifest+source read, same basis as the
      # dregg-chain matrix. If this reds on a compile error, that IS the finding — a test
      # population that had never been built. Fix the drift; do not delete the step.
      - run: cargo test -p dregg-doc --features substrate

  # solana-lock is a DELIBERATE standalone workspace (keeps the Solana/SBF dep
  # tree out of the main one — see solana-lock/Cargo.toml). That isolation also
  # kept its lock/unlock/escrow BanksClient integration tests out of every CI
  # job: they only ran when someone invoked them locally. This job closes that
  # hole; the program tests run natively (solana-program-test, no validator).
  solana-lock:
    name: solana-lock (standalone workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana-lock
      - run: cargo test
        working-directory: solana-lock

  # solana-settlement is the SAME standalone-workspace class as solana-lock, and
  # it had the SAME hole: its settle_flow.rs integration test — the both-polarity
  # gate that VERIFIES the real dregg Groth16 apex proof on-chain via alt_bn128
  # (the identical ark-bn254 arithmetic the sol_alt_bn128_* syscalls use) and
  # REJECTS a forged proof — ran in no CI job. The prior exclude-list note claimed
  # this workspace "needs the SBF toolchain"; that conflated DEPLOYMENT (cargo
  # build-sbf) with TESTING. The tests use solana-program-test's native BanksClient
  # (no validator, no SBF, no build-sbf), exactly like solana-lock — verified green
  # locally: 11 unit + 2 settle_flow integration tests, ~2s. This closes the hole
  # the note itself flagged as "a candidate for a solana-lock-style job later".
  solana-settlement:
    name: solana-settlement (standalone workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solana-settlement
      - run: cargo test --locked
        working-directory: solana-settlement

  # wasm/ is a DELIBERATE standalone workspace, for reasons that are still good:
  # its `[patch]` path-points plonky3-recursion at a sibling checkout, and it
  # force-enables wasm32-only features (getrandom's `wasm_js`, the `no-lean-link`
  # platform gate) that feature-unification would push onto every native crate if
  # it were folded into the root workspace. So it stays standalone — and the
  # SAME isolation that protects the root workspace kept wasm out of every CI
  # job: nothing built it, so nothing could tell you it had rotted.
  #
  # It had. `wasm-bindgen-test` was a stray key inside `[dependencies.web-sys]`'s
  # spec with no `[dev-dependencies]` section at all, so the crate's ~78 tests
  # were UNBUILDABLE — invisible, because no CI job ever compiled them. That
  # manifest bug is fixed; THIS JOB is what keeps it fixed. Mirrors the
  # `solana-lock` job above, which exists for the identical reason.
  #
  # ⚠ THE SIBLING CHECKOUT IS NOT OPTIONAL. `wasm/Cargo.toml`'s `[patch]`
  # path-points `../../plonky3-recursion` (cargo forbids re-pointing a git source
  # to a different rev of the same URL, so the override must be a path patch).
  # Without the clone, cargo cannot even RESOLVE this workspace — the job fails
  # before it compiles a line. REV is the pushed `update-plonky3-rev` tip and is
  # kept in lockstep with wasm/Cargo.toml's comment, pages.yml, extension.yml,
  # and publish-sdk-ts.yml — they must be the SAME circuit or the VK forks.
  wasm:
    name: wasm (standalone workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # include_str!'d staged registries live in LFS (.gitattributes)
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-21
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
      - name: Fetch the plonky3-recursion fork as a sibling (wasm/ patch target)
        run: |
          set -euo pipefail
          REV=0a4a554e144f4e60107555ea7a11cd9969d6208b
          if [ ! -d ../plonky3-recursion/.git ]; then
            git clone --no-checkout https://github.com/emberian/plonky3-recursion ../plonky3-recursion
            git -C ../plonky3-recursion fetch --depth 1 origin "$REV"
            git -C ../plonky3-recursion checkout "$REV"
          fi

      # THE GATE. The ~78 `#[test]`s (68 in src/, 10 in tests/) are ordinary
      # native tests — they are the ones the manifest bug hid, and they run here.
      - name: cargo test (the ~78 native tests the manifest bug hid)
        working-directory: wasm
        run: cargo test

      # The 8 `#[wasm_bindgen_test]`s are a different population: two files carry
      # `wasm_bindgen_test_configure!(run_in_browser)`, so they need a real
      # browser, not node. ubuntu-latest ships Chrome; wasm-pack drives it
      # headless. This is the only place the in-browser surface (the card-in-the-
      # tab loop, the light-client-in-the-tab) is exercised at all.
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: wasm-pack test (the in-browser wasm_bindgen_test surface)
        working-directory: wasm
        run: wasm-pack test --headless --chrome

      # The browser bundle itself must still BUILD for wasm32 — this is the
      # artifact pages.yml serves and the one `sdk-ts`'s differential oracle is
      # built from. A crate whose native tests pass but whose wasm32 build is
      # broken is still rotted.
      - name: Build the wasm32 bundle (the oracle + the pages artifact)
        run: |
          set -euo pipefail
          RUSTFLAGS="-C link-arg=-zstack-size=33554432" \
            wasm-pack build wasm --target web --out-dir pkg --release
          test -s wasm/pkg/dregg_wasm.d.ts

  # EXCLUDED-WORKSPACES GATE (2026-07-17, CI-meaningfulness audit Track A2).
  # The repo-root `Cargo.toml` `exclude` list carries eleven DELIBERATE standalone
  # workspaces (each its own `[workspace]` + Cargo.lock), kept out of the root
  # resolution for `links =` / version-pin conflicts. The isolation is correct —
  # and it is the SAME failure mode every time: `cargo check --workspace` never
  # touches them, so nothing can say they have rotted. discord-bot sat silently
  # uncompilable at HEAD until 2026-07-16; wasm's ~78 tests were unbuildable for
  # the identical reason (see the wasm job above). solana-lock and wasm have their
  # dedicated jobs above; sdk-py is compile+test-gated by publish-sdk-py.yml;
  # solana-settlement has its own solana-lock-style job above (its native
  # BanksClient tests need no SBF). This matrix closes the hole for the remaining
  # buildable five. Still ungated: pg-dregg (cargo-pgrx cdylib — wants a
  # pgrx-managed postgres, not a bare runner) and deos-zed-full (the vendored
  # full-Zed recon spike: gpui/display-bound, same reason the root test job
  # excludes deos-zed).
  #
  # `--locked` is deliberate: these workspaces path-dep into the main tree, so a
  # manifest edit anywhere upstream silently invalidates their committed locks —
  # exactly the drift class that goes unnoticed when nothing builds them. A red
  # here that says "stale Cargo.lock" is fixed by regenerating the lock in that
  # directory (cd <dir> && cargo update -w — or any cargo build there without
  # --locked) and committing it.
  #
  # Toolchains: dtolnay/rust-toolchain exports RUSTUP_TOOLCHAIN, which overrides
  # each directory's rust-toolchain.toml — that is what keeps this lane on the
  # repo's date-pinned nightly instead of the crates' local ROLLING `nightly`
  # pins (deliberately non-reproducible in CI). deos-homeserver is the exception:
  # it pins stable 1.96.1 to match its embedded continuwuity upstream, so its
  # matrix leg carries that toolchain instead.
  excluded-workspaces:
    name: Excluded workspace (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # check-only: its lock resolves dregg-lean-ffi WITHOUT no-lean-link, so
          # test binaries would need the Lean seed archive at link time; `cargo
          # check --all-targets` compiles every target (tests included) without
          # linking, which is the honest hosted-runner gate.
          - dir: discord-bot
            toolchain: nightly-2026-06-21
            timeout: 60
          # no-lean-link end to end — test binaries link clean, so run them.
          - dir: dregg-tui
            toolchain: nightly-2026-06-21
            timeout: 45
            test: true
          # self-contained (vendored sqlite via duroxide; no path deps on the
          # default features) — the full suite runs in seconds. `--features deploy`
          # ALSO compiles tests/deploy.rs (`#![cfg(feature = "deploy")]`), the
          # launchpad seam: it pins a content-addressed microsite + token metadata
          # and re-witnesses each asset against its CID. That test is fully hermetic
          # (dregg_ipfs::MockIpfs + tempdir — no daemon, no network) and was compiled
          # by NOTHING before (default features are `sqlite` only, so plain `cargo
          # test` skipped the whole file). The `pg` feature's tests/pg_weld.rs stays
          # out: it needs a live Postgres, same reason pg-dregg is ungated. Verified
          # green locally: 21+ tests incl. the deploy re-witness, ~2s.
          - dir: durable-workflow
            toolchain: nightly-2026-06-21
            timeout: 30
            test: true
            testflags: '--features deploy'
          # stable 1.96.1 = continuwuity's pin (rust-toolchain.toml there);
          # check-only: the embed is a full Matrix homeserver over a from-source
          # rocksdb — the long pole is the compile, and compiling it is the gate.
          # Its conduwuit dep is a git dep on forgejo.ellis.link (an external
          # forge) — if that host is down this leg fails at fetch, not at build.
          - dir: deos-homeserver
            toolchain: '1.96.1'
            timeout: 90
          # ⚠ EXPECTED RED at introduction (2026-07-17): src/materialize.rs still
          # calls the OLD dregg-doc API (`AtomContent::as_bytes()`, `d.string()?:
          # AtomContent`) — the pre-existing source drift its isolation hid, the
          # same one that reverted the root-workspace fold (see the exclude-list
          # note in the repo-root Cargo.toml). This leg is the tooth that keeps
          # that wound visible until materialize.rs is fixed; do NOT green it by
          # deleting the leg.
          - dir: forge-ci-runner
            toolchain: nightly-2026-06-21
            timeout: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # include_str!'d staged registries live in LFS (.gitattributes)
      # Same system-dep set as the Check job: these workspaces path-dep deep into
      # the main tree (discord-bot alone pulls deos-view + starbridge surfaces),
      # so give every leg the same floor rather than bisecting -sys probes per leg.
      # ...plus ONE package the Check job does not need: `liburing-dev`, for
      # deos-homeserver. Its `conduwuit` git dep is taken with DEFAULT features, and
      # upstream's `default` = `standard` = `[... io_uring, jemalloc, journald,
      # systemd ...]` (src/main/Cargo.toml at the pinned rev 4454e540), so the
      # rust-librocksdb-sys fork builds with `io-uring` on and its build script
      # pkg-config-probes `liburing`, failing the leg before a single crate compiles:
      # "the `io-uring` feature was requested but pkg-config probe for `liburing`
      # failed ... apt-get install liburing-dev". NOTE that deos-homeserver's own
      # Cargo.toml comment claims "Default features = standard + ring (NO
      # jemalloc/io_uring/sentry/systemd)" — that is WRONG as written, because it
      # never sets `default-features = false`; this leg is what makes the actual
      # feature set observable. Installing the dep keeps the gate honest about the
      # graph as it RESOLVES; narrowing the features is a build-behaviour change and
      # belongs to whoever owns that embed.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libgl1-mesa-dev libegl-dev libgles-dev libharfbuzz-dev libfreetype-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gperf libunwind-dev liburing-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}
      # forge-ci-runner's `[patch]` path-points ../../plonky3-recursion (same
      # sibling-checkout requirement as the wasm job above, same REV — they must
      # stay in lockstep or the VK forks; see the wasm job's warning block).
      - name: Fetch the plonky3-recursion fork as a sibling (forge-ci-runner patch target)
        if: matrix.dir == 'forge-ci-runner'
        run: |
          set -euo pipefail
          REV=0a4a554e144f4e60107555ea7a11cd9969d6208b
          if [ ! -d ../plonky3-recursion/.git ]; then
            git clone --no-checkout https://github.com/emberian/plonky3-recursion ../plonky3-recursion
            git -C ../plonky3-recursion fetch --depth 1 origin "$REV"
            git -C ../plonky3-recursion checkout "$REV"
          fi
      - name: cargo check --all-targets --locked (the gate)
        working-directory: ${{ matrix.dir }}
        run: cargo check --all-targets --locked
      - name: cargo test --locked (legs whose test binaries link honestly on a hosted runner)
        if: matrix.test
        working-directory: ${{ matrix.dir }}
        # matrix.testflags is the per-leg feature selection (e.g. durable-workflow's
        # `--features deploy`, which turns on the otherwise-never-compiled deploy.rs
        # launchpad test). Empty for legs that only need default features.
        run: cargo test --locked ${{ matrix.testflags }}

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libgl1-mesa-dev libegl-dev libgles-dev libharfbuzz-dev libfreetype-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gperf libunwind-dev
      # Reclaim the ~25 GB of preinstalled toolchains we never use. The hosted
      # ubuntu runner ships with only ~14 GB free on /, which the full debug-build
      # `target/` of this workspace overruns — see the root-cause note on the test
      # step below. Freed BEFORE the cache restore + build so they have headroom.
      - if: runner.os == 'Linux'
        name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@v2

      # ─────────────────────────────────────────────────────────────────────────
      # ARM THIS LANE AGAINST THE VACUOUS GREEN (docs/ASSESS-cold-build-silent-export.md).
      #
      # dregg-lean-ffi/libdregg_lean.a is gitignored and has NEVER been tracked, so every
      # hosted runner checks out a tree with no Lean archive. dregg-lean-ffi/build.rs then
      # emits a `cargo:warning=` (which cargo HIDES for dependency crates) and returns
      # BEFORE all 23 `cargo:rustc-cfg=dregg_*_present` emissions — so every
      # `#[cfg(all(test, dregg_*_present))]` module ceased to exist and `cargo test`
      # below reported the SURVIVORS as green. Nine test functions vanished that way,
      # including the ONLY automated falsifier for the ~2^31-grind R3 width forgery, and
      # the crate reported `11 passed` rather than `0` — which reads as a healthy crate.
      # The release lanes (armed-teeth, federation-node-*, intent-service, demos) were
      # never affected: `require_lean_native` defaults ON under --release, so they fail
      # loud. This debug `cargo test --workspace` job was the single lane in the one
      # profile where the fail-loud tier was disarmed — and it is the highest-signal job
      # in the repo.
      #
      # DREGG_TEST_REQUIRE_LEAN=1 now arms the gate at BUILD time too (build.rs's
      # `require_lean_native`), so an absent or un-spliced archive is a hard build FAILURE
      # naming the missing exports instead of a smaller, quieter, green test run. It is
      # the SAME variable `demand_lean` already reads to turn a runtime self-skip into a
      # panic, so both halves arm together.
      #
      # SELF-ARMING, exactly like the `lean-marshal-gate` job below: it keys on
      # dregg-lean-ffi/lean-seed.pin. If a seed is pinned we fetch it and arm; if the pin
      # is empty the lane declares itself unarmed rather than silently pretending. The
      # ONLY sanctioned way to stay unarmed WITH a pinned seed is to commit
      # `LEAN_GATE_INTENTIONALLY_UNARMED=1` to the pin — visible in review, never silent.
      - name: Fetch the CI-published Lean seed (arms the test gate below)
        id: seed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^TAG=//p' dregg-lean-ffi/lean-seed.pin | head -1)"
          if [ -z "$tag" ]; then
            echo "::warning::lean-seed.pin has an EMPTY TAG — no seed to fetch."
            exit 1
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y zstd; else brew install zstd || true; fi
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          bash scripts/fetch-lean-seed.sh

      - name: Arm the Lean test gate, or declare the lane unarmed (no silent vacuous green)
        id: arm
        run: |
          set -euo pipefail
          if [ -f dregg-lean-ffi/libdregg_lean.a ]; then
            echo "armed=1" >> "$GITHUB_OUTPUT"
            echo "::notice::Lean archive present ($(du -h dregg-lean-ffi/libdregg_lean.a | cut -f1)) — DREGG_TEST_REQUIRE_LEAN=1. Every @[export]-backed test must now actually RUN."
            exit 0
          fi
          intentional="$(sed -n 's/^LEAN_GATE_INTENTIONALLY_UNARMED=//p' dregg-lean-ffi/lean-seed.pin | head -1)"
          if [ "$intentional" = "1" ]; then
            echo "armed=0" >> "$GITHUB_OUTPUT"
            echo "::warning::no Lean archive AND lean-seed.pin declares LEAN_GATE_INTENTIONALLY_UNARMED=1 — every #[cfg(dregg_*_present)] test in this run compiles out and asserts NOTHING. This is a DECLARED, reviewable disarm, not a silent one."
            exit 0
          fi
          echo "::error::no dregg-lean-ffi/libdregg_lean.a after the seed fetch. Without it dregg-lean-ffi/build.rs emits NO cargo:rustc-cfg, every #[cfg(dregg_*_present)] test module compiles out, and this job goes green having asserted nothing about the verified executor, the PQ cores, the R3 anti-forgery teeth, conservation, admission, finality or bridge trust (docs/ASSESS-cold-build-silent-export.md). Fix the seed pipeline (the 'Publish Lean seed' workflow must cut an asset for THIS platform + this commit's key — scripts/lean-seed-key.sh), or — for a deliberate pre-seed bootstrap — commit LEAN_GATE_INTENTIONALLY_UNARMED=1 to dregg-lean-ffi/lean-seed.pin so the disarm is visible in review."
          exit 1

      # macOS links the full workspace (incl. deos-zed's windowed gpui editor) via
      # ld64 — green, so keep it whole.
      - if: runner.os == 'macOS'
        env:
          DREGG_TEST_REQUIRE_LEAN: ${{ steps.arm.outputs.armed }}
        run: cargo test --workspace
      # Linux SIGBUS root cause: it is NOT one heavy crate. The full debug-build
      # `target/` of the WHOLE workspace overruns the hosted runner's small disk,
      # and whichever link steps are running when / hits zero ALL die at once as
      # `collect2: ld terminated with signal 7 [Bus error]` — a write into GNU ld's
      # mmap'd output faults when the file can't be extended (disk full). The proof:
      # the crash hits SIMULTANEOUSLY across unrelated, LIGHT protocol crates
      # (starbridge-agent-orchestration / starbridge-tool-access-delegation — no
      # gpui/servo in their graph), and a sibling run surfaces the identical root
      # cause as a plain `No space left on device (os error 28)`. Fixed at the root
      # WITHOUT dropping any crate: (1) the disk-reclaim step above, and (2) build
      # the tests with debuginfo OFF (CARGO_PROFILE_*_DEBUG=0), which slashes both
      # the on-disk object footprint AND GNU ld's link-time memory so the link fits.
      # Every crate — incl. all starbridge-apps — still LINKS and TESTS here.
      #
      # deos-zed alone stays off this gate (the vendored full Zed/IDE fork: its
      # windowed gpui screenshot targets link the entire desktop/accessibility
      # static graph and want a display at runtime); its protocol-relevant gpui-free
      # core is covered by the firmament lane just below.
      - if: runner.os == 'Linux'
        name: Test workspace (debuginfo off; deos-zed split out)
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          DREGG_TEST_REQUIRE_LEAN: ${{ steps.arm.outputs.armed }}
        run: cargo test --workspace --exclude deos-zed
      # ...still test deos-zed's gpui-FREE core on Linux: the FirmamentFs seam
      # (a file is a cell, a save is a receipted turn) links only the light executor
      # spine, so it links cleanly. This keeps the protocol-relevant half covered.
      - if: runner.os == 'Linux'
        name: Test deos-zed gpui-free firmament core
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test -p deos-zed --no-default-features --features firmament

  # The LIVE agent-brain transport lane. The default build is 100% the recorded
  # `RecordedOpenAICaller`; the REAL `reqwest`-over-TCP transport
  # (`LiveOpenAICompatCaller`) is exercised only under `--features live-brain`, so it
  # never ran in the `cargo test --workspace` gate above (the audit's F4/G3). This
  # lane runs the hermetic mock-server tests (`dregg-agent/src/brain.rs`
  # `mock_server_tests`) — a real localhost OpenAI-compatible server over real TCP:
  # the configured base URL is honored, the API key rides ONLY the Authorization
  # header (never the body), and a dead endpoint fail-closes. Hermetic (no external
  # network), so it runs on every push. dregg-agent is std+reqwest — no gpui/system
  # deps needed.
  live-brain:
    name: Live brain (hermetic HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (dregg-agent, live-brain)
        run: cargo test -p dregg-agent --features live-brain

  clippy:
    name: Clippy (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ADVISORY, not a gate — but for an HONEST reason, corrected 2026-07-17.
    # The OLD justification here (a pinned CI clippy still carries lints a local
    # same-dated clippy lacks, e.g. chunks_exact_to_as_chunks / manual_is_multiple_of)
    # was STALE TWICE OVER: (1) the toolchain is date-pinned (`nightly-2026-06-21`,
    # committed 80cd71310), so CI's clippy IS the local same-dated clippy — the
    # nondeterminism it feared is gone; (2) those exact lints are already
    # `allow`ed in `[workspace.lints.clippy]`, so they never fire on the ~196
    # crates that inherit them anyway.
    #
    # The REAL reason it stays advisory: `cargo clippy --workspace -- -D warnings`
    # is genuinely RED right now, and not on a clippy style lint — on plain rustc
    # `unused import` warnings promoted by `-D warnings` (last 4 completed main
    # runs: ~50 of them, concentrated in the actively-refactored `circuit` crate,
    # e.g. `crate::dsl::descriptors::merkle_poseidon2_circuit`), plus the handful
    # of crates that do NOT carry `[lints] workspace = true` (e.g. deos-hermes).
    # Flipping this to a hard gate TODAY reds main on churn that isn't the PR's.
    #
    # THE PATH TO A REAL GATE (do not delete this note until done): drive
    # `cargo clippy --workspace -- -D warnings` to zero (start with the circuit
    # unused-imports), give the non-inheriting crates `[lints] workspace = true`
    # or an explicit exclude, VERIFY green, THEN drop `continue-on-error`. Until
    # then it RUNS + reports as annotations. Run `cargo clippy` locally before pushing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libgl1-mesa-dev libegl-dev libgles-dev libharfbuzz-dev libfreetype-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gperf libunwind-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned: a floating @master nightly can introduce new clippy lints that
          # red the gate on a day with zero code changes. Bump deliberately.
          toolchain: nightly-2026-06-21
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  # ── The half of clippy that is a REAL gate ───────────────────────────────────
  # The advisory job above cannot fail, and its ~4000 lines of style warnings are
  # where a guard-that-cannot-fire goes to hide. Concretely: `dreggnet-party`'s
  # Scout `UnsafeStrike` preflight was `hp > FINISH_THRESHOLD && hp <= ATTACK_DIE`
  # with both constants `8` — UNSATISFIABLE, a check that could never refuse
  # anything — and `impossible_comparisons` had been printing it, at warn level,
  # in every build, unread.
  #
  # `clippy::correctness` is deny-by-default upstream; `[workspace.lints.clippy]`
  # now restores that (`all` was silently downgrading it). This job is the CI half:
  # it runs the group over EVERY target (the advisory job omits `--all-targets`, so
  # all test code is invisible to it) and it does NOT continue-on-error.
  #
  # `--keep-going` + the diagnostic grep, rather than the exit code, on purpose: a
  # handful of test targets do not compile at HEAD (see the "dark targets" note in
  # docs/), and `--keep-going` lets the correctness sweep still cover everything
  # that DOES compile instead of stopping at the first broken target. Those targets
  # are a separate, named debt — not a reason for this gate to be advisory too.
  clippy-correctness:
    name: Clippy (correctness — HARD GATE)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libgl1-mesa-dev libegl-dev libgles-dev libharfbuzz-dev libfreetype-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gperf libunwind-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-21
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: correctness sweep over every target
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          # ⚑ THIS GATE COULD NOT FIRE, and had not been able to since it was written
          # (found 2026-07-25). The workflow sets `CARGO_TERM_COLOR: always` at the top
          # level, which cargo honours even when its output is REDIRECTED TO A FILE. So
          # every line in `clippy-correctness.log` carries SGR escapes around the word
          # `error`, and both readers below are anchored on that literal:
          #
          #   raw:   src/main.rs:1:25: ESC[1mESC[91merrorESC[0m[E0308]: mismatched types
          #   raw:   ESC[1mESC[91merrorESC[0m: could not compile `p` (bin "p") due to 1 …
          #
          # Measured, not reasoned: on a probe crate with one type error,
          # `grep -c '^error: could not compile'` returns 0 and the correctness pattern
          # returns nothing. Consequences, both bad in the "reports GREEN" direction:
          #   * `correctness: clean.` was a VACUOUS pass — a denied correctness lint,
          #     the thing this HARD GATE exists to refuse, was unmatchable.
          #   * the dark-target ratchet's `dark-now.txt` was ALWAYS EMPTY, so NEW dark
          #     targets could never be detected, and every row in
          #     `.github/dark-targets.txt` was reported as "NO LONGER DARK" on every
          #     run — the job's standing red, and a claim it had no evidence for.
          # `never` here, not a sed pipeline: this log is read by machines only.
          CARGO_TERM_COLOR: never
        run: |
          set -uo pipefail
          cargo clippy --workspace --all-targets --keep-going --message-format=short \
            > clippy-correctness.log 2>&1 || true
          # A correctness lint is `deny` via [workspace.lints.clippy], so it lands as
          # `error: <message>` on a source line. Compile errors (E0xxx) are the separate
          # dark-target debt and are reported, not gated, here.
          if grep -E '^[^ ].*\.rs:[0-9]+:[0-9]+: error: ' clippy-correctness.log \
               | grep -v 'error\[E[0-9]' > correctness-hits.txt; then
            echo "::error::clippy::correctness fired — a check that cannot refuse anything, or worse."
            cat correctness-hits.txt
            echo
            echo "Fix it, or — if the shape is deliberate — annotate the SITE with"
            echo "  #[expect(clippy::<lint>, reason = \"...\")]"
            echo "(expect, not allow: it self-retires when the shape changes)."
            exit 1
          fi
          echo "correctness: clean."
      # ── THE DARK-TARGET RATCHET ────────────────────────────────────────────
      # A target that does not compile is a guard that CANNOT FIRE, and it is
      # indistinguishable from a guard that always passes. On 2026-07-25 there
      # were TWELVE of them; six had never compiled once since the commit that
      # introduced them, and two of those commits' subjects asserted exactly the
      # property the dark test checked. None announced itself — a `::warning::`
      # annotation (what this step used to emit) is a DOCUMENTED wound, not a
      # DETECTED one.
      #
      # So: the known-dark set is enumerated, with a reason per row, in
      # `.github/dark-targets.txt`. A target that goes dark and is NOT on that
      # list FAILS THIS JOB. Fix it, or add the row and say why.
      - name: dark-target ratchet
        run: |
          set -uo pipefail
          LIST=.github/dark-targets.txt
          # Normalize `error: could not compile `pkg` (kind "name") due to N previous errors`
          # to `pkg (kind "name")` — the trailing count is noise that moves on its own.
          grep '^error: could not compile' clippy-correctness.log \
            | sed -E 's/^error: could not compile `([^`]+)` \((.*)\) due to.*/\1 (\2)/' \
            | sort -u > dark-now.txt || true
          # `file …` rows belong to the mod-declaration sweep below; they share this
          # list (one doctrine, one file) but partition its rows.
          grep -vE '^\s*(#|$)' "$LIST" | grep -v '^file ' | sort -u > dark-known.txt
          NEW=$(comm -23 dark-now.txt dark-known.txt)
          FIXED=$(comm -13 dark-now.txt dark-known.txt)
          if [ -n "$NEW" ]; then
            echo "::error::a target went DARK and is not on the known list. A test target that does"
            echo "::error::not compile is a falsifier that cannot fire — it is not a warning."
            echo "$NEW" | sed 's/^/  NEW DARK: /'
            echo
            echo "Repair it, or add the row to $LIST with a one-line reason and an owner."
            echo "Reproduce locally with:"
            echo "  cargo clippy --workspace --all-targets --keep-going --message-format=short"
            echo "(--keep-going is REQUIRED: a plain --all-targets run ABORTS at the first"
            echo " broken target and shows you nothing past it.)"
            exit 1
          fi
          # No new darkness ⇒ no cascade is in flight (a red LIB is itself a NEW row and
          # would have failed above), so an absent row means that target COMPILES again.
          if [ -n "$FIXED" ]; then
            echo "::error::these rows in $LIST now COMPILE. Delete them — a stale allowlist is how"
            echo "::error::the next dark target gets waved through."
            echo "$FIXED" | sed 's/^/  NO LONGER DARK: /'
            exit 1
          fi
          echo "dark-target ratchet: $(wc -l < dark-known.txt) known, 0 new, 0 stale."
      # ── THE MOD-DECLARATION SWEEP (the ratchet's blind spot) ───────────────
      # The step above catches a target that FAILS TO COMPILE. It cannot catch a
      # file rustc NEVER OPENS — an unreferenced `.rs` is not a target, emits no
      # diagnostic, and `--keep-going` never names it. Both failures leave every
      # `#[test]` in the file unable to fire; only one of them is visible.
      #
      # What the invisible half cost, twice: `eth-lightclient`'s `bridge_lc_ffi`
      # ETH light-client verification bridge had never been compiled, and
      # `cargo test --lib -- bridge_lc_ffi` matched 0 of its 24 tests and reported
      # GREEN. Then `sdk/src/fhegg.rs` — wired and tested on 07-17, un-wired on
      # 07-20 as collateral in a commit about ML-DSA that never mentions it, while
      # the `fhegg` feature stayed in `default` so every consumer kept compiling
      # the dependency for a module that did not exist.
      #
      # Same two-sided ratchet, same allowlist file, `file `-prefixed rows.
      - name: mod-declaration sweep
        run: python3 scripts/check-dark-modules.py

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-21
          components: rustfmt
      # If this fails, format-drift landed. The local pre-commit hook formats every staged .rs at
      # its crate's edition so this stays green automatically — install it once with
      # `bash scripts/install-hooks.sh`, and commit WITHOUT `--no-verify` (that skips the hook).
      - run: |
          cargo fmt --all -- --check || { echo '::error::format drift — run `cargo fmt --all` (and install the pre-commit hook: bash scripts/install-hooks.sh)'; exit 1; }

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      # Run `cargo audit` directly rather than via `rustsec/audit-check@v2`
      # (the action's `ignore` input is silently dropped — it reported an empty
      # ignore set in its own JSON, red-failing the lane on the assessed
      # transitive advisories). `cargo audit` only auto-reads config from
      # `.cargo/audit.toml`, NOT the repo-root `/audit.toml`, so we pass the
      # ignore list explicitly via `--ignore`, sourced FROM `/audit.toml`
      # (the single source of truth — each id carries its chain + reachability
      # reason + the upstream bump that retires it). cargo-audit surfaces
      # informational advisories (unmaintained / yanked) as non-fatal warnings
      # by default, exactly the policy audit.toml documents. Drop a line from
      # audit.toml the moment its upstream ships a graph-compatible patched
      # release — this step picks the change up automatically.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit (ignores sourced from /audit.toml)
        run: |
          set -euo pipefail
          # Extract the RUSTSEC ids from the [advisories].ignore array in
          # audit.toml and turn each into a `--ignore <id>` flag. Match ONLY the
          # QUOTED array elements ("RUSTSEC-…"), never a bare mention in a comment
          # — otherwise a RUSTSEC id typed into a comment silently suppresses a
          # live advisory (the grep-scanned-the-whole-file footgun; audit.toml's
          # own per-entry comments name the ids, and fixed advisories are written
          # prefix-stripped to dodge the old grep — both now moot).
          mapfile -t IDS < <(grep -oE '"RUSTSEC-[0-9]{4}-[0-9]{4}"' audit.toml | tr -d '"' | sort -u)
          IGNORE_ARGS=()
          for id in "${IDS[@]}"; do IGNORE_ARGS+=(--ignore "$id"); done
          echo "Ignoring ${#IDS[@]} assessed advisories: ${IDS[*]}"
          cargo audit "${IGNORE_ARGS[@]}"

  lean-marshal-gate:
    name: Lean marshal gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # THE FAITHFULNESS GATE, ARMED. This job used to be a checkmark that could not be red: with no
    # libdregg_lean.a on a hosted runner, check-lean-marshal.sh exited 0 having compared the Rust
    # executor against nothing at all. It is now armed by FETCHING a seed.
    #
    # A hosted runner cannot BUILD the seed (the Dregg2 corpus compile — see lean-seed.yml), but it
    # does not need to: ubuntu-latest IS Linux-x86_64, the platform lean-seed.yml publishes on every
    # push to metatheory/**. Consuming a prebuilt archive is a download + a link, which is minutes.
    # That asymmetry — build heavy on self-hosted, consume cheap on hosted — is what un-fakes this.
    #
    # SELF-ARMING: until the first seed release exists, the pin's TAG is empty and fetch cannot
    # resolve anything, so the gate reports its unarmed state loudly instead of failing every PR for
    # infrastructure that has not been stood up yet. lean-seed.yml's `pin` job writes TAG on the
    # first successful publish — at which point this gate arms itself with no further edit here.
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-21
      - uses: Swatinem/rust-cache@v2

      - name: Is a seed release published? (reads dregg-lean-ffi/lean-seed.pin)
        id: pin
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^TAG=//p' dregg-lean-ffi/lean-seed.pin | head -1)"
          if [ -n "$tag" ]; then
            echo "armed=1" >> "$GITHUB_OUTPUT"
            echo "::notice::seed release '$tag' is pinned — arming the faithfulness gate."
          else
            echo "armed=0" >> "$GITHUB_OUTPUT"
            # SILENT-DISARM GUARD (gate-vacuity #3). An empty TAG makes
            # check-lean-marshal.sh SKIP — "NOTHING WAS CHECKED" — and exit 0, so a
            # disarmed run is byte-for-byte indistinguishable from a passing one. A
            # published seed EXISTS (lean-seed.pin ships TAG=lean-seed, content-keyed and
            # stable), so on the protected branch `main` there is NO legitimate unarmed
            # state: an empty TAG there is a lost/tampered pin and MUST be a red job, not
            # a green-with-warning. The ONLY sanctioned unarmed state is a deliberate
            # pre-seed bootstrap, and it must be declared IN THE COMMITTED PIN with a
            # `LEAN_GATE_INTENTIONALLY_UNARMED=1` line — visible in review, never silent.
            intentional="$(sed -n 's/^LEAN_GATE_INTENTIONALLY_UNARMED=//p' dregg-lean-ffi/lean-seed.pin | head -1)"
            # Fire on a PUSH to main AND on a PR TARGETING main. The push-only form was a
            # POST-MERGE tripwire: a PR that empties/tampers the pin passed its PR CI green
            # (the marshal gate silently SKIPs), so a reviewer relying on green checks would
            # MERGE the disarm before the red ever showed. For a pull_request event the
            # protected target is GITHUB_BASE_REF (= main), not GITHUB_REF. Blocking both
            # makes the disarm visible in the PR, pre-merge.
            targets_main=0
            if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
              targets_main=1
            elif [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ "${GITHUB_BASE_REF:-}" = "main" ]; then
              targets_main=1
            fi
            if [ "$targets_main" = "1" ] && [ "$intentional" != "1" ]; then
              echo "::error::lean-seed.pin has an EMPTY TAG on a change to main (push or PR), with no committed LEAN_GATE_INTENTIONALLY_UNARMED=1 escape. The Lean↔Rust faithfulness gate would SKIP and go green having checked NOTHING. Restore the pin's TAG (run 'Publish Lean seed'), or — for a deliberate pre-seed bootstrap — commit LEAN_GATE_INTENTIONALLY_UNARMED=1 to dregg-lean-ffi/lean-seed.pin so the disarm is visible in review."
              exit 1
            fi
            echo "::warning::lean-seed.pin TAG is EMPTY — no seed release exists yet, so this gate can only SKIP and is asserting NOTHING. Run the 'Publish Lean seed' workflow (needs a registered self-hosted runner with the lean-seed + linux-x86_64 labels); it writes TAG and this gate arms itself automatically."
          fi

      # The seed links against the pinned toolchain's Lean runtime/stdlib, so elan is required even
      # on the fetch path. It installs in ~a minute and does NOT compile mathlib.
      - name: Install elan + the pinned Lean toolchain
        if: steps.pin.outputs.armed == '1'
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the CI-published Lean seed for this checkout
        if: steps.pin.outputs.armed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y zstd
          bash scripts/fetch-lean-seed.sh

      - name: Faithfulness gate (Lean↔Rust; armed — an absent seed is now a FAILURE)
        env:
          # Armed only when a seed was actually fetchable. When it was not, this stays 0 and the
          # script prints "NOTHING WAS CHECKED" rather than a green that means nothing.
          DREGG_REQUIRE_LEAN_GATE: ${{ steps.pin.outputs.armed }}
        run: bash scripts/check-lean-marshal.sh

  no-unchecked-auth:
    name: No-Unchecked-Auth grep guard (P2.F)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: bash scripts/no-unchecked-auth.sh

  independence-controls:
    name: Independence-guard control gate (every rejector carries its control)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `#assert_not_depends_on` is a REJECTOR: a closure walk gone blind reports the
    # SAME green as a genuinely independent proof term. Its blindness is covered only
    # by the dual `#assert_depends_on` positive control. This gate makes that pairing
    # mechanical (rejector in a file => control in the SAME file) instead of social,
    # and FAILS LOUD if it finds zero adopters — a scan that checked nothing is not a
    # pass. Pure source-text scan: no Lean toolchain, no build.
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: bash scripts/check-independence-controls.sh

  p3-rev-lockstep:
    name: plonky3-recursion rev lockstep (incl. the recursive-VK proving-system id)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The emberian/plonky3-recursion fork rev resolves the compiled recursive verifier.
    # It is mirrored into CI workflows, wasm/Cargo.toml, and — most load-bearing —
    # RECURSION_P3_REV, the proving-system id folded into compute_recursive_vk_hash(),
    # i.e. the value lookup_recursive_vk() accepts on. scripts/check-p3-rev.sh existed
    # since 2026-07-16 but was wired into NO workflow, so it only ran when a human
    # typed it; its VK-constant arm additionally exited 0 by construction (WARN-only).
    # Both are fixed — the gate runs here and FAILS on any drift, including the VK id.
    # Pure source-text scan: no Rust toolchain, no build.
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: bash scripts/check-p3-rev.sh

  lean-orphans:
    name: Lean orphan-module coverage gate (no Dregg2 module escapes the build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `Dregg2` lean_lib has no `globs`, so `lake build` compiles only modules
    # transitively imported from metatheory/Dregg2.lean. A new metatheory/Dregg2/**.lean
    # that nothing imports builds green under `lake env lean <file>` and its
    # #assert_all_clean / #assert_axioms / #guard checks run in NO CI target. This gate
    # FAILS LOUD if any Dregg2 module is neither reachable nor deliberately allowlisted
    # (scripts/lean-orphans-allow.txt, one reason per entry), and if it finds zero files —
    # a coverage scan that scanned nothing is not a pass. Pure source-text scan: no Lean
    # toolchain, no build.
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: bash scripts/check-lean-orphans.sh

  ratchet-darkness:
    name: Refuted-floor DARKNESS gate (nothing carrying a refuted floor is invisible to the ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # THE B5 BYPASS, CLOSED (2026-07-25). The job above asks whether a `Dregg2/**` module is
    # COMPILED by some default lake target. This one asks the strictly harder question the
    # accrual gate actually depends on: is it in the environment `#floor_ratchet` READS.
    #
    # Those differ, and the difference is a hole. `#floor_ratchet` / `#teeth_wired` are Lean
    # commands at the end of metatheory/Dregg2.lean and see exactly that root's import closure.
    # metatheory/lakefile.toml has FIVE default targets: `Metatheory.+` and `Polis.+` are GLOBBED
    # (every file its own target) and `Market`/`Bfv` are separate roots. So a declaration under a
    # globbed lib compiles in the default build, runs its own #assert_axioms, is green in CI —
    # and can take a hypothesis this tree PROVES FALSE at deployed BabyBear parameters with NO
    # instrument counting it. Measured on a clean export of the parent commit: 201 of 2029 in-tree
    # modules dark to that root, 75 of them still built by lake, NINE of them mentioning a refuted
    # floor in code (101 mentions) — worst was Metatheory.Adversary.Instances at 41, a module the
    # globbed `Metatheory.+` lib had been compiling green all along.
    #
    # RULE 1: a dark module that mentions a refuted floor must be ROOTED, not allowlisted
    # (exempting one needs the loud literal `FLOOR-EXEMPT:` token plus a reason — currently ONE
    # entry, `scripts/floor_ratchet_canary.lean`, whose job is to make the gate error).
    # RULE 2: a module lake builds outside that closure must be recorded with a reason, so the
    # surface cannot grow silently.
    # Fail-closed on a vacuous scan, on a truncated root, and on a stale allowlist entry — and on
    # its own blindness: the floor NAMES are parsed out of Dregg2/Verify/FloorCensus.lean's
    # `sentinelFloors` rather than hand-written here, and fewer than 15 parsed names is a FAILURE,
    # because a gate scanning for nothing passes every module and looks exactly like coverage.
    # Pure source-text scan: no Lean toolchain, no build.
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: bash scripts/check-ratchet-darkness.sh

  descriptor-by-name-routing:
    name: Committed reference -> uncommitted target (by-name routing, include_str!, Lean import, workflow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `metatheory/EmitByName.lean`'s `byNameDescriptors` is the routing table for the whole
    # `circuit/descriptors/by-name/` dispatch surface. Both of its directions were gated
    # only by machinery that needs the FULL Lean emit (the `descriptor-drift` job below —
    # a multi-hour build), and one direction was not gated at all: a name added to the
    # table with no committed artifact behind it is a GHOST that every other gate is blind
    # to, because they all start from a file that EXISTS and ask whether it is covered
    # (the emit's coverage check, `--verify-provenance`, and the derived-coverage test in
    # circuit/src/effect_vm_descriptors.rs alike). The Lean `#guard
    # byNameDescriptors.length == N` counts the ghost as a member, so it passes too.
    # One ghost lived a full day in HEAD.
    #
    # This gate reconciles table <-> checked-in set <-> PROVENANCE stamp in BOTH
    # directions from a STATIC parse of the .lean source: no Lean toolchain, no cargo,
    # seconds — so it keeps reporting while the emit is blocked, which is precisely when a
    # routing gap can go unnoticed. The parse is FATAL-on-unparseable (it must find the
    # decl and the terminator, must yield one name per list entry, and must agree with the
    # file's own machine-checked length guard), so a reshaped table reds instead of
    # quietly narrowing what this checks.
    #
    # ONE INVOCATION, FOUR DOORS on the same class — a COMMITTED reference to an
    # UNCOMMITTED target, which is green for the author and red for every fresh checkout,
    # and which nothing else in this repo can see because every other gate starts from a
    # file that EXISTS. The job name used to advertise only the first:
    #   1. the Lean routing table above (GHOST / UNROUTED / UNSTAMPED);
    #   2. Rust `include_str!`/`include_bytes!` (INCLUDE-GHOST / -UNTRACKED / -ESCAPES-REPO)
    #      — rustc resolves those at COMPILE time, so an untracked one breaks the crate and
    #      everything downstream, for everyone but the lane that emitted it;
    #   3. first-party Lean `import` (LEAN-IMPORT-GHOST / -UNTRACKED) — the wound
    #      `20b9d9a20f` is titled after, which had already recurred;
    #   4. paths a tracked `.github/workflows/*.yml` INVOKES (WORKFLOW-GHOST /
    #      -UNTRACKED / -ESCAPES-REPO). `bash scripts/x.sh` with `scripts/x.sh` untracked is
    #      `No such file or directory` on every runner; the only other detector was the
    #      broken job itself, AFTER it landed. Live instance the night it was added:
    #      `scripts/check-ratchet-darkness.sh` sat untracked under an uncommitted ci.yml
    #      hunk that ran it.
    # Deliberately NOT four jobs: the class is one, the check is ~1s, and it is the same
    # invocation `scripts/check-descriptor-drift.sh` runs as its local preflight — so a new
    # medium inherits both positions the moment its leg is added, and nothing has to
    # remember to call it. Doors 2 and 4 parse a real language (Rust tokens; shell inside
    # YAML block scalars) so they do not red on prose in comments, and both REPORT their
    # NOT-CHECKABLE counts (macro-built include paths; `${{ }}`/`$VAR`/glob paths, runtime-
    # produced downloads, .gitignore'd build outputs) rather than guessing.
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: python3 scripts/emit_descriptors.py --verify-by-name-routing

  no-degraded-felt:
    name: Faithful-commitment gate (no degraded felt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ast-grep tripwire: a lossy 256->31-bit `fold_bytes32_to_bb` fold must not
    # reach a state-commitment position. See docs/FAITHFUL-COMMITMENT-LAW.md.
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install ast-grep (sg)
        run: npm install -g @ast-grep/cli@0.44.0
      - name: Faithful-commitment gate
        run: bash scripts/check-no-degraded-felt.sh

  metatheory-no-sorry:
    name: Metatheory zero-sorry guard
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Pin the Lean toolchain via metatheory/lean-toolchain (leanprover/lean4:v4.30.0).
    # mathlib is a PORTABLE `git`+`rev` require (metatheory/lakefile.toml) that lake resolves
    # into `metatheory/.lake/packages/mathlib`; scripts/ci-mathlib-cache.sh pulls mathlib's
    # PREBUILT oleans into that same tree, so this job compiles the dregg2 corpus and never
    # mathlib itself. MATHLIB_REV is not decoration: the script FAILS if it disagrees with the
    # rev in the lakefile.
    env:
      MATHLIB_REV: 1c2b90b13009c65b090d95a83c98e248deafb6f1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Install elan + the toolchain named in metatheory/lean-toolchain.
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          bash elan-init.sh -y --default-toolchain "$(cat metatheory/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # ⚑ THE PREBUILT MATHLIB, IN THE DIRECTORY LAKE ACTUALLY READS (fixed 2026-07-25).
      #
      # This step used to clone mathlib to `$GITHUB_WORKSPACE/../../src/mathlib4`
      # (= /home/runner/work/src/mathlib4) and run `lake exe cache get` THERE — correct while the
      # lakefile pinned `path = "../../../src/mathlib4"`, which resolved to exactly that dir.
      # `4ccee5bd71` (2026-07-05) made the require portable `git`+`rev`; lake resolves that into
      # `metatheory/.lake/packages/mathlib` and CLONES MATHLIB ITSELF (visible in this job's own
      # captured build log: "info: mathlib: cloning https://github.com/leanprover-community/
      # mathlib4"). So the 8463-olean download landed in a directory NOTHING READ and lake
      # recompiled the mathlib subset from source on every run. That commit fixed
      # scripts/bootstrap.sh for the new pin and did not touch this file; the waste ran 20 days.
      #
      # MEASURED at the boundary — this job's "Zero-sorry guard" step, GitHub step timings:
      #   five runs before the pin  20.9 / 23.6 / 21.9 / 21.1 / 31.0 min
      #   the pin commit's own run  115.1 min   ← 4ccee5bd71, which touched NO Lean proof
      #   the next day              106.1 / 102.2 / 99.4 / 106.4 / 111.3 min
      # ~84 min per Lean job, against a 330-min step timeout this job has already been killed by.
      #
      # The script runs `cache get` FROM `metatheory/`, so LAKE picks the location and no path is
      # restated here to drift again; and it FAILS on an absent/partial cache or a wrong rev
      # rather than falling through to the from-source compile. All SIX Lean provisioning sites
      # in the repo call this ONE script — this job, metatheory-pq-apex, descriptor-drift,
      # proof-integrity-canary.yml, and both starbridge-v2-installers.yml lanes (whose copies
      # were not merely slow but HARD-RED: they sed'd for the deleted `path = "…"` line) — so no
      # lane can provision differently again.
      - name: Fetch pinned mathlib4 (prebuilt oleans into metatheory/.lake/packages/mathlib)
        run: bash scripts/ci-mathlib-cache.sh

      # The guard itself: build the corpus and FAIL on ANY `declaration uses
      # \`sorry\`` warning (covers sorry/admit/sorryAx, since admit & sorryAx
      # emit the same warning). See scripts/axiom-hygiene-guard.sh for the
      # two-layer design (this textual net + the Claims.lean #assert_axioms
      # ledger). The corpus must remain at ZERO sorry forever.
      - name: Zero-sorry guard
        run: bash scripts/axiom-hygiene-guard.sh

      # CRYPTO LINKING-SEAM GAUNTLET (2026-07-17, CI-meaningfulness audit).
      # `Dregg2.Crypto.CryptoVerifyAll` is the aggregator for the from-scratch PQ
      # linking chain. The ML-DSA `SignCoreSpec` (sign =spec), ML-KEM `EncapsCoreSpec`
      # (encaps =spec), and the `AcvpKats` NIST-ACVP-style native_decide KAT batch are
      # imported by NOTHING ELSE in the corpus (verified: `grep -rl import` finds only
      # CryptoVerifyAll) and the module is DELIBERATELY outside the default `Dregg2.lean`
      # aggregator — its heavy KAT `native_decide` chain would bloat every default build.
      # Net effect before this step: NO CI job compiled these PQ floor proofs at all —
      # the sign/encaps `=spec` results and the empirical KAT floor were verified only
      # on a dev laptop, exactly the "green on ember's laptop" class. This runs LAST in
      # this job so it reuses the already-built+warm corpus above: only the incremental
      # crypto-gauntlet closure compiles here (the default corpus is cached from the
      # zero-sorry build). A red here is a rotted PQ floor proof, not infra flake.
      # Routed through axiom-hygiene-guard.sh (NOT a bare `lake build`) so the
      # SAME `declaration uses \`sorry\`` / sorryAx grep the zero-sorry step runs
      # is applied to this out-of-default module too. `sorry`/`admit` are Lean
      # WARNINGS (exit 0, no warningAsError in metatheory/lakefile.toml), so an
      # exit-code-only `lake build <module>` here would GREEN even with a sorry
      # in the module — this closes that hole and keeps the textual net uniform.
      #
      # ⚠ STALE AS OF 1905a9a97b, kept as belt-and-suspenders: that commit added
      # `import Dregg2.Crypto.CryptoVerifyAll` to metatheory/Dregg2.lean, so this
      # aggregator is now IN the default build and the zero-sorry step above already
      # compiled it. "NO CI job compiled these PQ floor proofs at all" was true when
      # written and is no longer. This step is now a warm no-op (0s) that re-applies the
      # same grep to the same modules; the cost of keeping it is nothing and it survives
      # the root losing that import again. Its target list is NOT the apex spine: the
      # five-module ML-DSA `VerifyCore{EqSpecW,UseHint,HashFrame,ArgRows,ArgAssembly}`
      # chain lives in the `metatheory-pq-apex` job below, for the reasons given there.
      - name: Crypto linking-seam gauntlet (SignCoreSpec/EncapsCoreSpec/AcvpKats — now root-reachable; kept as belt-and-suspenders)
        env:
          AXIOM_GUARD_TARGETS: Dregg2.Crypto.CryptoVerifyAll
        run: bash scripts/axiom-hygiene-guard.sh

      # ⚑ THE CONE-CUTOVER TEXTUAL POST-STATE, FORCED FRESH (2026-07-25).
      #
      # `Tools/ConeCutover.assertPostState` verifies that a landed cutover still HOLDS in the
      # source: every pre-cutover fragment absent, every post-cutover fragment present, the retired
      # scaffolding file gone — and, uniquely, that `metatheory/Dregg2.lean` still IMPORTS the
      # cutover's teeth. No Lean module can check the latter from inside itself.
      #
      # It was written as a build-time check and COULD NOT STAND there: it reads the tree through
      # `IO.FS`, and lake's dependency graph is built from IMPORTS, so lake cannot see those reads
      # and replays the module from its cached olean forever. Measured 2026-07-25 on a tree whose
      # root had been truncated out from under the spec (`6b1e156bdf`, then `8a28420ec9`):
      #
      #     lake build Dregg2.Tools.ConeCutoverListCommit           EXIT=0   ← the cache answering
      #     lake env lean Dregg2/Tools/ConeCutoverListCommit.lean   EXIT=1   ← same bytes, fresh
      #       post-state VIOLATED (2): REGRESSED (old text back) / MISSING new text: Dregg2.lean
      #
      # i.e. it neither fired on a real regression nor was honestly green. The build-time tooth is
      # now SEMANTIC (over the environment, which lake DOES track); this step is where the textual
      # half runs, on a `lake env lean` that re-elaborates the file from source by construction.
      # COST: the corpus is already built by the zero-sorry step above, so this is seconds. The
      # script additionally requires the tool's own success line in the output — a run that
      # silently skipped the check fails here rather than passing.
      - name: Cone-cutover textual post-state (the Dregg2.lean WIRING check, no cache can answer it)
        working-directory: metatheory
        run: bash scripts/cone_cutover_textual_check.sh

      # THE REFUTED-FLOOR ACCRUAL GATE, ARMED (2026-07-25).
      # `#floor_ratchet` (end of `metatheory/Dregg2.lean`) fails the build when a NEW declaration
      # takes a hypothesis that is PROVABLY FALSE at deployed BabyBear params — such a theorem is
      # VACUOUS. It reads the elaborated environment + a checked-in baseline through IMPORTS, so
      # lake re-runs it whenever any declaration changes; `lake build Dregg2` IS the gate. It was
      # verified by adversarial probe: 8 deliberate violations across all five evasion classes
      # (plain binder, RENAMED floor, prop-body def, structure field via both `.mk` and the
      # projection, and a section `variable` binder) each turned the build RED.
      #
      # This step exists for the ONE thing the Lean command structurally cannot do: notice that it
      # is GONE. A deleted command raises no error, and that is not hypothetical — `Dregg2.lean`
      # has been silently TRUNCATED twice (`6b1e156bdf` cut 1055+ imports; `8a28420ec9` cut it
      # 1301 -> 217), and this very campaign shipped SIX teeth that never ran because nothing
      # imported them. Until this step existed, `grep -rn floor_ratchet .github/` returned ZERO
      # hits: deleting one line would have disarmed the gate with no signal.
      # Baseline is a RATCHET — it may only ever go DOWN; raising it requires a visible edit.
      - name: Refuted-floor accrual gate (presence + canary + build — a gate that can vanish is not a gate)
        working-directory: metatheory
        run: bash scripts/floor_ratchet_check.sh

      # THE CORPUS-WIDE AXIOM-HYGIENE LEDGER, ARMED (2026-07-17, wiring hunt round 2; counts
      # re-measured 2026-07-25).
      # `Dregg2/Claims.lean` is THE `#assert_axioms` net: 229 per-decl pins +
      # 51 `#assert_namespace_axioms` (~1500 theorems) that each FAIL THE BUILD unless
      # the pinned decl's full axiom set is {propext, Classical.choice, Quot.sound}. That is
      # 280 pins at this commit; the step name below carried "253" and the ledger has GROWN
      # past it (as did Claims.lean's own header, which still says "~190"). Re-count with
      # `grep -cE '^\s*#assert(_namespace)?_axioms' metatheory/Dregg2/Claims.lean` when editing.
      # Its own header calls it "the comprehensive, corpus-wide #assert_axioms net" and
      # names ~190 pins as "the UNIQUE location of those per-keystone kernel-clean
      # certifications" — and NOTHING BUILT IT. It is imported by zero modules (re-verified at
      # this commit: `grep -rl '^import Dregg2.Claims' metatheory` = 0 hits) and is not reachable from the
      # `Dregg2.lean` root, and the `Dregg2` lean_lib has NO globs (lakefile.toml) — so
      # `lake build` never touched it. scripts/axiom-hygiene-guard.sh's header describes a
      # "two-layer" guard whose layer (b) IS this ledger; layer (b) was running NOWHERE.
      # The textual layer (a) above catches a literal `sorry`; ONLY this layer catches a
      # TRANSITIVELY-INHERITED sorryAx or a keystone that silently grew a new axiom.
      #
      # COST: it imports ONLY the root `Dregg2` — already built by the zero-sorry step above
      # — so this elaborates the pins against a warm corpus and nothing else. Measured on a
      # warm tree: ~2m53s wall / ~90s CPU. A red here is a REAL axiom leak in a keystone the
      # corpus advertises as proved: read the named decl, do not delete the pin.
      - name: Corpus-wide axiom-hygiene ledger (Dregg2.Claims — 280 pins, imported by nothing)
        working-directory: metatheory
        run: lake build Dregg2.Claims

      # THE ORPHAN GATE (2026-07-17, wiring hunt round 2; list re-measured 762df3d090, counts
      # reconciled 2026-07-25). The `Dregg2` lean_lib has NO `globs` (metatheory/lakefile.toml),
      # so `lake build` compiles `Dregg2.lean` + its transitive imports ONLY. Modules under
      # metatheory/Dregg2/** that are NOT reachable from that root, NOT named by any CI step, and
      # NOT pulled in by the descriptor-drift gate's emitters are compiled by NOTHING. Same hole
      # class as CryptoVerifyAll above; this is its siblings.
      #
      # THE LIST IS 47, and the number in the step name below is the number of entries — keep
      # them equal when you edit either. It got there by measurement, not by growth:
      # `762df3d090` re-checked the 78 names this block carried (under a step name that said
      # "76") and found 31 of them REACHABLE from the Dregg2 root — the default build already
      # compiled those, so naming them here asserted coverage that was simply the zero-sorry
      # step's — plus 25 stale names that no longer exist. Spot-checked again at this commit
      # (import-closure walk from metatheory/Dregg2.lean): Bridge.LightClientEth,
      # Bridge.ProofOfHoldings, Circuit.AlgoStarkSoundFanoutMemFree and Circuit.AcceptanceDischarge
      # are all REACHABLE now, which is why they are absent below and why the bullets that used
      # to advertise "Bridge/* — the light clients" and "Circuit/AlgoStarkSound*, Fri* — the
      # STARK/FRI soundness tower" are gone: that content moved into the default build.
      #
      # ⚑ 47 -> 42 (2026-07-25, B5). Five entries left this list because they got ROOTED into
      # metatheory/Dregg2.lean: Circuit.{FinBindsKernel,FinInjectivityCollapse,
      # KernelConfigSoundness,KernelConfigSoundnessAvail} and Circuit.Emit.
      # MembershipDepthGeneralRung2. They were the exact shape this block's own header warns
      # about — named here, so COMPILED and sorry-grepped by CI, while sitting outside the
      # `Dregg2.lean` closure that `#floor_ratchet` reads. Between them they carried 51
      # refuted-floor mentions that no census, no baseline and no ratchet counted: compiled is
      # not counted. Now that they are in the default build, naming them here would assert
      # coverage that is simply the zero-sorry step's. The standing gate for that distinction is
      # the `ratchet-darkness` job above.
      #
      # WHAT THE 42 ACTUALLY ARE (counted from the list, this commit):
      #   ⚑ 42 -> 39 in the same commit, second pass: `Circuit.Fri{CorrelatedAgreementSharp,
      #   LdtJohnsonList,ProximityGapListDecoding,ProximityGapWitness}` became ROOT-REACHABLE as
      #   transitive imports of `Dregg2.Circuit.FriIncidenceDesign`, which B5b rooted. By this
      #   block's own rule they must leave: naming a reachable module here asserts coverage that is
      #   simply the zero-sorry step's. (One entry, `Games.MultiwayTugProgram`, arrived from another
      #   lane in the same window and is counted in the 39.)
      #
      #   * 30 Circuit/*   — 25 Circuit/Emit/{*Refine,*Rung2,*Emit} (the emit refinement ladder)
      #                      plus 5 Circuit/{FriVerifierOracle,PresentationBindingFromFold,
      #                      RotatedKernelRefinementAvailWideNarrow,WrapSafetyStaticAnalyzer,
      #                      CustomLeafEncoding}.
      #   * 4 Games/*      — AutomataflAir, MultiwayTug, MultiwayTugAir, MultiwayTugProgram (the DEPLOYED games'
      #                      move-legality proofs).
      #   * 3 Verify/LoadBearing* — the @[load_bearing] linter. NOTE: proof-integrity-canary.yml's
      #                      header claims this linter "runs every push in ci.yml's
      #                      metatheory-no-sorry job". That was FALSE — it ran only inside the
      #                      DAILY canary (LoadBearingAuditBroad is a mutation target), and
      #                      LoadBearingAuditKey ran nowhere at all. This step makes the
      #                      canary's claim TRUE.
      #   * Bridge.HoldingWeightedTally + Apps.ColonistJob — the two singletons.
      #
      # ⚠ THIS STEP IS NOT THE COVERAGE LEDGER — the `lean-orphans` job is (it walks the whole
      # tree and reds on any Dregg2 module that is neither reachable nor allowlisted). Measured
      # at this commit by scripts/check-lean-orphans.sh: 1798 Dregg2/**.lean files, 1694
      # reachable, 104 orphan (74 allowlisted, 30 UNLISTED) — i.e. that job is RED at HEAD and
      # this list does not and cannot cover for it. Modules that are RED rather than merely dark
      # (the Circuit.*Proto de-risk prototypes, the drifted Emit refinements) are DELIBERATELY
      # absent here: fix the module, then add its name.
      #
      # COST: every module here is a LEAF on the corpus the zero-sorry step already built, so
      # this runs last and reuses that warm build. The only wall-clock measurement taken was on
      # the 76-name list of 2026-07-17 (~7 min; its 18 non-Circuit entries 32s warm) — with 47
      # names that stands only as an UPPER BOUND, not as this step's current cost.
      # A red here is a rotted proof, not infra flake. Routed through axiom-hygiene-guard.sh
      # (NOT a bare `lake build`) so the SAME `declaration uses \`sorry\`` / sorryAx grep runs on
      # all 47. `sorry`/`admit` are WARNINGS (exit 0, no warningAsError in
      # metatheory/lakefile.toml), so an exit-code-only `lake build <list>` would GREEN even with
      # a sorry in any of them. The folded AXIOM_GUARD_TARGETS becomes the space-separated build
      # list; the guard applies the identical textual net, closing the coverage hole.
      - name: Orphan gate (39 modules reachable from no CI target — the CryptoVerifyAll siblings)
        env:
          AXIOM_GUARD_TARGETS: >-
            Dregg2.Apps.ColonistJob
            Dregg2.Bridge.HoldingWeightedTally
            Dregg2.Circuit.CustomLeafEncoding
            Dregg2.Circuit.Emit.AdjacencyMembershipRefine
            Dregg2.Circuit.Emit.AdjacencyMembershipRefineAudit
            Dregg2.Circuit.Emit.AdjacencyMembershipRung2
            Dregg2.Circuit.Emit.AvailWideMembersNarrow
            Dregg2.Circuit.Emit.BoundPresentationRefine
            Dregg2.Circuit.Emit.BoundPresentationRung2
            Dregg2.Circuit.Emit.CommittedThresholdEmit
            Dregg2.Circuit.Emit.CommittedThresholdRefine
            Dregg2.Circuit.Emit.DerivationRefine
            Dregg2.Circuit.Emit.DfaRoutingGeneralEmit
            Dregg2.Circuit.Emit.DfaRoutingRefine
            Dregg2.Circuit.Emit.DfaRoutingRung2
            Dregg2.Circuit.Emit.EffectActionBindingEmit
            Dregg2.Circuit.Emit.EffectActionBindingRefine
            Dregg2.Circuit.Emit.EffectVmEmitIvcStateTransition
            Dregg2.Circuit.Emit.EffectVmEmitIvcStateTransitionRefine
            Dregg2.Circuit.Emit.EffectVmEmitIvcStateTransitionRung2
            Dregg2.Circuit.Emit.EffectVmEmitIvcStateTransitionRung2Full
            Dregg2.Circuit.Emit.EmitGraduate
            Dregg2.Circuit.Emit.FoldEmit
            Dregg2.Circuit.Emit.FoldRefine
            Dregg2.Circuit.Emit.FoldRung2
            Dregg2.Circuit.Emit.MembershipAuthRootEdge
            Dregg2.Circuit.Emit.MultiStepChainEmit
            Dregg2.Circuit.Emit.RotatedLayoutBridge
            Dregg2.Circuit.FriVerifierOracle
            Dregg2.Circuit.PresentationBindingFromFold
            Dregg2.Circuit.RotatedKernelRefinementAvailWideNarrow
            Dregg2.Circuit.WrapSafetyStaticAnalyzer
            Dregg2.Games.AutomataflAir
            Dregg2.Games.MultiwayTug
            Dregg2.Games.MultiwayTugAir
            Dregg2.Games.MultiwayTugProgram
            Dregg2.Verify.LoadBearingAuditBroad
            Dregg2.Verify.LoadBearingAuditKey
            Dregg2.Verify.LoadBearingLint
        run: bash scripts/axiom-hygiene-guard.sh

      # ⚑ THE TUG PROGRAM ARTIFACT DRIFT GATE (2026-07-25).
      #
      # `dregg-multiway-tug/program/multiway_tug_program.json` is a CACHE of the Lean emission
      # (`Dregg2.Games.MultiwayTugProgram :: multiwayTugProgram`), `include_str!`d into the crate
      # and LOADED as the deployed referee. `program/regen.sh --check` re-emits and diffs it.
      #
      # It ran NOWHERE until now — not in any workflow, not in the git hooks. That is exactly how
      # the file it guards ended up RED at HEAD: `372b79e375` widened `DInput` by five fields and
      # `MultiwayTugProgram.lean` stopped compiling, so `program_admits_legal_play_deployed` was
      # silently unproven and nothing went red, because NO CI TARGET COMPILED THE MODULE. The
      # module is now in AXIOM_GUARD_TARGETS above (which fixes the compile half); this step fixes
      # the artifact half. Without it a rules edit lands in Lean while the deployed JSON keeps
      # shipping the OLD teeth — a green build serving a different game than the one proved.
      #
      # Cheap by construction: the oleans are already built by the step above, so this is a
      # re-run of one emit plus a diff.
      - name: Tug program artifact matches its Lean source (drift gate)
        run: bash dregg-multiway-tug/program/regen.sh --check

  # ── THE ML-DSA VERIFY-CORE APEX SPINE, IN ITS OWN LANE (2026-07-25) ─────────────────
  # `ebb0b9f9ae` rooted 16 never-compiled PQ modules into the default build with one import
  # (`Dregg2.Crypto.VerifyCoreArgAssembly`) and that rooting is RIGHT — 601 declarations, 453
  # theorems, zero sorryAx, 132 #assert_axioms that previously ran nowhere. Then it MEASURED
  # what it cost, and one module carries essentially all of it:
  #
  #     VerifyCoreEqSpecW   2664s = 44.4 min, exit 0   ← INTRINSIC, not contention
  #                                                      (degree-256 `AdjoinRoot` power basis,
  #                                                       `maxRecDepth 8000`)
  #     the whole Keccak/FIPS-202 stack   ~160s (9-52s each)
  #     VerifyCoreEqSpec 27s · NttFaithful 181s · Fips204BitPack 33s
  #
  # And `EqSpecW` is NOT a leaf: the chain is Spec → EqSpec → EqSpecW → UseHint → HashFrame →
  # ArgRows → ArgAssembly, one linear import spine, so four more modules SERIALIZE behind it and
  # no amount of runner parallelism hides it. Measured fresh here on 07-25 (contended box,
  # `lake env lean`, LEAN_NUM_THREADS=3): ArgAssembly 54s, ArgRows 496s, HashFrame 37s.
  #
  # WHY IT HAD TO MOVE, in CI's own numbers rather than a laptop's. The `metatheory-no-sorry`
  # job's "Zero-sorry guard" step is the verdict people actually read, and it is AT ITS OWN
  # TIMEOUT WALL:
  #     run 30148956262   Zero-sorry step 233 min      (job 279 min)
  #     run 30146325284   Zero-sorry step 315.6 min    (job killed at 335 min vs timeout 330)
  # 46 serial minutes is 15-20% of a step that has already been cancelled for length once. A
  # gate nobody waits for is on its way to being a gate nobody believes.
  #
  # WHY A PUSH-TRIGGERED JOB AND NOT A SCHEDULED "SLOW LANE" — the recommendation this deviates
  # from, with the number that justifies the deviation: `lake build
  # Dregg2.Crypto.VerifyCoreArgAssembly` compiles a **34-module in-tree closure**, not the
  # 1788-module corpus. Set-subtracting `Fips204ChallengeHash`'s closure (the 29 cheap modules
  # the default build keeps) leaves EXACTLY the five spine modules. So this lane is ~1h, not
  # ~5h, and it does not need a schedule to be affordable. That matters for coverage, not
  # tidiness: a nightly lane detects a regression up to 24h late and — as
  # proof-integrity-canary.yml's own header records, after its ⛔ lines sat unread in a
  # scheduled log for three days — needs a page-on-red job wired to it before anyone sees a
  # thing. This job is a CHECK on every run's checks page instead, next to the other Lean
  # gates, so its verdict arrives with the commit that caused it and needs no notification
  # machinery to reach a human. (lean-seed.yml, the repo's other long Lean lane, is scheduled
  # AND has no notify job — do not add a third of those.)
  #
  # Routed through axiom-hygiene-guard.sh, never a bare `lake build`: `sorry`/`admit` are Lean
  # WARNINGS (exit 0, no warningAsError in metatheory/lakefile.toml), so an exit-code-only step
  # would green with a sorry in the apex refinement. Same net as every other Lean job here.
  #
  # A RED HERE IS THE ML-DSA-65 VERIFY-CORE REFINEMENT ROTTING — `verifyCore_eq_specVerifyB_
  # noArg_deployed`, the deployed `MlDsaVerifyReal.verifyCore` ⟺ FIPS-204 `specVerifyB` apex —
  # not infra flake. Do NOT "fix" it by dropping the target.
  metatheory-pq-apex:
    name: ML-DSA verify-core apex spine (the 44-min serial tail, off the critical path)
    runs-on: ubuntu-latest
    # Generous but far below the corpus jobs' 330: the closure is 34 modules and the tail is
    # ~50 min of it. If this ever approaches 150, the spine grew a second expensive module —
    # measure it, do not raise the number.
    timeout-minutes: 150
    env:
      MATHLIB_REV: 1c2b90b13009c65b090d95a83c98e248deafb6f1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Identical toolchain + mathlib setup to metatheory-no-sorry. That was originally a
      # deliberate verbatim COPY — "if that job's mathlib provisioning is wrong, this lane must
      # be wrong the SAME way rather than differ in a way that hides it" — and it was indeed
      # wrong: see the ⚑ block on that job's fetch step. It is now the SAME SCRIPT rather than
      # the same text, so the two lanes cannot diverge at all.
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          bash elan-init.sh -y --default-toolchain "$(cat metatheory/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned mathlib4 (prebuilt oleans into metatheory/.lake/packages/mathlib)
        run: bash scripts/ci-mathlib-cache.sh

      # The five spine modules ride in as ArgAssembly's transitive imports; naming the apex
      # rather than the five keeps this target honest if the chain grows another rung.
      - name: The apex spine (VerifyCore{EqSpecW,UseHint,HashFrame,ArgRows,ArgAssembly})
        env:
          AXIOM_GUARD_TARGETS: Dregg2.Crypto.VerifyCoreArgAssembly
        run: bash scripts/axiom-hygiene-guard.sh

      # ⚑ THE ML-KEM KEYGEN REFINEMENT, GIVEN A HOME (2026-07-25, B5 orphan sweep).
      # `Dregg2.Crypto.MlKemKeygenRefine` was an UNLISTED orphan: reachable from nothing, named by
      # no CI step, compiled by NO target at all — its `#assert_axioms` had never run anywhere.
      # It is GREEN (verified: fresh `lake env lean`, exit 0, no `sorry`), so the only question was
      # where to pay for it, and that was MEASURED rather than guessed: 1882s = 31 min on one fresh
      # elaboration, and a TIMEOUT at 2400s on another. That is the `VerifyCoreEqSpecW` situation
      # (44 min) this whole job exists for, so it goes HERE and not into the default build or the
      # `metatheory-no-sorry` Orphan-gate step — both of which run in a job that has already been
      # cancelled once for length (315.6 min against `timeout-minutes: 330`).
      # ⚠ WHAT THIS BUYS AND WHAT IT DOES NOT: compilation + the zero-sorry/axiom net. NOT ratchet
      # visibility — it stays outside `Dregg2.lean`'s closure, so `#floor_ratchet` still cannot see
      # its declarations. That is acceptable ONLY because it mentions ZERO refuted floors (measured,
      # comments stripped), and `scripts/check-ratchet-darkness.sh` RULE 1 turns red the moment that
      # stops being true. `Dregg2.Circuit.Emit.AutomataflNGenGolden` rides along for the same
      # reason with a different cost story: it is a 2.98 MB byte-pinned wire golden, and the
      # "separate leaf so the refinement surface does not pay for the golden" posture is already
      # the documented precedent in `Dregg2.lean`'s `ParamComposeGolden` line.
      - name: The two orphans too expensive for the default build (MlKemKeygenRefine 31 min, AutomataflNGenGolden 2.98 MB golden)
        env:
          AXIOM_GUARD_TARGETS: >-
            Dregg2.Crypto.MlKemKeygenRefine
            Dregg2.Circuit.Emit.AutomataflNGenGolden
        run: bash scripts/axiom-hygiene-guard.sh

  descriptor-drift:
    name: Descriptor Lean↔JSON drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # The circuit descriptor JSONs (circuit/descriptors/*.json) and their *_FP
    # sha256 constants are MACHINE-GENERATED from the verified Lean emit (the
    # source of truth). This gate regenerates them via scripts/emit-descriptors.sh
    # and fails if the result differs from what is checked in — catching the
    # Lean→JSON drift the in-Rust sha256 round-trip test cannot (a stale JSON whose
    # self-consistent FP passes the round-trip while the Lean emission has moved).
    # Same elan + pinned-mathlib setup as the zero-sorry job (it needs `lake`).
    env:
      MATHLIB_REV: 1c2b90b13009c65b090d95a83c98e248deafb6f1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o elan-init.sh
          bash elan-init.sh -y --default-toolchain "$(cat metatheory/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Same shared provisioning script as the two metatheory jobs — see the ⚑ block on
      # metatheory-no-sorry's fetch step for what it replaced and what that cost.
      - name: Fetch pinned mathlib4 (prebuilt oleans into metatheory/.lake/packages/mathlib)
        run: bash scripts/ci-mathlib-cache.sh

      # The emit installs three WHOLE Lean-authored Rust modules
      # (circuit/src/effect_vm/*_generated.rs) and normalizes them through rustfmt, so the
      # generator's bytes equal what the pre-commit hook and `cargo fmt --all -- --check`
      # produce. Materialize the PINNED rustfmt up front: relying on the runner image's stable
      # rustfmt (or on rustup's implicit toolchain-file auto-install) would let a different
      # rustfmt decide the generated bytes, and this gate would then report a fake drift.
      - name: Install the pinned rustfmt (generated-Rust normalization)
        run: |
          channel="$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt
          rustfmt --version

      # Regenerates from Lean and `git diff --exit-code`s the descriptors + the
      # *_FP constants. On drift: prints the offending diff + the fix command and
      # exits nonzero. See docs/DESCRIPTOR-EMIT.md.
      - name: Descriptor drift gate
        run: bash scripts/check-descriptor-drift.sh

      # The emit-gate CROSS-LANGUAGE weld: every GOLDEN_JSON literal in
      # circuit-prove/tests/*_emit_gate.rs must be byte-identical to a Lean
      # #guard pin or a drift-gated descriptor artifact. Each side's own gate
      # (the Lean #guard at lake-build time, the Rust assert at cargo-test time)
      # is blind to the PAIR drifting — this is the check that compares them.
      # Static (no lake/cargo), <1s. Found 3 committed drifted pairs on arrival
      # (fold/derivation/garbled-eval, 2026-07-16 — see TESTQALOG.md).
      - name: Emit-gate weld (Rust golden == Lean pin)
        run: python3 scripts/check-emit-gate-weld.py
