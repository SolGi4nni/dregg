[package]
name = "dregg-app-framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Production application framework for dregg apps — server infra, admin auth, persistence, proof middleware, content stores, escrow lifecycle"

[dependencies]
dregg-sdk = { path = "../sdk" }
dregg-turn = { path = "../turn" }
# SURFACED BY THE DEFAULT-DROP: `stark_rehydrate.rs` calls
# `rotation_witness::mint_rotated_participant_leg` in LIBRARY code, and until PR3 it
# reached that only because `dregg-turn`'s `default = ["prover"]` pulled
# `dregg-circuit-prove` in transitively — the dep was never declared. It is now
# explicit. (`service_promise.rs`'s `mint_transfer_proven_receipt` use is test-only
# and rides the same crate.)
dregg-turn-prover = { path = "../turn-prover" }
dregg-intent = { path = "../intent" }
dregg-circuit = { path = "../circuit" }
# `stark_rehydrate` verifies the recursive IVC aggregate (the recursion tower),
# so it depends on the heavy prove crate.
dregg-circuit-prove = { path = "../circuit-prove" }
dregg-cell = { path = "../cell" }
dregg-types = { path = "../types" }
# The Payable DSI + the userspace method-routing core (resolve_against /
# InvokeAuthority / the canonical `payable_descriptor`). Lives BELOW the SDK so
# the SDK's metered tool-gateway charge and these app-facing wrappers go through
# ONE verified `pay` route table. The cipherclerk-bound `invoke` /
# `invoke_with_descriptor` / free `pay` here delegate to that pure core.
dregg-payable = { path = "../dregg-payable" }
# `kzg` is REQUIRED, not optional: `queue_endpoint` (an unconditional module) imports
# `dregg_storage::programmable::{ProgrammableQueue, ValidationContext}`, which storage
# gates behind its `kzg` feature. Without this app-framework fails to compile in any
# subgraph that does not otherwise unify `kzg` on (`cargo build -p dregg-app-framework`
# and every narrow `-p` consumer). Declaring the feature app-framework actually uses.
# `optional`/`server`-gated: the ONLY consumers are the endpoint modules
# (`inbox_endpoint`/`queue_endpoint`/`blinded_endpoint`), all of which sit behind the
# `server` feature. A `no-server` (e.g. wasm32) build does not pull `dregg-storage`.
dregg-storage = { path = "../storage", features = ["kzg"], optional = true }
dregg-captp = { path = "../captp" }

# The REAL transclusion primitive (`starbridge_web_surface::transclusion`): the
# verified cross-cell finalized read (`TranscludedField`/`Provenance`/`Backlinks`),
# the per-viewer `Membrane`, and `SurfaceCapability`/`WebOfCells`. The deos-app
# transclusion affordance (`src/transclude_affordance.rs`) is the NAMED consumer of
# these — it surfaces a transcluded peer field as a first-class framework affordance,
# reinventing neither the attested-read nor the cap model.
starbridge-web-surface = { path = "../starbridge-web-surface" }

# The HTTP app-SERVER surface (`server`/`auth`/`middleware`/the `*_endpoint`
# modules + `deos_app`/`scaffold`/`discovery`/`captp_server`) rides these, and NONE
# of them compile to wasm32 (`mio`/tokio-net, `reqwest`'s transport). They are
# `optional` and gated behind the `server` feature so the framework's CORE — the
# `EmbeddedExecutor` (the in-process turn admitter) + the cell/turn primitives —
# builds wasm-clean without them (`default-features = false`). `server` is in the
# default set, so every existing HTTP-service consumer is unchanged.
axum = { version = "0.8", optional = true }
http = { version = "1", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"], optional = true }
thiserror = { workspace = true }
base64 = { workspace = true }
blake3 = "1"
ed25519-dalek = { version = "2", features = ["std"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }

[dev-dependencies]
tower = "0.5"

[features]
default = ["server"]
dev = ["dregg-sdk/dev"]
# The HTTP app-server surface. Bundles the non-wasm32 transport stack
# (`axum`/`tokio`(full)/`reqwest`/`tower-http`/`http`) + `dregg-storage` (only the
# gated endpoint modules use it), and compiles the server/endpoint modules. ON by
# default so existing consumers are unchanged; a wasm-clean build takes
# `default-features = false` and gets the `EmbeddedExecutor` + primitives only.
#
# ⚑ THIS FEATURE IS A KNOWN, MEASURED FOOTGUN AND IS NOT FIXED. Two things are wrong with it and
# the second is why the first matters.
#
# (1) IT GATES MORE THAN THIS COMMENT SAYS. The description above ("the server/endpoint modules")
#     covers 11 of the 13 whole modules it actually gates. SWEPT 2026-07-27 over `src/lib.rs`:
#     13 `pub mod` — affordance_endpoint, auth, blinded_endpoint, captp_server, discovery,
#     fee_policy, inbox_endpoint, middleware, queue_endpoint, scaffold, server, store,
#     transclude_affordance — plus 9 `pub use` blocks, 19 inline sites in `deos_app.rs` and 3 in
#     `webgen.rs`: 45 in all. `fee_policy`, `store`, `transclude_affordance` and
#     `webgen::render_surface_component` are named NOWHERE as part of "the server surface".
#     `transclude_affordance` is the one that should stop a reader: this manifest describes it
#     twenty lines up as "a first-class framework affordance" over `starbridge-web-surface`'s
#     transclusion primitive — an UNCONDITIONAL dep — and it is switched off with axum.
#
# (2) 23 WORKSPACE MEMBERS PASS `default-features = false` HERE, AND CARGO OVERRULES THEM. This
#     crate is a root member with `default = ["server"]`, so any whole-workspace command unifies
#     `server` back on for all 23. MEASURED with `cargo build --unit-graph --all-targets`:
#
#       -p spween-dregg / -p dregg-automatafl / -p dregg-multiway-tug / -p collective-choice /
#       -p dregg-schema / -p starbridge-web-surface / -p dreggnet-council
#                                              dregg-app-framework = []            (13 modules ABSENT)
#       --workspace                            dregg-app-framework = default,server (13 modules PRESENT)
#
#     Seven of nine sampled narrowing consumers are a DIFFERENT PROGRAM depending on which other
#     packages cargo was asked about. (The other two, `dreggnet-catalog` and
#     `starbridge-privacy-voting`, resolve `default,server` even under `-p`, because something else
#     in their own sub-resolve turns it on — the same mechanism pointing the other way.)
#
# THE FIX IS A CRATE, NOT A SMALLER FEATURE: the transport-bearing half belongs in its own
# unconditionally-compiled `dregg-app-framework-server`, because a dep EDGE is prunable per
# selection while a feature unifies. That is a real API move (the 22 re-exports above are public)
# across 37 first-party files that name a gated symbol, and it is deliberately NOT started here —
# a half-moved crate would leave BOTH a feature and a crate, which is worse than either.
server = [
    "dep:axum",
    "dep:http",
    "dep:tower-http",
    "dep:tokio",
    "dep:reqwest",
    "dep:dregg-storage",
]
# PLATFORM gate passthrough (polarity-inverted, .docs-history-noclaude/FEATURE-HYGIENE.md §Lean): the verified
# Lean producer is UNCONDITIONAL on native (the sdk compiles it in by default; runtime-gated
# by `DREGG_LEAN_PRODUCER` / `EmbeddedExecutor::set_lean_producer`). Only wasm32/zkvm builds
# set `no-lean-link`, which compiles the legacy Rust-producer path instead.
no-lean-link = [
    "dregg-sdk/no-lean-link",
]

[lints]
workspace = true
