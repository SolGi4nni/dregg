# attested-dm — an attested, cap-bounded AI dungeon-master with a CERTIFIED prompt.
#
# A confined + attested LLM narrates an on-chain interactive world: each narration /
# NPC-response is a RECEIPTED attested turn advancing a world-cell, carrying a
# `ZkOracleAttestation` proving the turn was
#   authentic     — from a real model (a genuine `/v1/messages` session), not forged;
#   well-formed    — the response body lies in the JSON context-free language;
#   injection-free — the bound narration carries no `{{` handlebars delimiter.
#
# THE CLAIM, AND ITS LIMIT. Two STRUCTURAL properties, both about bytes and both
# machine-checked — and NOT a claim that the model cannot be talked into anything:
#   PROMPT INTEGRITY   — the submitted prompt is exactly the pinned template expanded
#                        with the declared inputs. Assembly runs through the
#                        proof-producing templater (`dregg_zkoracle_prove::render`) and
#                        emits a certificate over the exact payload bytes; the verifier
#                        REPRODUCES the expansion and byte-compares.
#   SLOT CONFINEMENT   — player text occupies only the declared data slot. Admitted only
#                        if `{{`-free (the verified matcher) and fence-token-free;
#                        rendered into a data region disjoint from the instruction
#                        region; and the payload's parse certificate witnesses that
#                        those bytes are the contents of ONE JSON string value.
# A player CAN still write "ignore your instructions" — that is admitted as DATA, on
# purpose (refusing it would make this a content filter). Whether the model then
# complies is a property of the model, is NOT established here, and is NOT claimed.
# The DM's authority is separately cap-bounded: it can only narrate / advance within its
# granted affordances (it cannot grant a player an unearned item).
#
# COMPOSES the real substrate primitives, reimplementing no theorem:
#   * zkoracle-prove — `prove_zkoracle` / `verify_zkoracle` over an Anthropic
#     `/v1/messages` session: each narration carries a `ZkOracleAttestation`
#     (authentic ∧ well-formed ∧ injection-free). The SAME primitives
#     `deos_hermes::attest::AttestationCarrier` wraps; we compose them DIRECTLY (the
#     modeled ed25519 authentic carrier + the JSON CFG parse-cert + the injection
#     matcher — no HTTP/TLS, no verified-Lean-executor link) so the default build
#     stays light, exactly as `confined-swarm` did. The real local MPC-TLS 2PC
#     roundtrip is behind `tlsn-live`. The full OS-jailed confined DM body is
#     `deos_hermes::DreggHost::run_hosted_agent_attested` (the crown) — the same
#     attestation primitives, run inside a firmament jail.
#
# A workspace MEMBER of the breadstuffs root (registered in `members`, not
# `default-members`). The root `[workspace]` + `[patch]` tables apply; no standalone
# `[workspace]`/`[patch]` here. Build it as a member with
#   cargo build -p attested-dm
#   cargo test  -p attested-dm

[package]
name = "attested-dm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "An attested, cap-bounded AI dungeon-master with a certified prompt: every narration is a receipted verifiable turn (authentic ∧ well-formed ∧ injection-free), the submitted prompt is a certified expansion of the committed template, and player text is structurally confined to a declared data slot."

[lib]
name = "attested_dm"
path = "src/lib.rs"

[dependencies]
# THE ATTESTATION — each narration carries a `verify_zkoracle`-checkable proof it is
# from a real model (authentic), well-formed, and injection-free. Composed directly so
# the DM stays light (no HTTP/TLS on the default path).
dregg-zkoracle-prove = { path = "../zkoracle-prove" }
# The LIVE MPC-TLS backend, an OPTIONAL DEPENDENCY rather than a feature reaching into
# `dregg-zkoracle-prove`. That forward used to flip that shared crate's `verify_mpctls_leg`
# for EVERY member of the resolve; this edge adds code here and changes nothing there.
dregg-zkoracle-live = { path = "../zkoracle-live", optional = true }


# VERIFIABLE RANDOMNESS — a provably-fair game mechanic (a loot chest that drops via a
# seed-determined, unbiased d-N draw). `EventId::derive` binds the draw to the turn's
# context (game/seq/pre-state/action/purpose/draw-count) BEFORE the result exists; the
# recorded `RandomnessRequest` + `RandomnessEvidence` ride the receipt chain, and
# `verify_replay` re-derives the event id, re-verifies the evidence via the pure
# `RandomnessSource::seed` verifier, rebuilds the draw stream, and re-runs the resolver.
dregg-dice = { path = "../dice" }

# The receipt-id commitment over a landed attestation (the on-ledger fingerprint a
# light client recomputes) — the SAME BLAKE3 shape `deos_hermes::attest` uses.
blake3 = "1"

# THE FEDERATION SEAM — `NodeTarget::Local` (default, in-process ledger) or `Federation`
# (route each landed narration's receipt commitment to a real `DREGG_NODE_URL` node +
# confirm it landed). One flip from a live federation; a rejected submit refuses the turn.
dregg-node-target = { path = "../node-target" }

# SAVE / LOAD PERSISTENCE — a `SaveGame` serializes a session (world identity + the current
# world state + the full receipt ledger + the randomness provider) to a portable JSON form and
# `GameSession::load` reconstructs + RE-VERIFIES it fail-closed (chain integrity + from-genesis
# re-execution). `dregg-dice`'s randomness records already derive serde, so the whole ledger
# round-trips. Unlocks resumable web / cross-session play. See `src/savegame.rs`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# THE CROWN, run REAL-LOCALLY. Attest the narration over a GENUINE local MPC-TLS 2PC
# roundtrip (zkoracle-prove's vendored TLSNotary) instead of the modeled ed25519
# carrier. OFF by default so the standard build stays HTTP/TLS-free.
tlsn-live = ["dep:dregg-zkoracle-live"]

[lints]
workspace = true
