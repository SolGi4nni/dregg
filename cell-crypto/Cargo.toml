[package]
name = "dregg-cell-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Cryptographic capability/note/value machinery over dregg-cell types"

[dependencies]
blake3 = "1"
bulletproofs = { version = "5" }
chacha20poly1305 = { workspace = true }
curve25519-dalek = { version = "4", features = ["alloc"] }
ed25519-dalek = { version = "2", features = ["hazmat"] }
getrandom = { workspace = true }
merlin = { version = "3" }
postcard = { version = "1", features = ["alloc"] }
x25519-dalek = { workspace = true }
zeroize = { workspace = true }
dregg-cell = { path = "../cell" }
dregg-circuit = { path = "../circuit" }
dregg-pq = { path = "../dregg-pq" }
dregg-types = { path = "../types" }
serde = { version = "1", features = ["derive", "std"] }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# NOTE 2026-08-07: the dev-dependency on `dregg-circuit-prove` is GONE. It existed for exactly one
# thing — the value-link tests built a `spend_circuit::ShieldedSpendWitness` to cross-check its
# `value_binding()` against this crate's `value_link_binding`. That Rust-authored AIR is deleted
# (house law #1) and the check was twin-vs-twin, not circuit-vs-cell. Nothing here needs the prover.
# TEST-ONLY: installs the Lean-verified ML-DSA cores so the capability-proof tests can run a PQ
# operation at all — `dregg-pq` refuses an uninstalled one with `process::abort()`, and this crate
# cannot link the archive from `[dependencies]`. See `dregg-pq-testkit`'s crate docs.
dregg-pq-testkit = { path = "../dregg-pq-testkit" }

[lints]
workspace = true
