[package]
name = "dregg-cell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Agent cell model — capability-secure isolated execution contexts"

[features]
default = []
# `dregg-circuit` is now an always-present dependency (the canonical
# capability-root scheme `dregg_circuit::cap_root` is load-bearing in the
# always-on `compute_canonical_state_commitment`, so it must not be
# feature-gated).
#
# `zkvm` IS GONE (2026-08-07), and it went the same way `prover` did — except this one
# did real damage on its way out. It was
#     zkvm = ["dep:dregg-commit", "dep:dregg-dsl-runtime"]
# and BOTH optional deps were dead: `grep -rn 'dregg_commit\|dregg_dsl_runtime' cell/src/`
# returns only comments, one of which (`commitment.rs:763`) states outright that "this
# crate cannot see `dregg-commit`". So the feature selected two crates nothing in here
# could reference.
#
# What it DID gate was six items, all of them in `note.rs`'s test module: the five
# Poseidon2 note-commitment INJECTIVITY teeth (`…binds_owner_high_bytes`,
# `…binds_creation_nonce_high_bytes`, `…binds_randomness_high_bytes`,
# `…binds_full_u64_value_and_asset_type`, `…deterministic`) and their shared helper.
# `zkvm` is not in `default`; no `--features`/`--all-features` line in any workflow,
# script or manifest in this workspace named it; and its ONLY enabler was
# `circuit/sp1-guest`, a SEPARATE workspace (`[workspace]` in its own manifest)
# targeting `riscv32im-succinct-zkvm-elf` — so Cargo feature unification could not
# reach a native build from it even in principle. Measured 2026-08-07:
# `cargo nextest list -p dregg-cell` at HEAD listed 1084 tests and NONE of those five.
# They had never executed in any ordinary build, on any box.
#
# The tests need nothing the feature provided (`Note::poseidon2_commitment` is and always
# was unconditional), so they are now plain `#[test]`s and the feature — with its two dead
# optional deps — is deleted. `circuit/sp1-guest/Cargo.toml` dropped its
# `features = ["zkvm"]` in the same change; nothing else forwarded it.
# `prover` IS GONE. It was `prover = []` — zero forwards, zero `#[cfg]` sites — retained
# "so downstream `dregg-cell/prover` forwards remain valid". There were none left: the two
# that existed (`dregg-turn`'s and `dregg-sdk`'s) were both deleted, and their manifests say
# so. A feature that gates nothing is worse than one that gates something, because the next
# reader believes the name.
# SOUNDNESS GATE — DO NOT ENABLE IN PRODUCTION.
#
# `test-stubs` arms the *accept* path of `StubVerifier` (predicate.rs), which
# otherwise FAILS CLOSED on every proof. Without this feature (and outside
# `#[cfg(test)]`), `WitnessedPredicateRegistry::with_stubs()` installs verifiers
# that reject every proof — so a misconfigured host that selects the stub
# registry can never authorize a forged witness.
#
# Downstream *test* crates that rely on the permissive stub behavior enable
# `dregg-cell/test-stubs` in their `[dev-dependencies]` — NOT `[dependencies]`.
# That distinction is the whole guarantee and it is not a style preference:
# under resolver 3 a dev-dependency's features are not unified into a non-test
# build, while a normal dependency's features unify across the workspace. This
# crate's dependents that need the stubs (turn, turn-prover, intent, exec-lean,
# tests) all use `[dev-dependencies]`.
#
# HOW THIS IS ENFORCED (a comment is not an enforcement mechanism, and this one
# was previously FALSE — `tests/Cargo.toml` had the entry under `[dependencies]`
# and `dregg-tests` is in `default-members`, so a root `cargo build --release`
# armed the stub accept path inside the `dregg-node` production binary):
#   1. `predicate.rs` carries a `compile_error!` that fires if `test-stubs` is
#      on in a build with `debug_assertions` off that has NOT attested it is a
#      test target (see `test-stubs-release-test-target` below). A production
#      release build with the feature armed does not compile.
#   2. `tests/tests/test_stubs_firewall.rs` asserts that NEITHER feature reaches
#      the production graph, by three independent probes: the
#      `cargo tree -p dregg-node -p dregg-tests -e features,no-dev -i dregg-cell`
#      resolve that caught the original leak; the same resolve widened to the
#      whole workspace; and a direct scan of every workspace manifest for a
#      non-dev-dependency entry naming either feature. That last probe covers
#      the one case the `compile_error!` cannot see — see the note below.
test-stubs = []
# ATTESTATION, NOT A CAPABILITY. This feature gates ZERO code. Its only effect is
# to silence the `compile_error!` in `predicate.rs`, and the only thing it claims
# is "this compilation of `dregg-cell` feeds a TEST target that happens to be
# built with `debug_assertions` off" — i.e. `cargo test --release` /
# `cargo check --release --tests`.
#
# WHY IT EXISTS. The `compile_error!` used to key off `debug_assertions` alone,
# which reads "release ⟹ production". That implication is FALSE: `dregg-cell` is
# a *dependency* of its test consumers, so `cfg(test)` is never set for it either
# way, and a release TEST build is indistinguishable from a release PRODUCTION
# build. The gate fired on both, so `dregg-turn`, `dregg-intent`,
# `dregg-exec-lean`, `dregg-turn-prover` and `dregg-tests` could only build their
# test targets in the `dev` profile — forcing every verification lane onto the
# single contended `target/debug` lock and leaving the independently-locked
# `target/release` lane unusable for exactly the crates that needed it most.
# See `scripts/pbuild`.
#
# WHAT IT DOES NOT WEAKEN. The historical accident — `dregg-cell = { features =
# ["test-stubs"] }` written under `[dependencies]` — still hits the
# `compile_error!` verbatim, because that spelling carries no attestation. So
# does `cargo build --release --features dregg-cell/test-stubs`. The ONE case the
# compiler can no longer see is a `[dependencies]` entry that also copies this
# attestation across; no Cargo-level opt-in can be made un-copy-pasteable, so
# that case is carried by the manifest scan in `test_stubs_firewall.rs`.
#
# It is a pure marker (`[]` — it does NOT imply `test-stubs`), so enabling it
# alone in a production graph arms nothing at all.
test-stubs-release-test-target = []

[dependencies]
blake3 = "1"
postcard = { version = "1", features = ["alloc"] }
# Required (always present) for the canonical capability-root scheme in
# `compute_canonical_capability_root` (`dregg_circuit::cap_root`). Default
# features, matching every other workspace consumer of circuit (node/sdk/turn,
# and wasm via `dregg-commit`) — Cargo feature unification already builds
# circuit full-featured everywhere, so this adds no new feature surface.
# NOTE: circuit's dependency on cell is dev-only, so this (cell → circuit)
# direction is acyclic.
dregg-circuit = { path = "../circuit" }
# Real `WitnessedPredicateKind::Dfa` verifier: the out-of-circuit re-check of a
# serialized `AirTrace` (`dregg_dfa::verify_acceptance`). Default features only
# (the `federation-verifier` feature is NOT pulled), so this is acyclic —
# dregg-dfa's default deps are blake3/serde/postcard, none of which reach cell.
dregg-dfa = { path = "../dfa" }
dregg-types = { path = "../types" }
serde = { version = "1", features = ["derive", "std"] }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Integration tests under `cell/tests/` compile the crate as a normal
# dependency (so `cfg(test)` is NOT set for the library), so they arm the
# fail-closed `StubVerifier` accept path via the `test-stubs` feature. This is
# scoped to dev/test builds and is never enabled in production.
dregg-cell = { path = ".", features = [
    "test-stubs",
    "test-stubs-release-test-target",
] }

[lints]
workspace = true

[[example]]
name = "predicate_language"
path = "examples/predicate_language.rs"
