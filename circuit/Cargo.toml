[package]
name = "dregg-circuit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Zero-knowledge proof circuits for dregg authorization token chains"

[dependencies]
# Plonky3 core (workspace-pinned). THE VERIFY FLOOR (split policy 2): these are
# the prover-FREE batch-STARK VERIFY surface deps + the recursion-free batch
# prover (`p3-batch-stark`'s `prove_batch`/`verify_batch`, `p3-uni-stark`). They
# are ALWAYS-ON — `dregg-circuit` is the verify-level floor. The three
# RECURSION-ONLY crates (`p3-recursion` / `p3-circuit` / `p3-circuit-prover`) are
# NOT here; they moved with the recursion tower to `dregg-circuit-prove`, which
# keeps `cargo tree -p dregg-circuit` free of the recursion prover.
p3-field = { workspace = true }
p3-baby-bear = { workspace = true }
p3-air = { workspace = true }
p3-matrix = { workspace = true }
p3-uni-stark = { workspace = true }
p3-challenger = { workspace = true }
p3-commit = { workspace = true }
p3-fri = { workspace = true }
p3-symmetric = { workspace = true }
p3-dft = { workspace = true }
p3-poseidon2 = { workspace = true }
p3-mds = { workspace = true }
p3-monty-31 = { workspace = true }
p3-merkle-tree = { workspace = true }
p3-util = { workspace = true }
p3-batch-stark = { workspace = true }
p3-lookup = { workspace = true }
p3-poseidon2-circuit-air = { workspace = true }

# Dregg DSL proc-macro — the temporal_predicate_dsl module is the manually-expanded
# equivalent of the #[dregg_circuit] macro output (the macro cannot self-reference
# within its own crate, so we expand it manually).
dregg-dsl = { path = "../dregg-dsl" }

# THE CANONICAL BYTE->FELT CODEC, promoted from a dev-dep to a real one on 2026-08-01. The
# dev-dep comment said "promoting it to a real dependency is Stage 2/3, when the projectors move";
# `poseidon2::hash_bytes` is a projector and it moved. `dregg-codec` is still a dependency LEAF
# (no workspace path deps of its own), so this edge cannot cycle.
dregg-codec = { path = "../dregg-codec" }

postcard = { version = "1", features = ["alloc"] }

blake3 = "1"
getrandom = { workspace = true }
serde = { version = "1", features = ["derive"] }
tracing = { version = "0.1" }
itertools = { version = "0.14" }
rand = { version = "0.10" }
rmp-serde = { version = "1.2" }

# THE VERIFY-LEVEL FLOOR (split policy 2). `dregg-circuit` is unconditionally the
# prover-FREE batch-STARK VERIFY surface PLUS the recursion-free `prove_batch`
# provers; all its p3 deps are non-optional. The recursion prover
# (`p3-recursion`/`p3-circuit`/`p3-circuit-prover`) lives in `dregg-circuit-prove`.
#
# `plonky3` is RETAINED as an always-on no-op feature (default-on) so the existing
# `#[cfg(feature = "plonky3")]` sites resolve true on the floor. The old `verifier`
# and `prover` features are GONE (their items are now unconditional or moved); a
# consumer that wants the prove surface depends on `dregg-circuit-prove`.
[features]
default = ["plonky3"]
plonky3 = []

[dev-dependencies]
criterion = { workspace = true }
dregg-bridge = { path = "../bridge", features = ["test-utils"] }
dregg-cell = { path = "../cell" }
dregg-cell-crypto = { path = "../cell-crypto" }
# Test-layer ONLY: the shielded both-polarity tests construct a wrapped-negative
# value commitment to exercise the per-output range-proof inflation gate. The
# circuit crate stays upstream of the curve stack (value commitments ride as
# opaque bytes); this dep is confined to integration tests at the cell/test seam.
curve25519-dalek = { version = "4", features = ["alloc"] }
dregg-trace = { path = "../trace" }
dregg-token = { path = "../token", default-features = false, features = ["macaroon", "rand-deps"] }
dregg-turn = { path = "../turn" }
# Used by benches (proof_benchmarks, practical_benchmarks). dregg-dsl-runtime is a
# thin re-export over dregg-circuit::dsl; this is a dev-dep cycle that Cargo permits
# (dev-deps are not used when building dregg-circuit as a library dependency).
dregg-dsl-runtime = { path = "../dregg-dsl-runtime" }
getrandom = { workspace = true }
# DeployedRefines differential (tests/deployed_refines_verifier_teeth.rs): mutate an
# honest p3 BatchProof's opened `Challenge` (EF) values to witness that each verifyAlgo
# tooth bites in the deployed `verify_batch`. Needs the extension-field element type.
p3-field = { workspace = true }
p3-baby-bear = { workspace = true }
# MEASUREMENT ONLY (tests/poseidon2_virtualization_measure.rs). Upstream Plonky3's own
# Poseidon2 AIR at the workspace-pinned rev, used as the NARROW arithmetization arm of the
# committed-vs-virtualized measurement: it commits one column per partial round where the
# deployed chip commits sixteen. It is a MEASUREMENT BASELINE and is never on any shipped
# path — the narrow layout, if adopted, is authored in
# `metatheory/Dregg2/Circuit/Emit/Poseidon2RoundGates.lean` like the deployed one.
p3-poseidon2-air = { git = "https://github.com/Plonky3/Plonky3", rev = "82cfad73cd734d37a0d51953094f970c531817ec" }
blake3 = "1"
rmp-serde = { workspace = true }
# proof-economics measurements (tests/proof_economics.rs): structural walk of
# serialized proofs to count commitment-path digests for the pickles-bridge estimate.
serde_json = { workspace = true }
# TEST-LAYER ONLY. `tests/pasta_windowed_prove.rs` pins the CONTENT of the two Lean-emitted
# artifacts it consumes (the windowed RCB descriptor and its honest 64-row witness) by sha256, so
# a silent re-emit cannot slide under a green test. Deliberately a dev-dep: `dregg-circuit` is the
# verify-level floor and takes no hash dependency it does not need.
sha2 = { workspace = true }
# TEST-LAYER ONLY. `tests/ir2_phase_profile.rs` installs a `Layer` that accumulates plonky3's OWN
# `#[instrument]` spans into a per-phase wall-clock table (LDE / Merkle / quotient / FRI fold /
# query). Every span it reads already exists upstream; this is the collector, not new
# instrumentation. Already in the lock at 0.3 via `dregg-circuit-prove`'s dev-deps.
tracing-subscriber = "0.3"
# TEST-LAYER ONLY. `tests/grind_phase_measure.rs` needs an EXPLICIT `ThreadPool` to measure the PoW
# grind's thread scaling (`RAYON_NUM_THREADS` is read once per process, so it cannot sweep). This
# is the same rayon the vendored `p3-challenger` grinds on — already in the lock at 1.12 via
# `p3-maybe-rayon` with `features = ["parallel"]`; no new resolution.
rayon = "1"
# TEST-LAYER ONLY. `tests/ir2_field_op_counts.rs` instantiates plonky3's `Field` over a counting
# newtype to get exact scalar-equivalent field-op counts; `Field::order()` returns a
# `num_bigint::BigUint` and the trait's required signature has to name that type. Already in the
# lock at 0.4.6 via `p3-field` itself; this adds an edge, not a resolution.
num-bigint = "0.4"

[lints]
workspace = true
