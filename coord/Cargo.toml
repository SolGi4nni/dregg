[package]
name = "dregg-coord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Two-layer turn coordination: causal chaining + atomic multi-party turns"

[dependencies]
dregg-cell = { path = "../cell" }
dregg-blocklace = { path = "../blocklace" }
dregg-turn = { path = "../turn" }
dregg-types = { path = "../types" }
blake3 = "1"
ed25519-dalek = { version = "2", features = ["std"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }

# FFI-FREE BY CONSTRUCTION: the coordinator's 2PC / causal-order / shared-budget decisions route
# through the `verified_gate` SEAM (`CoordVerifiedGate`), never `dregg-lean-ffi` directly. A native
# node installs the Lean-backed gate (from `dregg-exec-lean`) once at startup. When no gate is
# registered the live path FAILS CLOSED (2PC ⇒ Abort, causal ⇒ not-ordered, shared-budget ⇒ reject
# all debits) — never a silent native decision. The native Rust deciders survive ONLY under
# `cfg(test)` as the `coord_diff.rs` differential siblings; they are absent from any release/consumer
# build. `tests/twin_fail_closed.rs` pins the fail-closed refusal on the non-cfg-test path.

[lints]
workspace = true
