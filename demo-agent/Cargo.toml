[package]
name = "dregg-demo-agent"
version.workspace = true
edition.workspace = true

[dependencies]
dregg-cell = { path = "../cell" }
dregg-cell-crypto = { path = "../cell-crypto" }
dregg-turn = { path = "../turn" }
# The `cross_fed_atomic` example mints a genuine proven receipt
# (`dregg_turn_prover::mint_transfer_proven_receipt`) — moved out of `dregg-turn`'s
# deleted `prover` feature into the prover crate.
dregg-turn-prover = { path = "../turn-prover" }
dregg-coord = { path = "../coord" }
dregg-types = { path = "../types" }
dregg-bridge = { path = "../bridge", features = ["test-utils"] }
dregg-circuit = { path = "../circuit" }
dregg-dsl-runtime = { path = "../dregg-dsl-runtime" }
dregg-commit = { path = "../commit" }
dregg-sdk = { path = "../sdk" }
dregg-trace = { path = "../trace" }
dregg-federation = { path = "../federation" }
dregg-intent = { path = "../intent" }
dregg-token = { path = "../token", default-features = false, features = ["macaroon", "rand-deps"] }
blake3 = "1"
serde_json = { workspace = true }
ed25519-dalek = { version = "2", features = ["hazmat"] }
getrandom = { workspace = true }
postcard = { version = "1", features = ["use-std"] }

[[bin]]
name = "dregg-agent-demo"
path = "src/main.rs"

