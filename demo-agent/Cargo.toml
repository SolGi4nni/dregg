# RETIRED (2026-07-25): base_anonymous_credential removed. It was built on the
# deleted committed-threshold hand-STARK, and its headline claim (anonymous
# credential verified ON-CHAIN via SP1 STARK->Groth16 on Base) was entirely
# simulated: `simulate_onchain_verify` returned true for ANY non-empty byte
# slice, the "Groth16 proof" was a blake3 hash, and ring membership was a
# printed narrative. Nothing in it executed. The surviving, real capability
# (prove a predicate over a credential without revealing the value) is
# demonstrated end-to-end by `anonymous_credit_check`.

[[example]]
name = "base_private_transfer"

