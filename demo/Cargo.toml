[package]
name = "dregg-demo"
version.workspace = true
edition.workspace = true

# NO `[features]`. This crate declared `default = ["prover"]` / `prover = []`, with a comment
# claiming the flag "forwards to `dregg-circuit/prover`" and compiles out two `silver-helper`
# subcommands. All three claims were false: `dregg-circuit` has no `prover` feature at all
# (`circuit/Cargo.toml` declares only `default = ["plonky3"]` / `plonky3`), `prover = []`
# forwarded nothing, and this crate contains ZERO `#[cfg(feature = "prover")]` sites — the two
# subcommands are unconditional. Nothing in the tree depends on `dregg-demo`, so the feature had
# no consumers either. A name is a claim; this one was writing checks the code did not cash.

[dependencies]
blake3 = "1"
ed25519-dalek = { version = "2", features = ["std"] }
getrandom = { workspace = true }
hex = "0.4"
postcard = { version = "1", features = ["use-std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
dregg-captp = { path = "../captp" }
dregg-cell = { path = "../cell" }
dregg-circuit = { path = "../circuit" }
dregg-commit = { path = "../commit" }
dregg-federation = { path = "../federation" }
dregg-turn = { path = "../turn" }
dregg-types = { path = "../types" }
dregg-verifier = { path = "../verifier" }
# Cross-app demo helper — drives the four anchor starbridge-apps through
# `EmbeddedExecutor` to produce real `TurnReceipt`s per step.
dregg-app-framework = { path = "../app-framework" }
dregg-credentials = { path = "../credentials" }
starbridge-identity = { path = "../starbridge-apps/identity" }
starbridge-nameservice = { path = "../starbridge-apps/nameservice" }
starbridge-governed-namespace = { path = "../starbridge-apps/governed-namespace" }
starbridge-subscription = { path = "../starbridge-apps/subscription" }

[[bin]]
name = "dregg-demo"
path = "src/main.rs"

[[bin]]
name = "silver-helper"
path = "two-ai-handoff/silver_helper.rs"

[[bin]]
name = "cross-app-helper"
path = "cross-app-e2e/cross_app_helper.rs"

[lints]
workspace = true
