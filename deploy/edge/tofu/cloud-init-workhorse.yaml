#cloud-config
# THE WORKHORSE — services live here, and this box is disposable on purpose.
#
# It runs docker and nothing else of consequence. It does NOT build: persvati
# (CPU) and hbox (GPU) build, and IMAGES ship here. Anything in this tree that
# tells you to run cargo or rustup on an edge box is superseded fiction —
# deploy/README.md § "Where to build" and deploy/aws/SUPERSEDED/.

package_update: true
package_upgrade: true

packages:
  - curl
  - ca-certificates
  - gnupg
  - unattended-upgrades

write_files:
  - path: /etc/motd
    content: |

        dregg-workhorse — node, resolver, and the rest of the stack.

        DO NOT BUILD HERE. Build on persvati or hbox, ship the image:
          docker save <img> | gzip | ssh root@<this box> 'gunzip | docker load'

        The compose that defines this box lives in the REPO, at
        deploy/edge/compose/ — not in /opt. That is TODO-4, fixed. If you find
        yourself editing a compose file that exists only on this machine, stop:
        that is precisely the failure this box was built to end.

        Declared in: deploy/edge/tofu/  (breadstuffs)

  # Persistent state, on a real path. We permanently lost a devnet ledger to a
  # hand-run node whose --data-dir was a mktemp (deploy/README.md, "What we
  # permanently lost"). Never again: this directory is declared, and backed up.
  - path: /etc/tmpfiles.d/dregg-state.conf
    content: |
      d /var/lib/dregg 0750 root root -
      d /var/lib/dregg/node 0750 root root -

runcmd:
  # Docker, from Docker's own repo.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemd-tmpfiles --create
  - curl -fsSL https://tailscale.com/install.sh | sh
  - |
    if [ -n "${ts_authkey}" ]; then
      tailscale up --authkey="${ts_authkey}" --ssh
    fi
  - systemctl enable --now docker
  - systemctl enable --now unattended-upgrades

apt:
  conf: |
    Unattended-Upgrade::Automatic-Reboot "false";

final_message: "dregg-workhorse up. Ship images, then `docker compose up -d` from deploy/edge/compose/."
