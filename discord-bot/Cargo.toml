procgen-dregg = { path = "../procgen-dregg" }
# THE IPFS TRANSPORT behind `/gallery publish pin:true` + the shown CID (`src/commands/
# gallery_ipfs.rs`): `KuboClient`/`StdHttpPost` push the canonical payload to the operator's
# node, and `MockIpfs` derives the (content-pure) CID offline. Already in the closure via
# ugc-dregg's `ipfs` module; named directly for the client types. A root workspace member.
dregg-ipfs = { path = "../dregg-ipfs" }
# GEAR + TALENTS on `/play` (`src/commands/gear.rs`): `LoadoutOffering` (equip = a KERNEL
# cross-cell ownership predicate) and `TalentTreeOffering` (class-gated, prereq-chained,
# respec-capable) — both already `impl Offering`; the bot adds only the two `DiscordOffering`
# blocks. A root workspace member, consumed (never modified).
dreggnet-gear = { path = "../dreggnet-gear" }
# The soulbound cheevo ledger — `commands::rpg_world` earns the player's REAL achievements
# (CheevoLedger::earn over their persisted /descent completions) for the /play cheevos surface.
dreggnet-cheevo = { path = "../dreggnet-cheevo" }
# The composed-proof wire type (`composition::ComposedProof`) the bot deserializes a fetched
# full-turn STARK into before running the audited `dregg_sdk::verify_full_turn` (backlog #11).
# Already resolved in the lock via dregg-sdk; named directly for the type.
dregg-dsl-runtime = { path = "../dregg-dsl-runtime" }
# THE ATTESTED NARRATOR (`DREGG_NARRATOR=chutes-tee`) — `ChutesTeeBackend` is a
# `dregg_narrator::ConverseBackend` whose inference runs inside a DCAP-verified Intel TDX
# enclave: the request body is ML-KEM-768-encapsulated to an `e2e_pubkey` bound into a quote
# verified against the pinned Chutes measurement registry, and the reply is decrypted with an
# ephemeral key only this process holds. `build_paid_narrator` wraps it in the SAME
# `PaidNarrator` (per-run USD ledger, metered reserve → call → true-up) as every other hosted
# backend. FAIL-CLOSED at both levels: a misconfigured/refused attestation yields NO narrator
# (the run falls to the free tier) and NEVER the unattested `OpenAiCompatClient`. A root
# workspace member (its `workspace = true` deps resolve against the root manifest it lives
# under); it brings dregg-tee-verify → dcap-qvl + PQClean ML-KEM C into this graph — that C is
# the attestation stack, not the bot's PQ signing posture (`DREGG_ALLOW_UNAUDITED_PQ`).
#
# `collateral-fetch` is ON for THIS binary, and the reason is not convenience.
#
# The crate's default (pre-fetched `CHUTES_COLLATERAL_JSON`) suits a deployment that knows which
# platform its enclave runs on. This bot does not: Chutes answers from a FLEET, and DCAP
# collateral is per-platform (keyed by the quote's FMSPC/TCB) — `attest::load_collateral` hands
# the SAME pre-fetched blob back for every quote, so the moment a different Chutes host answers,
# verification fails. It also EXPIRES: collateral carries validity windows the verifier checks
# against wall-clock now, so a file pinned once ages into a fail-closed refusal with no signal
# other than "paid runs quietly use the free tier".
#
# Without this feature `CHUTES_PCCS_URL` is INERT and `TeeNarratorEnv::from_env` refuses outright
# — i.e. `DREGG_NARRATOR=chutes-tee` cannot be brought up on the edge at all.
#
# What it costs, both halves, so the trade is visible where it is made:
#
#   * TRUST: nothing. The verify path makes an outbound fetch, but collateral is Intel-signed and
#     the chain is re-rooted at this crate's own pinned Intel SGX Root CA, so a hostile or wrong
#     PCCS can only DENY service (refused attestation → free tier), never manufacture an
#     acceptance.
#   * SUPPLY CHAIN: real. It turns on dcap-qvl's `report` feature, which pulls a SECOND reqwest
#     major (0.13) and its default stack — hickory-resolver, moka, rustls-platform-verifier — into
#     this binary. That is the price of not pinning collateral by hand.
#
# The alternative, if that price is judged too high: drop `features` here and give the edge a
# `CHUTES_COLLATERAL_JSON` file instead, accepting that it must be refreshed before it expires and
# that it only covers the platform it was fetched for.
#
# `dregg-chutes-e2ee`'s own default stays off, so its offline tests and every other consumer are
# unaffected — this is one binary's deployment choice, declared where it is made.
dregg-chutes-e2ee = { path = "../dregg-chutes-e2ee", features = ["collateral-fetch"] }
# ⚑ THE VERIFIED DISTRIBUTED GATES — `register_distributed_gates()`, the ONE call that installs the
# Lean-backed implementation into the four FFI-free coordination seams (coord / captp / federation /
# intent). This bot DRIVES all four: `/market` and the Dark Bazaar settle through
# `dregg_intent::verified_settle`, `/coordinate` folds a pair round through `dregg-coord`, and
# `/handoff` redeems a CapTP certificate through `dregg_captp`'s handoff §6. The twin-deletion sweep
# (`e3f0e7b92`) made the verified export the AUTHORITY on those paths and deleted the Rust fold, so
# an unregistered seam is not a skipped cross-check — it REFUSES. Measured at HEAD 2026-07-29: six
# of this crate's tests died on it, and the market's own error text has named the fix since
# `078d68914` ("no verified executor gate is installed, so the award was NEVER JUDGED").
#
# `dregg-exec-lean` is ALREADY compiled and linked into this binary — `dregg-sdk` depends on it
# unconditionally on every native target — so naming it here adds ZERO compilation. It makes an
# already-present capability reachable, exactly as `dreggnet-web/Cargo.toml` says of the same dep.
dregg-exec-lean = { path = "../exec-lean" }
# `distributed_exports_available` (the startup announcement) and `demand_lean` (so `tests/support`'s
# ONE gate installer PANICS on an archive that cannot decide, rather than returning and letting a
# test print `ok` about a settlement nothing judged). Already compiled into this binary via
# `dregg-exec-lean` → `dregg-lean-ffi`; named here for the two functions.
#
# ⚠ THIS IS NOT THE PQ POSTURE CHANGE `.cargo/config.toml` DESCRIBES. That note says the verified
# ML-DSA core is reached by adding this dep AND calling `dregg_pq::install_lean_sign_core(..)`. Only
# the dep is here; nothing calls that installer, so `DREGG_ALLOW_UNAUDITED_PQ=1` and the bot's
# non-TCB signing posture are exactly as they were.
dregg-lean-ffi = { path = "../dregg-lean-ffi" }

[dev-dependencies]
# The shared, viewer-blind Bazaar receipt CONTRACT FIXTURES. `dreggnet-market` is a
# normal `[dependencies]` entry above; naming it again here with `contract-fixtures`
# turns on its crate-authored `contract_fixtures::{sample_pending_receipt,
# sample_settled_receipt}` ONLY for this bot's own tests (resolver "2" does not leak
# a dev-dependency feature into the shipped binary). The surface-contract test renders
# a REAL authenticated receipt instead of the removed public constructor / mutable
# fields — no receipt is fabricated from external dummy bytes.
dreggnet-market = { path = "../dreggnet-market", features = ["contract-fixtures"] }
# `ServiceExt::oneshot` drives the admin webportal router in tests without
# binding a socket (already in the lockfile transitively via tower-http).
tower = { version = "0.5", features = ["util"] }
# The verifiable-randomness / beacon engine — the daily-reveal cron test builds a SECOND verified
# beacon (an offline `HashChainBeacon` that passes `verify_beacon_round`) to drive the "a new day
# rolls a new dungeon" case deterministically without a network. Already in the closure via
# procgen-dregg; named directly for the test's `dregg_dice::HashChainBeacon`.
dregg-dice = { path = "../dice" }
# `verify_history_bytes` — the crown's restart test reads the in-tree REAL folded whole-history
# proof and asks the light client for its attested anchors, so the persisted `StoredCrownFold`
# under test is built exactly as `persist_fold` builds one at rank time (never hand-typed roots).
# Already in the closure via `dreggnet-game-board`; named here for the function.
dregg-lightclient = { path = "../lightclient" }
# A self-cleaning temp dir for the sqlite-CreditStore persistence-across-restart test
# and the per-run narrator budget-ledger files (no /tmp litter). Already in the root lock
# (narrator dev-deps it); named here for the standalone bot workspace.
tempfile = "3"

[lints]
workspace = true
