description = "Discord bot for the dregg devnet — custodial AppCipherclerk handles, gallery, identity, presence attestation, CapTP, queues, governance, names"

[features]
default = []
# Opt-in private/proven Bazaar raid. The binary still requires the complete
# deployment-owned DREGG_PRIVATE_BAZAAR_* record and refuses partial config.
