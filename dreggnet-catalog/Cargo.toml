# `dreggnet-catalog` — THE one statement of what the DreggNet offering catalog IS.
#
# The registrar every frontend builds its `OfferingHost` from, replacing the four
# hand-maintained copies of the offering registration list (web `catalog_default_host`
# + `register_non_game_offerings`, `telegram_default_host`, `wechat_default_host`, and
# Discord's bespoke per-type stores). See docs/BOT-SHARED-BACKEND-DESIGN.md.
#
# Sits at the TOP of the offering layer and BELOW every frontend: it depends on the
# offering crates (which all dep `dreggnet-offerings` for the trait), and nothing in it
# depends on a frontend — so `dreggnet-web`/`dreggnet-telegram`/`dreggnet-wechat`
# (root workspace) and `discord-bot` (standalone workspace, path-dep) can all consume it
# with no cycle.
#
# A root-workspace MEMBER (in `members`, not `default-members` — same placement as the
# frontends that consume it). Build/test:
#   cargo test -p dreggnet-catalog

[package]
name = "dreggnet-catalog"
version = "0.1.0"
edition = "2024"
description = "The shared DreggNet offering-catalog registrar: build_full_catalog(host, cfg) registers the ONE 23-offering portfolio (9 games, 9 RPG feature surfaces, 5 service offerings) every frontend (web, Telegram, WeChat, Discord) exposes, plus the single SeatedTug seat-claiming adapter — replacing four drifting per-frontend copies."

[features]
default = []
# Opt-in hosted journey for the private/proven Dark Bazaar -> exact game
# consequence.  The deployment must supply pinned roster/reward/executor policy
# and a durable authority directory; the ordinary catalog has no synthetic
# defaults for either.
private-bazaar-live = [
    "dreggnet-market/private-clearing",
    "dep:dungeon-on-dregg",
    "dep:spween-dregg",
    "dep:dregg-turn",
    "dep:dregg-types",
    "dep:zeroize",
]
# Typed hard-tech weld: a full BFV/HidingFRI/native-PQ Dark Bazaar authority
# may authorize one exact signed private-raid mechanic through the bound common
# game spine. Ordinary catalogs do not pull either proving tower.
private-fhegg-game-consequence = [
    "dreggnet-market/private-attested-clearing",
    "dreggnet-market/fhegg-settlement",
    "dreggnet-offerings/private-raid-operation",
    "dep:dungeon-on-dregg",
    "dep:dregg-persist",
]

[dependencies]
# The Offering trait + OfferingHost — the frontend-agnostic core this crate populates.
dreggnet-offerings = { path = "../dreggnet-offerings" }
# Exact Mender-choice vocabulary for the private-fhEgg consequence gate. The
# feature also enables the offering's independently verified raid assignment.
dungeon-on-dregg = { path = "../dungeon-on-dregg", optional = true }
spween-dregg = { path = "../spween-dregg", optional = true }
dregg-turn = { path = "../turn", optional = true }
# Persist-minted authority for the finalized faithful-note spend consumed by
# the shielded-crown mechanic.  The type has private fields and is returned only
# after the note/nullifier/receipt/root transaction is durable.
dregg-persist = { path = "../persist", optional = true }
blake3 = "1"
getrandom = { workspace = true }
# THE DAY BINDING. `CatalogConfig::live` registers the Descent against the CURRENT verified
# drand day (`DailyBeacon::seed` — BLS pairing first, so a forged reveal yields no day), so a
# live run's banked-relic provenance root is unpredictable-until-revealed. Already in-graph via
# `dreggnet-offerings` (its `native_descent` takes the same `CommittedSeed`) — no new compilation.
procgen-dregg = { path = "../procgen-dregg" }
zeroize = { workspace = true, optional = true }

# The eight portfolio games.
dreggnet-council = { path = "../dreggnet-council" }
dreggnet-market = { path = "../dreggnet-market" }
dregg-types = { path = "../types", optional = true }
dregg-automatafl = { path = "../dregg-automatafl" }
# `dregg-multiway-tug` names its seats by fixed canonical strings; the ONE `seated::SeatedTug`
# adapter here (collapsing the web/telegram/wechat/discord byte-peers) claims seats for
# derived identities. The dungeon offering ships inside `dreggnet-offerings` itself.
dregg-multiway-tug = { path = "../dregg-multiway-tug" }

# The nine do-once RPG feature surfaces (trade · inventory · cheevos · guild · craft ·
# companion · quest · tavern · party) — registered via the already-shared
# `dreggnet_surfaces::register_surfaces`, which mounts ONE SharedWorld across
# trade/inventory/craft (the composition Discord's per-type stores currently sever).
dreggnet-surfaces = { path = "../dreggnet-surfaces", features = ["private-raid"] }

# The five non-game service offerings.
dreggnet-doc = { path = "../dreggnet-doc" }
dreggnet-names = { path = "../dreggnet-names" }
dreggnet-compute = { path = "../dreggnet-compute" }
dreggnet-grain = { path = "../dreggnet-grain" }
dreggnet-hermes = { path = "../dreggnet-hermes" }

[dev-dependencies]
deos-view = { path = "../deos-view", default-features = false }
dregg-app-framework = { path = "../app-framework", default-features = false }
# THE SINGLE FFI BOUNDARY. A native node installs the verified Lean gate at
# startup (`register_distributed_gates()`); without it `dregg-intent`'s ring
# settlement FAILS CLOSED, so the private Bazaar's proof-authorized SETTLE can
# never land. `tests/private_bazaar_production_relation.rs` installs the REAL
# gate the same way a node does, so the production relation is exercised against
# the verified executor rather than against a stub.
#
# DEV-ONLY on purpose: the catalog itself must stay FFI-free for the frontend and
# wasm targets that consume it, which is exactly why the SHIPPED binaries — not
# this crate — are the ones that must install the gate. See the residual noted in
# that test's module docs.
dregg-exec-lean = { path = "../exec-lean" }
tempfile = { workspace = true }
# `tests/live_descent_day.rs` drives the live day binding against the SAME roots the Descent
# derives (`day_seed_from_deploy_seed`) and the SAME published reveal a surface would serve.
dungeon-on-dregg = { path = "../dungeon-on-dregg" }
hex = "0.4"

[lints]
workspace = true
