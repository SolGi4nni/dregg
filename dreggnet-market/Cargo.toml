[package]
name = "dreggnet-market"
version = "0.1.0"
edition = "2024"
description = "DreggNet offering #commerce — a sealed-bid AUCTION/MARKET (list → sealed bid → settle) as a `dreggnet_offerings::Offering`. Proves the Offering abstraction reaches an ECONOMIC flow (value moves), beyond the game/agent/grain/governance offerings. Wraps the REAL sealed-auction substrate (`starbridge-sealed-auction`): a listing is a factory-born auction cell (a real verified birth turn); a bid is a sealed commit-reveal (`WriteOnce` commit board — a double-bid is a real executor refusal; a bid after the commit phase closes is refused); a settle reveals + clears to the winning sealed bid, and the value moves through the VERIFIED per-asset ring settlement (`dregg_intent::verified_settle::settle_ring_verified`, per-asset Σδ=0). The executor is the sole referee — a below-reserve / no-valid-bid auction does NOT settle."

[features]
default = []
# Crate-authored, viewer-blind CONTRACT FIXTURES for cross-crate surface tests.
# Exposes `private_bazaar_journey::contract_fixtures::{sample_pending_receipt,
# sample_settled_receipt}` — real authenticated `PrivateBazaarPublicReceipt`s
# built from THIS crate's private constructors (never fabricated from external
# dummy bytes). Adds no dependencies; it only un-gates the in-crate `pending`/
# `settled` builders that are otherwise `cfg(test)`/`private-clearing`-only, so a
# surface adapter (e.g. the Discord bot) can render the shared receipt contract
# without the removed public constructor or mutable fields. Kept opt-in so the
# ordinary API surface does not carry the fixtures.
contract-fixtures = []
# Heavy proof surface: exposes `certified_clearing` and its real fhEgg Cert-F
# batch-STARK prover.  Kept opt-in so ordinary market/game clients do not pull the
# recursion/prover tower merely to list, bid, render, or settle.
certified-clearing = ["dep:dregg-circuit-prove", "dep:fhegg-solver"]
# Fixed N=4,K=4 private-book relation: a Plonky3 HidingFriPcs proof gates the
# existing executor-backed SETTLE path.  Kept separate from `certified-clearing`
# because it consumes neither the public Cert-F program nor fhegg-solver.
private-clearing = ["dep:dregg-circuit-prove", "dep:dungeon-on-dregg"]
# One canonical receipt must pass both the fixed private-book HidingFRI proof
# and the exact authenticated roster quorum. This composes the two existing
# opt-in towers without pulling the public Cert-F book.
private-attested-clearing = [
    "private-clearing",
    "dep:fhegg-fhe",
    "fhegg-fhe/amm-input-binding",
    "dep:ed25519-dalek",
]
# Authenticated Dark Bazaar receipt: co-endorse the complete certified settlement
# and ciphertext digests in fhegg-fhe's canonical claim, under a selected quorum.
# The feature does not prove the ciphertexts open to the certified order book.
# This remains opt-in so the ordinary market does not pull the FHE/runtime stack.
authenticated-clearing = ["certified-clearing", "dep:fhegg-fhe"]
# Direct authenticated fhEgg output gate for the real executor-backed Dark
# Bazaar settlement. Unlike `authenticated-clearing`, this does not require the
# public Cert-F book: it consumes the no-single-viewer pipeline's independently
# reconstructed canonical context and fully verified quorum receipt.
fhegg-settlement = ["dep:fhegg-fhe", "dep:ed25519-dalek"]
# THE PLAYABLE DARK POOL. Deliberately much lighter than `dark-amm-game`: it
# consumes only fhegg-fhe's DEFAULT surface (threshold BFV + the wrap-guarded
# multiply engine + the dark-AMM invariant), never the HidingFri/Tier-1
# proof tower, so mounting a pool costs a BFV key ceremony and not a prover.
dark-pool-offering = [
    "dep:fhegg-fhe",
    "dep:fhe",
    "dep:fhe-traits",
    "dep:rand_09",
]
# THE ORACLE PIT — a confidential prediction market whose subject is the daily
# Descent. Positions ride BFV ciphertexts under an n-of-n collective key
# (`fhegg-fhe/threshold`), the line is the quadratic cost function's marginal
# prices opened by full quorum, and settlement is the run record's EXACT
# re-execution through `dreggnet_offerings::native_descent` (already a
# non-optional dependency). Opt-in so the ordinary market does not pull the FHE
# stack merely to list, bid, or settle an auction.
oracle-pit = ["dep:fhegg-fhe", "dep:fhe", "dep:fhe-traits", "dep:rand_09"]
# Executable game-facing encrypted-amount constant-product table. Kept
# independent of `fhegg-settlement`: both use the generic hosted operation seam,
# while this feature pays only for its own BFV producer/verifier boundary.
dark-amm-game = [
    "dep:dregg-circuit-prove",
    "dep:fhegg-fhe",
    "fhegg-fhe/amm-input-binding",
    "dep:fhe",
    "dep:fhe-traits",
    "dep:rand_09",
    "dep:ed25519-dalek",
    "dep:rand",
]

[[bin]]
name = "dark-amm-tool"
path = "src/bin/dark-amm-tool.rs"
required-features = ["dark-amm-game"]

[[test]]
name = "oracle_pit_descent_market"
path = "tests/oracle_pit_descent_market.rs"
required-features = ["oracle-pit"]

[[test]]
name = "dark_pool_offering"
path = "tests/dark_pool_offering.rs"
required-features = ["dark-pool-offering"]

[[test]]
name = "private_bfv_attested_clearing"
path = "tests/private_bfv_attested_clearing.rs"
required-features = ["private-attested-clearing"]

[[test]]
name = "private_clearing_apex_e2e"
path = "tests/private_clearing_apex_e2e.rs"
required-features = ["private-attested-clearing", "fhegg-settlement"]

[[test]]
name = "private_clearing_crown_consequence"
path = "tests/private_clearing_crown_consequence.rs"
required-features = ["private-clearing"]

[[test]]
name = "private_clearing_guild_allocation"
path = "tests/private_clearing_guild_allocation.rs"
required-features = ["private-clearing"]

[[test]]
name = "private_bazaar_playable_journey"
path = "tests/private_bazaar_playable_journey.rs"
required-features = ["private-clearing"]

[dependencies]
# THE OFFERING CORE — the frontend-agnostic `Offering` trait (open/actions/advance/
# verify/render/price), `Action`/`Outcome`/`Surface`/`DreggIdentity`/`TurnReceipt`.
# A `MarketOffering` is one more instance of the SAME abstraction the dungeon/council use.
dreggnet-offerings = { path = "../dreggnet-offerings" }
# THE COMMERCE SUBSTRATE — the sealed-bid auction: the in-process `Auction` commit/reveal/
# settle state machine (its `settle` folds the award ring through the VERIFIED executor,
# conservation-checked), `Bid`/`Seal`, and the on-ledger auction cell (the factory descriptor
# whose `WriteOnce` commit board + `StrictMonotonic(PHASE)` lifecycle the executor re-enforces
# every touching turn) with its `*_effects` turn builders. Consumed, NOT re-implemented.
starbridge-sealed-auction = { path = "../starbridge-apps/sealed-auction" }
# THE VERIFIED VALUE MOVE — `VerifiedLedger`/`VerifiedLeg`/`settle_ring_verified`: the conserved
# per-asset ring settlement (the Rust image of the Lean `Ring.settleRing`, per-asset Σδ=0) the
# auction clears the winning trade through. This is where the money actually moves.
dregg-intent = { path = "../intent" }
# THE OWNED-ASSET SETTLEMENT WELD — after the sealed auction fixes its real winner,
# cross an existing provenance-carrying AssetId (including a Descent loot note) for
# the winning amount of $DREGG through the sealed-escrow atomic-swap substrate.
# This is deliberately additive to the verified auction ring: the auction determines
# the winner/price; dreggnet-trade enforces owner-gated custody + atomic asset/value cross.
dreggnet-trade = { path = "../dreggnet-trade" }
# The executor seam — `AppCipherclerk`/`AgentCipherclerk`/`EmbeddedExecutor` (the real embedded
# verified executor a turn is refereed by), `TurnReceipt`, `Effect`, `field_from_u64`, and the
# factory-birth path (`create_from_factory` + `FactoryCreationParams`). `default-features = false`
# takes the executor/turn core (no gpui), matching dreggnet-offerings.
dregg-app-framework = { path = "../app-framework", default-features = false }
dregg-turn = { path = "../turn" }
# `FactoryCreationParams` / `CellState` / `CellMode` — the factory-birth parameters and the live
# cell state the phase precondition reads. `default-features = false` matches the substrate crate.
dregg-cell = { path = "../cell", default-features = false }
# `CellId` — the born auction cell's id (derived from owner+token, the listing's on-ledger handle).
dregg-types = { path = "../types" }
# The deos affordance view-tree an offering's `render` produces (`Section`/`Menu`/`Text`) — the
# SAME surface model dreggnet-offerings re-exports; used to paint the listing + bids as affordances.
deos-view = { path = "../deos-view", default-features = false }
# Deterministic bidder-handle + nonce derivation (a `DreggIdentity` → a stable auction `CellId`
# handle; a sealed bid's blinding nonce) — the same hash the substrate seals bids with.
blake3 = "1"
# OS entropy for custody roots that must not be a function of anything a caller passes —
# `DarkPoolOffering::mount` draws the n-of-n committee's root from here, not from a `u64` seed.
getrandom = { workspace = true }
# The opt-in Dark Bazaar receipt path.  `dregg-circuit-prove` mints the hiding
# Cert-F batch STARK; `fhegg-solver` supplies the deterministic clearing wire.
dregg-circuit-prove = { path = "../circuit-prove", optional = true }
dungeon-on-dregg = { path = "../dungeon-on-dregg", optional = true }
fhegg-solver = { path = "../fhegg-solver", optional = true }
fhegg-fhe = { path = "../fhegg-fhe", optional = true }
fhe = { version = "0.1.1", optional = true }
fhe-traits = { version = "0.1.1", optional = true }
rand_09 = { package = "rand", version = "0.9", optional = true }
rand = { version = "0.8", optional = true }
ed25519-dalek = { version = "2", features = ["std"], optional = true }

[dev-dependencies]
rand = "0.8"
tempfile = { workspace = true }
# THE VERIFIED SETTLEMENT GATE, for the TEST process only. `dreggnet-market` settles through
# `dregg_intent::verified_settle::settle_ring_verified`, which is FAIL-CLOSED without a registered
# `IntentVerifiedGate` — an unregistered gate refuses an honest award rather than falling back. The
# market crate itself stays FFI-free (a host installs the gate: `dreggnet_web::
# install_verified_settlement_gate`, `node/src/lib.rs`), so this edge is dev-only and
# `tests/support/mod.rs` is the ONE place a market test process installs it.
dregg-exec-lean = { path = "../exec-lean" }
dregg-lean-ffi = { path = "../dregg-lean-ffi" }
dregg-sdk = { path = "../sdk" }
procgen-dregg = { path = "../procgen-dregg" }
# Full-apex game consequence: the market's strict private proof result is
# consumed through the incarnation-bound common game spine. Dev-only avoids a
# production cycle (the catalog already registers the market).
dreggnet-catalog = { path = "../dreggnet-catalog", features = ["private-fhegg-game-consequence"] }

[lints]
workspace = true
