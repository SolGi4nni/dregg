[package]
name = "dregg-intent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Distributed intent engine for privacy-preserving capability discovery and matching"

[dependencies]
blake3 = "1"
chacha20poly1305 = { workspace = true }
curve25519-dalek = { version = "4", features = ["alloc"] }
getrandom = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
dregg-cell = { path = "../cell" }
dregg-cell-crypto = { path = "../cell-crypto" }
dregg-circuit = { path = "../circuit" }
dregg-bridge = { path = "../bridge" }
dregg-commit = { path = "../commit" }
dregg-dfa = { path = "../dfa" }
dregg-federation = { path = "../federation", default-features = false }  # pure threshold_decrypt; no tokio
dregg-trace = { path = "../trace" }
dregg-turn = { path = "../turn" }
dregg-token = { path = "../token", default-features = false, features = ["macaroon", "rand-deps"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
globset = { workspace = true }
x25519-dalek = { workspace = true }
# FFI-FREE BY CONSTRUCTION: LIVE ring settlement routes the per-leg verified-executor decision
# through the `verified_gate` SEAM (`IntentVerifiedGate`), never `dregg-lean-ffi` directly. A native
# node installs the Lean-backed gate (from `dregg-exec-lean`) once at startup. The
# deleted `no-lean-link` feature is now a dependency choice, not a flag.
#
# ⚠ An UNREGISTERED gate is a REFUSAL, not a skipped cross-check. This comment read "…never
# registers one and the cross-check is skipped (the in-process verified transition stands)" until
# 2026-07-29 — true until `e3f0e7b92` INVERTED the polarity (the Lean export is now the authority
# per leg and the Rust fold is the cross-checked differential). Since that commit an FFI-free
# target REFUSES a non-empty ring outright (`VerifiedSettleError::FfiUnavailable`). The stale
# reading is what let two of `tests/drex_routing_e2e.rs`'s tests sit red for five days looking
# like a matcher bug; see the `[dev-dependencies]` note on `dregg-exec-lean`.

[features]
default = []

[dev-dependencies]
# Arm the `StubVerifier` accept path for plumbing tests only. The feature is
# fail-closed in production builds; enabling it here scopes the permissive stub
# behavior to `cargo test`/dev builds of this crate.
# `test-stubs-release-test-target` gates no code — it attests to `cell`'s
# `compile_error!` that this is a TEST target, which is what makes
# `cargo test --release -p dregg-intent` compile at all. `[dev-dependencies]`
# ONLY; see the note on the feature in `cell/Cargo.toml`.
dregg-cell = { path = "../cell", features = [
    "test-stubs",
    "test-stubs-release-test-target",
] }
# The `drex_routing` end-to-end test exercises the REAL mirror mint accounting
# (`mint_against_lock` + the `live_supply ≤ currently_locked` invariant), which
# is `test-utils`-gated on the bridge. This activates it for `cargo test` builds
# ONLY (dev-dep features never reach the normal lib build).
dregg-bridge = { path = "../bridge", features = ["test-utils"] }
# The lock-attestation SIGNING helper (`SolanaLockAttestation::create`) the test
# uses to build the ring's locks needs an Ed25519 signing key.
ed25519-dalek = { version = "2", features = ["std"] }
# THE VERIFIED EXECUTOR GATE, for the test binaries that SETTLE A RING.
# `settle_ring_verified` fails closed with no `IntentVerifiedGate` registered, so a test that
# drives `drex_routing::route` (or `trustless::finalize_verified`) must install the REAL Lean-backed
# gate exactly as `node/src/lib.rs` and `exec-lean/src/bin/drex_clear.rs` do at startup — otherwise
# the ring is NEVER JUDGED and the refusal reads like a matcher/fixture bug. This is a
# DEV-DEPENDENCY CYCLE (`dregg-exec-lean` depends on `dregg-intent`); cargo permits cycles through
# dev-dependencies, and it is the only way to reach the real export from this crate's own tests
# without re-implementing the gate in Rust (which would be a twin, and forbidden).
# ⚠ Linking it does NOT register it: `tests/settle_fail_closed.rs` deliberately never calls
# `register_distributed_gates()` and so still proves the no-gate refusal.
dregg-exec-lean = { path = "../exec-lean" }

[lints]
workspace = true
