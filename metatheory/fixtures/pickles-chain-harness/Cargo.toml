# pickles-chain-harness — CHAIN the Lean-assembled STEP circuit into the Lean-assembled WRAP one.
#
# ⚑ WHAT IS NEW HERE. `pickles-stepmain-harness` proves a Vesta/Fp circuit and
# `pickles-wrapmain-harness` proves a Pallas/Fq one, and NOTHING has ever fed one into the other:
# the wrap transcript's absorbed words were `PastaPoseidonFq`'s fixture — the commitments of a
# `create_circuit(0,5)` proof exported from a third-party checkout, not of dregg's own step proof.
#
# THE CROSSING, at source. `wrap_main_inputs.ml:4` sets `Me = Tock`, so the wrap circuit's native
# field is `Tock.Field = Fq` and it commits on Pallas. A STEP proof is a Tick object: committed on
# **Vesta**, whose SCALAR field is Fp (the step circuit's native field) and whose BASE field is
# **Fq**. So a step proof's commitments are Vesta points with **Fq** coordinates — the wrap
# circuit's OWN field — and `wrap_main_inputs.ml:104-105` makes that explicit by setting
# `Inner_curve.C = Kimchi_pasta.Pasta.Vesta`. The commitments cross for FREE.
#
# What does NOT cross for free is the step proof's SCALAR data (evaluations, `ft_eval1`, `z_1`,
# `z_2`): those are Fp, and `impls.ml:51` records why the two directions are asymmetric —
# `(* Tick.Field.t = p < q = Tock.Field.t *)`. In the WRAP circuit an Fp value is ONE Fq wire
# (`impls.ml:167-217`, `type t = Field.t`); in the STEP circuit an Fq value needs TWO
# (`impls.ml:50-103`, `type t = Field.t * Boolean.var`, "Low bits, high bit"). None of that scalar
# data is on the phase-1 tape, which is why the transcript chain is the piece that lands first.
#
# ONE BINARY:
#   harness           proves the wrap circuit whose transcript is driven by the step proof's own
#                     tape, on Pallas/Fq, with the five polarities.
#
# ⚑ `export-step-tape` IS GONE (2026-08-05). It proved a SECOND step proof — over kimchi's TEST SRS
# and with `OsRng`, so it was not reproducible — and wrote `KimchiStepWrapChainFixture` about it,
# while the forty public words came from `pickles_kimchi_marshal`'s step proof and the wrap
# transcript absorbed a THIRD proof's commitments. Three proofs, one pipeline, every shape equal.
# The tape is now written by `pickles-extractors/src/tape.rs` from the SAME `prove_step` return
# value the forty come from; that crate is the one with `ledger`, so it is the one that can use
# Mina's own SRS. This crate keeps the wrap-side prover and nothing else.
[package]
name = "pickles-chain-harness"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
kimchi = { git = "https://github.com/o1-labs/proof-systems", tag = "0.3.0" }
mina-curves = { git = "https://github.com/o1-labs/proof-systems", tag = "0.3.0" }
mina-poseidon = { git = "https://github.com/o1-labs/proof-systems", tag = "0.3.0" }
poly-commitment = { git = "https://github.com/o1-labs/proof-systems", tag = "0.3.0" }
o1-utils = { git = "https://github.com/o1-labs/proof-systems", tag = "0.3.0" }
groupmap = { git = "https://github.com/o1-labs/proof-systems", tag = "0.3.0" }

ark-ec = "0.5.0"
ark-ff = { version = "0.5.0", features = ["parallel", "asm", "std"] }
ark-poly = "0.5.0"
num-bigint = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

# Mirror mina-rust's workspace patches (openmina on-stack num forks).
[patch.crates-io]
num-bigint = { git = "https://github.com/openmina/num-bigint", branch = "rebase-onstack" }
num-rational = { git = "https://github.com/openmina/num-rational", branch = "rebase-onstack" }
