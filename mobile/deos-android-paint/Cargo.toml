# deos-android-paint — graphideOS step 2: a gpui app painting a real deos frame
# on android, packaged as an APK (cargo-apk). It is a STANDALONE package (its own
# [workspace]) so it does not pull the breadstuffs workspace; it depends on the
# emberian/zed gpui fork, which carries the new gpui_android PlatformAndroid
# backend, at the SAME git rev `deos-zed` and `deos-zed-full` already pin.
#
# ⚠ Until 2026-07-28 those three deps were `path = "../../../emberian-zed/…"` —
# a checkout OUTSIDE this repo, resolvable on exactly one machine. This package
# therefore did not build from a clean checkout of itself for anyone, and nothing
# said so: it is its own workspace, so no repo-wide build ever touched it. Found by
# `scripts/check-workspace-closure.py --rev HEAD`, whose extract of HEAD resolved
# `../../../emberian-zed` to a directory beside the temp dir and failed. The local
# checkout was at `adb9026524`, clean and pushed to `origin/android-on-pinned`, and
# `crates/gpui_android` exists at that rev — so the git-pinned form every sibling
# uses is byte-for-byte the same code, and is what this now says.
[package]
name = "deos-android-paint"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: do not be absorbed into a parent workspace.
[workspace]

[lib]
# An android app is a shared object loaded by the runtime; `android_main` is the
# entrypoint (the `android-activity` macro generates the JNI glue).
crate-type = ["cdylib"]

[dependencies]
# The gpui fork carrying the new android backend. Same rev as deos-zed/deos-zed-full.
gpui = { git = "https://github.com/emberian/zed", rev = "adb9026524" }
gpui_platform = { git = "https://github.com/emberian/zed", rev = "adb9026524" }
gpui_android = { git = "https://github.com/emberian/zed", rev = "adb9026524" }
android-activity = { version = "0.6", features = ["native-activity"] }
log = "0.4"
android_logger = "0.14"

# cargo-apk metadata: the APK manifest. NativeActivity (no Java/gradle needed).
[package.metadata.android]
package = "software.ember.deos.paint"
build_targets = ["aarch64-linux-android"]
apk_name = "deos-android-paint"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[package.metadata.android.application]
label = "deos paint"
# Fullscreen so the deos frame owns the whole display.
theme = "@android:style/Theme.NoTitleBar.Fullscreen"

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = true
version = 0
