[package]
name = "dataplane"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Native host that drives the leanc-compiled proven serve over a real TCP socket: it owns the socket and accept loop and calls the exported drorb_serve for every request."
publish = false

[dependencies]
# Real, battle-tested DEFLATE (miniz_oxide pure-Rust backend) for the reactor gzip
# seam (`src/gzip.rs`). TRUSTED, not verified — principled TCB, like the crypto FFI:
# it replaces the proven-but-uncompressing stored-block gzip stage with genuine
# compression. Additive; gated behind DRORB_RUST_GZIP=1.
flate2 = "1"
# Window-parameterized raw DEFLATE (pure-Rust `zlib-rs`) for the RFC 7692
# WebSocket server->client compressor ONLY (`src/ws_assembly.rs`): unlike the
# miniz_oxide `flate2` backend (fixed 15-bit window) it honors a negotiated
# `server_max_window_bits < 15`. Isolated from the `flate2` gzip seam; TRUSTED,
# not verified — the same principled-TCB posture as `flate2`.
zlib-rs = "0.6"
# dregg post-quantum leaf: ML-DSA-65 (FIPS 204) verify for the JWT hybrid
# (Jwt.Alg.hybrid). Path dep into the sibling breadstuffs tree (both on hbox);
# dregg_pq::ml_dsa_verify is the fail-closed FIPS-204 verify the dregg
# federation core uses. From the breadstuffs/orb cut this is ../../../dregg-pq.
dregg-pq = { path = "../../../dregg-pq" }
# The leanc-compiled VERIFIED crypto cores (ML-DSA-65 verify + ML-KEM-768
# encaps/decaps), exported from the Lean sources proven in the metatheory tree
# (verifyCore_unfolds_to_def / extractedApi_correct). A REAL (non-dev) dependency: the
# deployed binary must LINK the archive that exports dregg_fips204_verify_real /
# dregg_fips203_{encaps,decaps} and CALL the installs at startup (see main.rs),
# else dregg-pq silently keeps its unverified crate fallbacks in the verify TCB.
# Shared Lean runtime: this host already links libleanshared for the proven
# serve, so the archive must NOT drag in a second, static runtime copy — the
# DREGG_LEAN_LINK=shared mode selects the same libleanshared.
dregg-lean-ffi = { path = "../../../dregg-lean-ffi" }

[[bin]]
name = "dataplane"
path = "src/main.rs"

# The io_uring IO path is Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
libc = "0.2"

# The kqueue completion-queue reactor is the preferred IO path on macOS/BSD; it
# needs libc for kqueue/kevent, SO_REUSEPORT, and the raw socket syscalls. The
# portable blocking thread-per-connection fallback still needs no dependency.
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
libc = "0.2"

[dev-dependencies]
# Classical Ed25519 half of the hybrid, for the my-hand test (src/pq.rs).
ed25519-dalek = "2"
# Classical X25519 half + HKDF-SHA256 concat-KDF combiner for the X-Wing my-hand test.
x25519-dalek = "2"
hkdf = "0.12"
sha2 = "0.10"
