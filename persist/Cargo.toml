[package]
name = "dregg-persist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "The node's one durable store: commit log, checkpoints, blocklace, forever digests"

[dependencies]
redb = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
tracing = { workspace = true }
dregg-types = { path = "../types" }
dregg-commit = { path = "../commit" }
dregg-cell = { path = "../cell" }
dregg-circuit = { path = "../circuit" }
dregg-turn = { path = "../turn" }
dregg-blocklace = { path = "../blocklace" }
dregg-federation = { path = "../federation" }

[dev-dependencies]
tempfile = "3"
# TEST-ONLY: installs the Lean-verified ML-DSA cores so this crate's test binaries can run a PQ
# operation at all. `verify_hybrid` / `verify_finalization_quorum` check an enrolled ML-DSA half
# and the commit-log fixtures derive one, both through `dregg-pq`, which refuses an uninstalled
# core with `process::abort()` — the lib-test binary died on it as a bare SIGABRT. This crate
# cannot link the archive from `[dependencies]`. See `dregg-pq-testkit`'s crate docs.
dregg-pq-testkit = { path = "../dregg-pq-testkit" }

[lib]
name = "dregg_persist"
crate-type = ["rlib"]

[lints]
workspace = true
