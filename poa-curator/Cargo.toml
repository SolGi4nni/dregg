[package]
name = "poa-curator"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
authors = ["Dregg Contributors"]
license = "AGPL-3.0-or-later"
homepage = "https://dregg.fg-goose.online"
repository = "https://github.com/emberian/dregg"
description = "Fail-closed Path of Angels content curator over Lean-emitted POAG1 bundles"

[workspace]

[dependencies]
blake3 = "1"
dregg-lean-ffi = { path = "../dregg-lean-ffi" }
dregg-types = { path = "../types" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
