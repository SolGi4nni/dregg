[package]
name = "realm-model"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "The living-world MUD substrate model — persistent REALM / child INSTANCE, canonical IDENTITY, and the committed RULESET CATALOG, as first-class cell-backed objects. Engine-general, no game content. §9.2/§9.4/§9.5 of HOARDLIGHT-LIVING-WORLD.md."
license = "AGPL-3.0-or-later"

[dependencies]
# The REAL cell/ledger primitives — the same Ledger + Cell + CellState +
# FieldElement that node/src/mud_e2e.rs and node/src/shared_world.rs stand a
# world up on. Realm state, instance state, identity, and the catalog are all
# genuine cells on a genuine Ledger.
dregg-cell = { path = "../cell" }
# The REAL effect vocabulary — a realm turn carries `dregg_turn::action::Effect`,
# the exact type mud_e2e fires (`Effect::SetField { cell, index, value }`), so
# this model FITS that path rather than inventing a parallel one.
dregg-turn = { path = "../turn" }
dregg-types = { path = "../types" }
blake3 = "1"
# The classical half of the HYBRID-PQ identity: ed25519, derived from the SAME
# 32-byte seed as the ML-DSA-65 half (`dregg_turn::pq::MlDsaTurnKey`). Matches the
# turn/ hybrid signer perimeter exactly — a succession is signed by BOTH halves.
ed25519-dalek = { version = "2", features = ["hazmat"] }

# GRADUATED: realm-model is now a member of the root breadstuffs workspace (added
# to the root `[workspace].members` + `default-members`). It is wired into the
# running node via `dregg-node`'s `realm_service` (durable realm/instance/catalog
# on the keystone receipt/turn chain). Its path-deps (dregg-cell / dregg-turn /
# dregg-types) are root members, and the one `[patch]` the dregg-turn graph needs
# (ark-serialize's serde_with feature from emberian/algebra) is inherited from the
# root workspace, so no per-crate `[workspace]`/`[patch]` is needed here anymore.
