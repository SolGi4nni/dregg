[package]
name = "dregg-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Agent SDK and cipherclerk for the dregg federation — token management, turn execution, and proof generation"

[dependencies]
dregg-federation = { path = "../federation", default-features = false }
# hints_onboarding (a lib module) uses the HINTS threshold-BLS crate directly, so it
# must be a real dep (not only a dev-dep, which only covers the test targets).
hints = { path = "../hints", package = "dregg-hints" }
dregg-types = { path = "../types" }
dregg-cell = { path = "../cell" }
dregg-cell-crypto = { path = "../cell-crypto" }
dregg-turn = { path = "../turn" }
# The Payable DSI + the verified `pay` route core. The metered tool-gateway charge
# routes its consumer→provider payment through the SAME `dregg_payable::resolve_pay`
# desugar the app-framework `Payable::pay` uses — one verified source of truth, not
# a parallel hand-rolled `Effect::Transfer`.
dregg-payable = { path = "../dregg-payable" }
starbridge-polis = { path = "../starbridge-apps/polis" }
dregg-bridge = { path = "../bridge" }
# UNCONDITIONAL (polarity-inverted, .docs-history-noclaude/FEATURE-HYGIENE.md §Lean): THE SWAP producer-mode
# path. The verified Lean executor (via `dregg_turn::lean_apply`) and the `dregg-lean-ffi`
# runtime are compiled into every native build, so `AgentRuntime` makes the verified
# executor the authoritative state producer (runtime-gated by `DREGG_LEAN_PRODUCER`,
# archive-gated by `lean_available()`). The ONE opt-out is the `no-lean-link` platform
# feature (wasm32/zkvm — targets that cannot link libdregg_lean.a).
dregg-lean-ffi = { path = "../dregg-lean-ffi" }
# The ML-DSA-65 (FIPS 204) verify seam (a light leaf, already in the graph transitively). Direct dep so
# the SDK can call the SHARED `dregg_pq::install_verified_mldsa_verify_core` at agent-runtime startup —
# routing the wire-silo + turn/captp verifies through the Lean-verified core (taking the `fips204` crate
# out of the SDK-hosted process's verify TCB), the SAME install the node performs.
dregg-pq = { path = "../dregg-pq" }
dregg-circuit = { path = "../circuit" }
# The SDK's producer path mints rotated proofs and binds custom sub-proofs
# (`dregg_circuit_prove::custom_proof_bind`), so it depends on the heavy prove
# crate. (The SDK's light-client VERIFY path uses only `dregg-circuit` symbols.)
dregg-circuit-prove = { path = "../circuit-prove" }
dregg-commit = { path = "../commit" }
# The light-client artifact (`AttestedHistory`) — the SDK's second
# user-facing noun. Pure verifier; rides the dregg-circuit prover
# feature the SDK already carries.
dregg-lightclient = { path = "../lightclient" }
dregg-dsl-runtime = { path = "../dregg-dsl-runtime" }
dregg-dsl-tests = { path = "../dregg-dsl-tests" }
dregg-intent = { path = "../intent" }
dregg-macaroon = { workspace = true, features = ["crypto"] }
dregg-token = { path = "../token", default-features = false, features = ["macaroon", "biscuit", "rand-deps"] }
dregg-trace = { path = "../trace" }
# Experimental plaintext fhEgg wire surface (`sdk::fhegg`).  Kept behind its
# named feature even though that feature is default-on, so verifier/minimal SDK
# builds can still exclude the solver explicitly.
fhegg-solver = { path = "../fhegg-solver", optional = true }

# council_seal (the threshold-seal organ sealed_governance welds) drives the
# HINTS BLS pairing directly (G1/G2/G_T over BLS12-381), so the arkworks traits
# it calls (AffineRepr/CurveGroup/Pairing/UniformRand/CanonicalSerialize) must be
# direct deps — they are already transitively present via `hints`/`dregg-federation`;
# pinned to the same 0.5.0 the federation organ uses (no version skew).
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-std = "0.5.0"
ark-serialize = { version = "0.5.0", features = ["serde_with"] }

async-trait = "0.1"
base64 = { workspace = true }
blake3 = "1"
curve25519-dalek = { version = "4", features = ["alloc"] }
ed25519-dalek = { version = "2", features = ["std"] }
getrandom = { workspace = true }
hex = "0.4"
hmac = { workspace = true }
pbkdf2 = "0.12"
postcard = { version = "1", features = ["use-std"] }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
zeroize = { workspace = true }

# ─── THE VERIFIED DEPLOYED EXECUTOR: A TARGET, NOT A FEATURE ────────────────────────────
# THE SWAP producer-mode cluster (`produce_via_lean` = the authoritative verified-Lean state
# producer) and the two deployed-executor ORACLES `AgentRuntime::new` arms (the constraint
# oracle and the conservation oracle, `runtime.rs`).
#
# ⚑ THIS WAS `dregg-exec-lean = { optional = true }` BEHIND A DEFAULT-ON `exec-lean` FEATURE,
# AND THAT IS THE WORST POSSIBLE THING TO DECIDE WITH A FEATURE, because cargo UNIFIES
# features across a resolve: whether this SDK installs a verified oracle at all depended on
# WHICH OTHER PACKAGES cargo had been asked about. MEASURED with `cargo build --unit-graph`
# on the same source:
#
#   cargo build -p starbridge-v2 --all-targets   dregg-sdk = prover
#   cargo build --workspace      --all-targets   dregg-sdk = default,exec-lean,fhegg,prover
#
# Nine consumers pass `default-features = false` and were silently overruled the moment a
# whole-workspace command selected `dregg-sdk` (a root member) alongside them. `dregg-cell`'s
# fail-closed refusal is native-RELEASE-only, so the difference is invisible to every debug
# test in the tree and shows up as a deployed bot that boots, reports healthy, and refuses
# every programmed-cell turn — which is exactly what `starbridge-tussle` did for three days
# (`settle_ring_verified` is fail-closed with no `IntentVerifiedGate` registered) and what the
# Discord bot did for a week (`reveal_cron: Daily reveal did not fire`, forever).
#
# THE QUESTION IS "CAN THIS TARGET LINK libdregg_lean.a", SO ASK THE TARGET. A `[target.'cfg']`
# dependency is decided by the compilation target and CANNOT unify: every native build of this
# crate has the verified executor, under every selection, and wasm32/zkvm has none because it
# cannot have one. Cost of making it unconditional on native, measured the same way: exactly
# TWO packages (`dregg-exec-lean`, `dregg-coord`) and two units.
#
# A NATIVE host that must not link the archive (`dregg-tui`, `sel4/verifier-pd`) is still served
# by the `no-lean-link` platform feature below: `dregg-lean-ffi` compiles its marshal-only stubs
# and `dregg-exec-lean` builds clean against them (verified: `cargo check -p dregg-exec-lean
# --features dregg-lean-ffi/no-lean-link`, zero errors). Link suppression, never a guarantee.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "zkvm")))'.dependencies]
dregg-exec-lean = { path = "../exec-lean" }

[features]
# This crate is the OFFLINE CORE of the SDK. It carries NO networking surface
# (no tokio/reqwest/dregg-wire): the networked layer lives in `dregg-sdk-net`.
#
# ⚑ `prover` IS GONE, and it is not hollowed — the feature is DELETED and the rotated
# IR-v2 (R=24) producer + verifier it gated are UNCONDITIONAL. It was `prover = []`:
# forwarding nothing, pulling no dep, 106 local `#[cfg]` sites over code whose entire
# dependency closure (`dregg-circuit`, `dregg-circuit-prove`) is already unconditional
# above. MEASURED with `cargo build --unit-graph`: `-p dregg-sdk --no-default-features`
# and `--no-default-features --features prover` resolve to the SAME 490 units and the
# SAME 325 packages, differing only in this crate's own feature string. So there was
# nothing for it to prune, and turning it ON for everyone costs zero resolve — while
# leaving it OFF decided a VERIFY verdict (the welded-escrow satisfaction gate REFUSED
# every declared-escrow turn under `not(prover)`), which is exactly the
# "which guarantees does this dregg have" question .docs-history-noclaude/FEATURE-HYGIENE.md
# forbids a feature to answer.
default = ["fhegg"]
# Plaintext uniform-price clear + self-verifying settlement demo surface.
fhegg = ["dep:fhegg-solver"]
# `embed-core` IS GONE. It was kept as an explicit COMPAT NO-OP — `embed-core = []`,
# "so existing consumers keep resolving" — after the wire-free `DreggEngine` became
# unconditional in this offline core. Its only two consumers were `starbridge-v2`'s
# native and wasm32 dep lines, and both now simply do not name it. A no-op feature is
# worse than a live one: `features = ["embed-core"]` reads as a deliberate narrowing and
# is in fact nothing at all.
# PLATFORM gate, OFF by default: only wasm32/zkvm builds set it. It compiles the legacy
# Rust-producer path IN PLACE OF the verified Lean producer — a statement about the
# target's linker, never about which guarantees this dregg has. On native the producer is
# always compiled in; it stays runtime-gated by `DREGG_LEAN_PRODUCER` / `set_lean_producer`,
# and an unlinked archive self-falls-back to the Rust producer.
no-lean-link = [
    "dregg-lean-ffi/no-lean-link",
]
dev = []
# Enables `DelegationAuthority::Open`, which accepts any well-signed envelope
# without an authority check. This is a footgun in production and is gated
# behind a feature flag so that production builds cannot construct it at all.
# Only enable in tests or development binaries — never in production-facing
# crates.
unsafe-test-utils = []

[dev-dependencies]
# The wrap-adapter tie test (`full_turn_proof.rs` tests) and the custom-proof-bind
# round-trip (`tests/wide_completeness_ledger.rs`) call PROOF-PRODUCTION entry
# points — `rotation_witness::finalized_turn_from_full_turn` and
# `TurnCustomProofsExt::with_custom_program_proofs` — which live in the prover
# CRATE since PR3. Test-scoped: the sdk library itself links no turn-prover.
dregg-turn-prover = { path = "../turn-prover" }
x25519-dalek = { workspace = true }
# ⚑ NO LONGER USED BY ANY TEST IN THIS CRATE, AND THAT IS THE FIX. It was added for
# `tests/hybrid_pq_turn.rs`, which signs through a cipherclerk and then verifies through
# `dregg_turn::pq::ml_dsa_verify` without ever building an `AgentRuntime` — and so reached the
# VERIFY gate with nothing installed and died as a bare SIGABRT (measured on persvati:
# `operation: ML-DSA-65 verify`). The install was missing in PRODUCTION, not only in that binary:
# the SDK's point-of-use install armed KEYGEN and SIGN only, leaving VERIFY to an `AgentRuntime`
# constructor that a `DreggEngine` or light-client consumer never builds. A test-only initializer
# would have made the binary green and left the defect in place, so instead
# `runtime::install_verified_pq_cores` arms all six from every SDK gateway and the macro is gone
# from that file. The dev-dep is KEPT: `dregg-sdk` is the SDK, and the next test binary here whose
# subject is something other than the PQ install should reach for the testkit rather than
# rediscover this. See `dregg-pq-testkit`'s crate docs and `tests/pq_cores_without_runtime.rs`.
dregg-pq-testkit = { path = "../dregg-pq-testkit" }
# The running-binary ML-DSA verify gate (`tests/mldsa_wire_silo_verify.rs`) mints a GENUINE ML-DSA-65
# `(pk, msg, ctx, sig)` with the SAME `fips204` 0.4.x the `dregg-pq` leaf carries, then asserts the
# SDK-startup-installed Lean core is the authority behind `dregg_pq::ml_dsa_verify`.
fips204 = "0.4"
# The human-layer social-recovery e2e seam (`tests/identity_social_recovery_e2e.rs`):
# the guardian M-of-N quorum is a REAL HINTS weighted-threshold BLS aggregate
# (`hints`), assembled test-side via `dregg-federation`'s committee wrapper —
# the SAME primitive `dregg-turn`'s already-default `ThresholdSigVerifier`
# discharges. No new crypto; the test welds the green parts.
dregg-federation = { path = "../federation" }
hints = { path = "../hints", package = "dregg-hints" }
# The cipherclerk federation-membership unit tests (`prove_authorization` /
# `authorize` over the SYNTHETIC single-tenant federation root) exercise
# dregg-bridge's synthetic Merkle-path builder, gated behind bridge's `test-utils`
# feature. When dregg-bridge is a *dependency* (not the crate under test) its own
# `#[cfg(test)]` is inactive, so a consumer must opt the feature in for its test
# builds — the same idiom circuit/ and credentials/ use. Without it the synthetic
# path falls through to `Err(IssuerNotInFederation)`. Scoped to dev-deps
# (resolver 3) so production sdk builds never carry test-utils.
dregg-bridge = { path = "../bridge", features = ["test-utils"] }

