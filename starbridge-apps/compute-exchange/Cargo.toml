[package]
name = "starbridge-compute-exchange"
version = "0.1.0"
edition = "2024"
description = "Starbridge compute marketplace — a factory-born job cell that composes the organ semantics: a budget ceiling (bid <= budget), a write-once accepted-bid commitment, a one-way job lifecycle, and a settlement that PAYS the provider a real conserving Effect::Transfer in the same turn as it records the split (paid + refunded == budget). One verified cell program, enforced by the real executor every turn."

# The compute marketplace: a requester POSTS a job with a promised BUDGET; a
# provider BIDS a price (which must fit the budget); the job SETTLES — the
# accepted price is PAID to the provider by a conserving Effect::Transfer in the
# SAME TURN as the STATE=SETTLED advance, and the remainder is the part of the
# budget never drawn. It composes — in the slot-caveat idiom of a single
# factory-born cell — the guarantees the night's organs provide:
#
#   - BUDGET     (bid <= budget): the accepted price can never exceed the job's
#     promised budget — `FieldLteField{ BID, BUDGET }`. The provider draws
#     against a bounded line, exactly the trustline `drawn <= line` — here the
#     AffineLe budget gate the prompt asks for.
#   - ACCEPTED   (write-once bid): the requester accepts a `BID` price under
#     `WriteOnce`. It is bound exactly once and tamper-evident — the accepted
#     price cannot be silently re-negotiated after acceptance.
#   - FLASHWELL  (the settlement RECORD neither mints nor burns): settlement
#     splits the budget into PAID and REFUNDED with `PAID + REFUNDED == BUDGET`
#     enforced by `AffineEq` (+ the universal no-mint `AffineLe`) over three
#     FIELD SLOTS. The VALUE is moved by the settle's Effect::Transfer, which the
#     kernel conserves per asset; the two legs are roots of one turn.
#   - one-way LIFECYCLE: POSTED->BID->SETTLED under `StrictMonotonic`, so a job
#     can never regress, double-settle, or re-bid.
#
# ⚑ The BUDGET is a PROMISE, not an escrow: the job cell cannot hold it (three
# measured executor refusals — see src/lib.rs), so the requester pays at settle
# out of its own balance and REFUNDED is the undrawn remainder, not a return.
#
# Composes dregg primitives only (FactoryDescriptor + Effect::SetField +
# Effect::EmitEvent + Effect::Transfer + StateConstraint slot caveats) — no
# domain-specific compute Effect, no Authorization::Unchecked, no placeholder
# signatures. Routes through the REAL verified executor via EmbeddedExecutor /
# submit_action.

[dependencies]
dregg-app-framework = { path = "../../app-framework" }
dregg-cell = { path = "../../cell", default-features = false }
dregg-types = { path = "../../types" }

blake3 = "1"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The on-ledger floor (factory_birth.rs) and the deos re-expression tests
# (reexpress_deos_app.rs / deos_seam.rs) mount the composed `DeosApp`'s axum
# surface (per-viewer projection, /surface.js, /manifest) and fire gated
# affordances through the embedded executor.
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"

[lints]
workspace = true
