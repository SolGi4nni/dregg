[package]
name = "starbridge-sealed-auction"
version = "0.1.0"
edition = "2024"
description = "Starbridge userspace app #2 — sealed-intent multi-agent coordination. Agents COMMIT sealed (hashed) bids before a REVEAL phase, so no agent can peek at or front-run another's bid; the winning bid SETTLES atomically through the verified per-asset executor (dregg-intent::verified_settle, the Rust mirror of the Lean `Ring.settleRing`/`SealedAuction.settle`). Mirrors `metatheory/Dregg2/Intent/SealedAuction.lean`."

# The commit-reveal lifecycle and its guarantees are PROVED in Lean
# (`metatheory/Dregg2/Intent/SealedAuction.lean`):
#   - reveal_binds_committed  — a sealed commitment opens to EXACTLY its bid (CR),
#                               so no agent can peek then switch their bid.
#   - reveal_requires_reveal_phase — no reveal binds before the commit phase closes.
#   - uncommitted_cannot_open/win  — a non-committed party can never settle.
#   - settle_atomic / settle_conserves — the award is all-or-nothing and
#                               value-neutral (reuses the verified `settleRing`).
# This crate is the executable surface: it runs the SAME state machine and
# settles the award by folding the award ring through the verified executor
# (`dregg-intent::verified_settle::settle_ring_verified`), NOT a Rust-only path.

[dependencies]
dregg-app-framework = { path = "../../app-framework" }
dregg-intent = { path = "../../intent" }
dregg-cell = { path = "../../cell", default-features = false }
dregg-types = { path = "../../types" }

blake3 = "1"
serde = { workspace = true }
serde_json = { workspace = true }

# ⚑ THE VERIFIED SETTLEMENT GATE — `register_distributed_gates()`, the ONE call that installs the
# Lean-backed `IntentVerifiedGate` this crate's awards settle through
# (`install_verified_auction_gate`). `dregg-intent`'s `settle_ring_verified` is FAIL-CLOSED: with no
# gate registered it REFUSES the award ring rather than let an unverified in-process Rust fold
# decide who won. That refusal is correct; what was missing is that nothing here ever registered
# one, so `examples/sealed_compute_auction.rs` PANICKED on its `.unwrap()` and the crate documented
# its own cure in a doc comment (`src/lib.rs:30`) with no way to apply it.
#
# This edge adds ZERO compilation: `dregg-exec-lean` is already in this crate's tree via
# `exec-lean <- dregg-sdk <- dregg-app-framework <- this crate` — MEASURED 2026-08-06 with
# `cargo tree -p starbridge-sealed-auction -i dregg-exec-lean`, not inherited from a docblock.
# Naming it directly only makes an already-linked capability reachable.
dregg-exec-lean = { path = "../../exec-lean" }

[dev-dependencies]
# The on-ledger floor (factory_birth.rs) and the deos re-expression tests
# (reexpress_deos_app.rs / deos_seam.rs) mount the composed `DeosApp`'s axum
# surface (per-viewer projection, /surface.js, /manifest) and fire gated
# affordances through the embedded executor.
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"

[lints]
workspace = true
