[package]
name = "dregg-teasting"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Integration test simulation suite for dregg — end-to-end flows across federation boundaries"

[dependencies]
dregg-types = { path = "../types" }
dregg-cell = { path = "../cell" }
dregg-cell-crypto = { path = "../cell-crypto" }
dregg-turn = { path = "../turn" }
# The γ.2 bilateral aggregate prover/verifier (`multi_cell_cross_fed_binding`)
# moved out of `dregg-turn`'s `prover` feature into its own always-compiled
# crate. This suite's `prover = []` feature never enabled anything; the test
# was riding whatever the workspace happened to unify on.
dregg-turn-prover = { path = "../turn-prover" }
dregg-circuit = { path = "../circuit" }
dregg-dsl-runtime = { path = "../dregg-dsl-runtime" }
dregg-federation = { path = "../federation" }
dregg-sdk = { path = "../sdk" }
dregg-bridge = { path = "../bridge", features = ["test-utils"] }
dregg-verifier = { path = "../verifier" }
dregg-wire = { path = "../wire" }
dregg-blocklace = { path = "../blocklace" }
# dregg-node is a binary crate (no lib target); use its deps directly instead.
# dregg-node = { path = "../node" }
dregg-commit = { path = "../commit" }
dregg-net = { path = "../net" }
dregg-intent = { path = "../intent" }
dregg-coord = { path = "../coord" }
dregg-captp = { path = "../captp" }
dregg-token = { path = "../token" }
dregg-persist = { path = "../persist" }
dregg-storage = { path = "../storage" }
# Starbridge userspace apps — for cross-app composition integration tests.
dregg-app-framework = { path = "../app-framework" }
starbridge-identity = { path = "../starbridge-apps/identity" }
starbridge-subscription = { path = "../starbridge-apps/subscription" }
starbridge-nameservice = { path = "../starbridge-apps/nameservice" }
starbridge-governed-namespace = { path = "../starbridge-apps/governed-namespace" }
starbridge-compartment-workflow-mandate = { path = "../starbridge-apps/compartment-workflow-mandate" }
starbridge-storage-gateway-mandate = { path = "../starbridge-apps/storage-gateway-mandate" }
dregg-dfa = { path = "../dfa" }
dregg-dfa-federation = { path = "../dfa-federation" }
dregg-macaroon = { workspace = true, features = ["crypto"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1"
ed25519-dalek = { version = "2", features = ["std", "hazmat"] }
sha2 = { workspace = true }
hex = "0.4"
getrandom = { workspace = true }
postcard = { version = "1", features = ["use-std"] }
serde = { workspace = true }
curve25519-dalek = { version = "4", features = ["alloc"] }

[dev-dependencies]
# TEST-ONLY: installs the Lean-verified ML-DSA cores so this suite's integration binaries can
# run a PQ operation at all. `dregg-pq` refuses one with `process::abort()` when no verified
# core is installed, and nothing in this crate's graph installed one — so the six adversarial
# binaries (fault_crash, fault_partition, consensus_liveness, revocation_propagation,
# cross_federation, cross_fed_receipt_lift) died as bare SIGABRTs and asserted NOTHING.
#
# Their entry into ML-DSA is `dregg_blocklace::Block::new` inside this crate's OWN
# `harness.rs`, which is compiled as a DEPENDENCY of a `tests/*.rs` binary — so `cfg(test)` is
# false there and an install in `src/` would be INERT. It goes at process start in each test
# file instead. See `dregg-pq-testkit`'s crate docs.
dregg-pq-testkit = { path = "../dregg-pq-testkit" }

[features]
# `prover` is in the DEFAULT set (matching `dregg-circuit`/`dregg-sdk`/`dregg-turn`/`dregg-verifier`,
# all of which default to it) and forwards to `dregg-circuit/prover`, so this crate's own
# `#[cfg(feature = "prover")]` gates ALIGN with the circuit's prover state. Without this
# forward, a bare `cfg(feature = "prover")` here is ALWAYS false (the crate has no such feature)
# while `dregg-circuit/prover` is unified ON by the sdk/turn deps — so the v1-hand-AIR test
# modules (gated `not(prover)` — silver_vision_graph_e2e + silver_vision_multi_fed_graph_e2e)
# would never compile out yet `EffectVmAir` would be absent. Under `prover` (default) they
# compile out and the rotated stack is the live one. Mirrors the `tests/` crate's feature forward.
default = ["prover"]
prover = []

[lints]
workspace = true
