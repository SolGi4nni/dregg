[package]
name = "dregg-tests"
version.workspace = true
edition.workspace = true
autobins = false

[lib]
name = "dregg_tests"
path = "src/main.rs"

[features]
# `dregg-bridge` consumption is gated to the legacy/WIP test modules.
# When those features are enabled, the dependency is required; the default
# build skips it so the workspace stays buildable while bridge undergoes
# token-vocabulary changes.
#
# `prover` is this crate's OWN gate over 2 local `#[cfg(not(feature = "prover"))]` sites in
# `src/executor_honesty_threats.rs` (the v1 `EffectVmAir` legs). It forwards nothing and always
# has: the comment that stood here claimed it forwards to `dregg-circuit/prover` and that a bare
# `cfg(feature = "prover")` would otherwise be always-false — `dregg-circuit` declares only
# `default = ["plonky3"]` / `plonky3` and has NEVER had a `prover` feature, so the described
# alignment could not happen and the `[]` body was the whole truth.
#
# ⚑ Same measured shape as `dregg-node`'s: `default = ["prover"]` and nothing in the tree passes
# `--no-default-features` to this crate, so those 2 `not(prover)` legs are compiled by NOTHING.
default = ["prover"]
prover = []
__legacy_tests = ["dep:dregg-bridge"]
__wip_tests = ["dep:dregg-bridge"]

[dependencies]
dregg-circuit = { path = "../circuit" }
dregg-commit = { path = "../commit" }
dregg-turn = { path = "../turn" }
# `full_pipeline.rs` mints a genuine proven receipt
# (`dregg_turn_prover::mint_transfer_proven_receipt`), which moved out of
# `dregg-turn`'s deleted `prover` feature into the prover crate.
dregg-turn-prover = { path = "../turn-prover" }
dregg-cell = { path = "../cell" }
dregg-cell-crypto = { path = "../cell-crypto" }
dregg-sdk = { path = "../sdk" }
dregg-types = { path = "../types" }
dregg-verifier = { path = "../verifier" }
dregg-bridge = { path = "../bridge", optional = true }
dregg-dsl-runtime = { path = "../dregg-dsl-runtime" }
dregg-token = { path = "../token", default-features = false, features = ["macaroon", "rand-deps"] }
blake3 = "1"
getrandom = { workspace = true }
postcard = { version = "1", features = ["use-std"] }
proptest = { workspace = true }

[dev-dependencies]
# `test-stubs` arms the accept path of `StubVerifier`, which otherwise fails
# closed on every proof. It belongs HERE, in `[dev-dependencies]`, and not in
# `[dependencies]` — matching turn/intent/exec-lean.
#
# WHY IT MATTERS, empirically: this crate is in the workspace's `members` AND
# `default-members`, so a bare `cargo build --release` at the root builds it.
# As a normal `[dependencies]` entry the feature UNIFIES across the graph
# (`cargo tree -p dregg-node -p dregg-tests -e features -i dregg-cell` printed
# `dregg-cell feature "test-stubs"`), arming the stub accept path inside the
# production `dregg-node` binary. Under resolver 3 a dev-dependency's features
# are not unified into a non-test build, so this placement is what makes
# `cell/Cargo.toml`'s stated guarantee true rather than aspirational.
#
# The guarantee is enforced, not asserted: `cell/src/predicate.rs` carries a
# `compile_error!` that fires if `test-stubs` is on in a `debug_assertions`-off
# build, and `tests/tests/test_stubs_firewall.rs` re-runs the `cargo tree` probe
# above as a test.
#
# The three modules that call `with_stubs()` (`state_constraint_variants`,
# `state_constraint_executor`, `witnessed_predicate_kinds`) are all `#[cfg(test)]`
# in `src/main.rs`, so they still see the feature under `cargo test`.
#
# `test-stubs-release-test-target` gates no code — it attests to `cell`'s
# `compile_error!` that this is a TEST target, which is what makes
# `cargo test --release -p dregg-tests` compile at all (this firewall test
# itself was reachable only in `debug` until 2026-07-26). `[dev-dependencies]`
# ONLY; see the note on the feature in `cell/Cargo.toml`.
dregg-cell = { path = "../cell", features = [
    "test-stubs",
    "test-stubs-release-test-target",
] }
# GUARD A (`tests/verify_routing_guard.rs`): parse `cargo metadata` JSON to enforce that every workspace
# binary reaching the ML-DSA verify stack either routes the Lean-verified core or is on the reviewed
# DELEGATES_VERIFY allowlist. serde_json is already in the workspace lock (no new fetch); a dev-dep so the
# guard rides the normal `cargo test -p dregg-tests` gate.
serde_json = "1"

[lints]
workspace = true
