[package]
name = "dregg-turn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Call-forest transaction model for atomic agent execution turns"

[dependencies]
dregg-captp = { path = "../captp" }
dregg-cell = { path = "../cell" }
dregg-cell-crypto = { path = "../cell-crypto" }
dregg-circuit = { path = "../circuit" }
# NO `dregg-circuit-prove` EDGE. Every producer that needed the heavy prove crate
# (rotation_witness leg mints, the recursive witness bundle, the custom proof-bind
# projection, `mint_transfer_proven_receipt`) now lives in `dregg-turn-prover`,
# which depends on THIS crate — never the reverse. turn's executor VERIFY
# reconstructs PIs through the `*_wide` generators, which are verify-level in
# `dregg-circuit`, so core turn is recursion-free by construction (the seL4
# verifier-PD floor and the wasm/zkvm card), not by a feature that happened to be
# off. Adding this dep back would silently re-open the cfg-brittleness class
# `docs/reference/TURN-PROVER-CRATE-EXTRACTION-DESIGN.md` exists to close.
dregg-commit = { path = "../commit" }
dregg-dsl-runtime = { path = "../dregg-dsl-runtime" }
dregg-token = { path = "../token" }
dregg-types = { path = "../types" }
blake3 = "1"
chacha20poly1305 = { workspace = true }
curve25519-dalek = { version = "4", features = ["alloc"] }
tracing = { workspace = true }
ed25519-dalek = { version = "2", features = ["hazmat"] }
# ML-DSA-65 (FIPS 204) — the post-quantum half of the HYBRID turn-authorization
# perimeter (`crate::pq`), via the shared `dregg-pq` leaf (one from-seed
# derivation + sign + fail-closed verify). Pure Rust, wasm-safe (the same
# primitive `dregg-federation` uses for the consensus HybridPq quorum).
# Unconditional: the verify path is on the wasm/zkvm card too. `dregg-turn` links
# the leaf crate directly rather than `dregg-federation`'s wrappers because
# federation depends on turn (the same "weld from the leaf primitive, not the
# wrapper" move `hints` makes above).
dregg-pq = { path = "../dregg-pq" }
getrandom = { workspace = true }
hex = "0.4"
postcard = { version = "1", features = ["alloc"] }
serde = { workspace = true }
serde_json = { workspace = true }
x25519-dalek = { workspace = true }
# Threshold-signature verifier backend (the governed-namespace `GOVERNANCE_VK`
# `Authorization::Custom` discharge). `hints` is the BLS12-381 + KZG weighted
# threshold-signature crate `dregg-federation`'s `FederationCommittee` /
# `ThresholdQC` already wrap — we link it DIRECTLY here (federation depends on
# turn, so turn must not depend on federation; this is the same "weld from the
# leaf primitive, not the wrapper" move `BridgePredicateStarkVerifier` makes
# vs. `dregg-bridge`). Gated behind the default `threshold-sig` feature so the
# wasm/zkvm path (`default-features = false`) does not pull arkworks.
hints = { path = "../hints", package = "dregg-hints", optional = true }
ark-serialize = { version = "0.5.0", optional = true }
ark-ff = { version = "0.5.0", optional = true }

# wasm32 clock for the measurement-only per-turn profiler (`DREGG_TURN_PROFILE`).
# `std::time::Instant` on `wasm32-unknown-unknown` panics ("time not implemented on
# this platform"), which would crash a real in-browser turn even though the profiler
# is OFF — the fences call `Instant::now()` unconditionally. `web-time::Instant` is a
# drop-in backed by `performance.now()`. Native builds never pull it (the profiler
# uses `std::time::Instant` there); only the wasm card path needs the shim. Mirrors
# the wasm clock seam `biscuit-auth`'s `wasm` feature closes in the wasm playground.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[features]
# THERE IS NO `prover` FEATURE. It was DELETED (PR3 of the turn-prover extraction)
# together with the `dregg-circuit-prove` dependency edge: proof PRODUCTION lives
# in the `dregg-turn-prover` CRATE, which is always compiled as itself, so a shape
# change is a compile error at the source instead of a landmine in whichever
# downstream crate's feature resolution happens to select the gated arm. Consumers
# that need to PROVE add `dregg-turn-prover`; consumers that only build/verify
# turns need nothing and no longer pull the recursion substrate. Where the executor
# needs prover behavior it takes an injected trait impl and FAILS CLOSED when none
# is injected (`shielded_verifier`, `recursive_witness_producer`, the exact-v3
# proof authority). The `dregg-cell/prover` forward went with it — `cell` has
# `prover = []`, a verified no-op.
#
# The ROTATED sovereign verify leg (`executor::verify_and_commit_proof_rotated` →
# `dregg-circuit::descriptor_ir2::verify_vm_descriptor2`) is the SOLE sovereign
# verify path (the weak v1 hand-AIR floor is RETIRED) and is unconditional.
default = ["threshold-sig"]
# Real BLS12-381 + KZG weighted-threshold-signature verifier for
# `Authorization::Custom { vk_hash }` discharges (the governed-namespace
# `commit_table_update` `GOVERNANCE_VK` fire). ON in the default set; the
# wasm/zkvm path (`default-features = false`) leaves it off so arkworks is not pulled.
threshold-sig = ["dep:hints", "dep:ark-serialize", "dep:ark-ff"]

[dev-dependencies]
proptest = { workspace = true }
sha2 = "0.10"
# Deterministic test RNG for the threshold-sig verifier's `hints` committee
# fixtures (`build_committee`). Test-scoped; the verifier itself needs no RNG.
ark-std = "0.5.0"
# Arm the `StubVerifier` accept path for plumbing tests only. The feature is
# fail-closed in production builds; enabling it here scopes the permissive stub
# behavior to `cargo test`/dev builds of this crate.
dregg-cell = { path = "../cell", features = ["test-stubs"] }
postcard = { version = "1", features = ["alloc"] }
serde_json = { workspace = true }
hex = "0.4"

[lints]
workspace = true
