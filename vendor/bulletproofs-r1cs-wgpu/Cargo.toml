[package]
name = "bulletproofs"
# Before doing a release:
# - update version field
# - update html_root_url
# - update CHANGELOG
version = "5.0.1"
authors = ["Cathie Yun <cathieyun@gmail.com>",
           "Henry de Valence <hdevalence@hdevalence.ca>",
           "Oleg Andreev <oleganza@gmail.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/zkcrypto/bulletproofs"
categories = ["cryptography"]
keywords = ["cryptography", "crypto", "ristretto", "zero-knowledge", "bulletproofs"]
description = "A pure-Rust implementation of Bulletproofs using Ristretto"
edition = "2018"

[dependencies]
curve25519-dalek = { version = "4.1.1", features = ["digest", "group", "rand_core", "serde", "dregg-wgpu-coordinates"] }
group = { version = "0.13", default-features = false }
subtle = { version = "2.5", default-features = false }
sha3 = { version = "0.10", default-features = false }
digest = { version = "0.10", default-features = false }
rand_core = { version = "0.6", default-features = false, features = ["alloc"] }
rand = { version = "0.8", default-features = false, optional = true }
byteorder = { version = "1", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc"] }
serde_derive = { version = "1", default-features = false }
thiserror = { version = "1", optional = true }
merlin = { version = "3", default-features = false }
clear_on_drop = { version = "0.2", default-features = false }
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }
rayon = { version = "1", optional = true }

[dev-dependencies]
hex = "0.3"
criterion = "0.3"
bincode = "1"
serde_json = "1"
rand_chacha = "0.3"
curve25519-dalek = { version = "4.1.1", features = ["digest", "group", "legacy_compatibility", "rand_core", "serde"] }

[features]
default = ["std"]
yoloproofs = []
wgpu-msm = ["std", "yoloproofs", "dep:wgpu", "dep:pollster", "dep:bytemuck"]
# Exact host-parallel scheduling for the independent R1CS commitment MSMs and
# the per-round inner-product generator folds.  This does not change the proof
# system or arithmetic backend; dalek remains the group-operation authority.
parallel-prover = ["std", "yoloproofs", "dep:rayon"]
std = ["rand", "rand/std", "rand/std_rng", "thiserror"]
nightly = ["subtle/nightly", "clear_on_drop/nightly"]
docs = ["nightly"]


# Keep this fork independently testable even though the workspace root also
# patches the same exact dalek fork. Cargo ignores nested patches when this
# package is consumed by the root workspace and honors it for `--manifest-path`.
[patch.crates-io]
curve25519-dalek = { path = "../curve25519-dalek-dregg" }
