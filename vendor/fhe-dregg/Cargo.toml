[features]
# ─────────────────────────────────────────────────────────────────────────────
# DREGG VENDOR DELTA — exact fhe 0.1.1 source with ONE additive seam.
#
# `mbfv-share-codec` adds a canonical wire codec for `mbfv::RelinKeyShare`
# (`to_canonical_bytes` / `from_canonical_bytes`, `mbfv/share_codec.rs`) plus
# the `round::RoundTag` discriminant it needs, and widens two `RelinKeyShare`
# fields from private to `pub(crate)` so that sibling module can reach them.
#
# It adds NO cryptography and changes NO protocol step: every polynomial is
# carried by `fhe_math::rq::Poly`'s own public exact round-trip codec, and the
# rebuilt share is the same struct the in-process path constructs. With the
# feature off, this crate is upstream fhe 0.1.1.
#
# WHY: upstream makes the relin share fully opaque (`pub(crate)` fields, no
# accessor, no Serialize impl anywhere in `mbfv`), so the multiparty relin
# ceremony physically cannot cross a process boundary. The dregg committee runs
# its parties as separate processes.
mbfv-share-codec = []
tfhe-ntt = ["fhe-math/tfhe-ntt"]
tfhe-ntt-nightly = ["fhe-math/tfhe-ntt-nightly"]

