[package]
name = "dregg-wire"
version.workspace = true
edition.workspace = true

# No [features]: the STARK verifier and the bridge verifier are CORE SEMANTICS and are
# always compiled in. (The old `stark-verifier`/`bridge` features were illusory anyway:
# the unconditional `dregg-dsl-runtime` dep pulls `dregg-circuit/plonky3` by default.)
# Feature flags in this workspace answer "what platform am I compiling for", never
# "which guarantees does this dregg have" — see .docs-history-noclaude/FEATURE-HYGIENE.md.

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26" }
rustls-pemfile = { version = "2" }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
blake3 = "1"
ed25519-dalek = { version = "2", features = ["std"] }
tracing = { workspace = true }
getrandom = { workspace = true }
dregg-circuit = { path = "../circuit" }
dregg-dsl-runtime = { path = "../dregg-dsl-runtime" }
dregg-bridge = { path = "../bridge", features = ["test-utils"] }
dregg-token = { path = "../token", default-features = false, features = ["macaroon", "rand-deps"] }
dregg-commit = { path = "../commit" }
dregg-captp = { path = "../captp" }
dregg-cell = { path = "../cell" }
dregg-federation = { path = "../federation", default-features = false }
dregg-persist = { path = "../persist" }
dregg-turn = { path = "../turn" }
dregg-types = { path = "../types" }
dregg-dfa = { path = "../dfa" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# TEST-ONLY: installs the Lean-verified ML-DSA cores. The three hybrid peer-auth / revocation tests
# in `src/server.rs` run `dregg_turn::pq::ml_dsa_verify`, which `dregg-pq` refuses with
# `process::abort()` when no core is installed. Unlike the other light leaves, `dregg-wire` already
# links the archive transitively (dregg-wire -> dregg-bridge -> dregg-lean-ffi), so this dev-dep
# adds the INSTALL and no new archive linking at all.
dregg-pq-testkit = { path = "../dregg-pq-testkit" }
# TEST-ONLY, and the same shape as the line above: `dregg_captp::validate_handoff` decides §6
# non-amplification only through `dregg-captp`'s `verified_gate` seam and REFUSES when no gate is
# registered (`e3f0e7b92` deleted the Rust rights lattice from that live path). Nothing in this
# crate's graph registered one, so the three tests in `tests/captp_delivery_tests.rs` that require a
# LEGITIMATE handoff to validate — GAP-1 three-party, GAP-2 replay (whose first presentation must be
# ADMITTED for the replay claim to have content), and the GAP-12/13 wire→receipt keystone — were RED
# for want of a startup call a native node makes and a test binary has to make for itself.
# As with `dregg-pq-testkit`: `dregg-wire` already links the archive transitively
# (dregg-wire -> dregg-bridge -> dregg-lean-ffi), so this dev-dep adds the INSTALL and no new
# archive linking at all.
dregg-exec-lean = { path = "../exec-lean" }
# For `demand_lean` — an archive-absent run must PANIC naming the missing capability rather than
# print `ok` for a test named after the verified gate it never queried. Already in the link graph
# transitively (see above); this makes the NAME reachable, not the archive.
dregg-lean-ffi = { path = "../dregg-lean-ffi" }

[[bench]]
name = "wire_bench"
harness = false

[lints]
workspace = true
