[package]
name = "dregg-zkoracle-live"
version.workspace = true
edition.workspace = true
description = "The LIVE MPC-TLS backend for the zkOracle prover: a real TLSNotary 2PC session against a real HTTPS host (api.coinbase.com, api.github.com, an Anthropic-shaped endpoint, AWS Bedrock), a SEPARATE hosted notary that co-derives the session keys and sees no plaintext, and a genuine `presentation.verify()`. This crate is UNCONDITIONAL — it has no cargo features. Depending on it is what links tlsn; not depending on it is what does not."

# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS IS A CRATE AND NOT A FEATURE.
#
# This code used to be `dregg-zkoracle-prove`'s `tlsn-live` feature. A cargo feature
# UNIFIES ACROSS A WORKSPACE RESOLVE: enabled by any selected member, it is on for
# every member. `dregg-oracle` (a root member, deliberately not a default-member) had
# `default = ["live"] -> dregg-zkoracle-prove/tlsn-live`, so
#
#   cargo test -p dregg-zkoracle-prove   ran 51 lib tests and FOUR test binaries that
#                                        reported "running 0 tests ... ok"
#   cargo test --workspace               ran the same 51 PLUS 10 real MPC-TLS 2PC tests
#
# — the same crate, two different test suites, decided by which OTHER packages cargo was
# asked about. Measured 2026-07-27; see the commit that created this crate.
#
# A DEPENDENCY EDGE does not unify. `dregg-zkoracle-prove` is now featureless: its code,
# its tests and its verifier behaviour are identical under every selection. The heavy
# `mpz` 2PC/garbling + tokio + rustls stack is still kept out of the bare dev loop, but by
# this crate being members-but-NOT-default-members, which is a property of the SELECTION
# rather than a property of some other crate's feature list.
[dependencies]
# The featureless core: the attestation type, the 3-leg composition, the CFG parse
# certificate, the injection matcher, and the endpoint fact-extractors. This crate
# supplies leg 1 (authentic) from a REAL MPC-TLS session; everything downstream of the
# authenticated body is that crate's, unchanged.
dregg-zkoracle-prove = { path = "../zkoracle-prove" }

# The REAL MPC-TLS integration (git-pinned TLSNotary @ v0.1.0-alpha.15, the SAME rev
# deco-prove pins). UNCONDITIONAL here — that is the entire point of the crate boundary.
tlsn = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", features = ["mozilla-certs"] }
tlsn-formats = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }
tlsn-server-fixture-certs = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "net", "time"] }
futures = "0.3"
futures-rustls = "0.25"
hyper = { version = "1.1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["compat", "io"] }
k256 = { version = "0.13", features = ["ecdsa"] }
bincode = "1.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
